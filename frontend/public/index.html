async function cargarRegistroHab(){
  const carrId=v('habFiltCarr'),anio=v('habFiltAnio'),tipo=v('habFiltTipo');
  const q=[];
  if(carrId)q.push('carrera_id='+carrId);
  if(anio)q.push('anio='+anio);
  if(tipo)q.push('tipo_examen='+tipo);
  const url='/api/admin/habilitados'+(q.length?'?'+q.join('&'):'');
  const datos=await api('GET',url).catch(()=>[]);
  W._habilitados=datos;
  renderRegistroHab(datos);
}
function filtRegistroHab(){
  const q=(v('habFiltBus')||'').toLowerCase();
  renderRegistroHab((W._habilitados||[]).filter(h=>{
    return((h.alumno_apellido||'')+(h.alumno_nombre||'')+(h.alumno_ci||'')).toLowerCase().includes(q);
  }));
}

    })(),
    crear_cuenta:`<div style="margin-top:10px;padding:10px;background:#eff6ff;border:1px solid #bfdbfe;border-radius:8px">

    informativo:`<div style="margin-top:8px;padding:7px 10px;background:#f8fafc;border:1px solid #e2e8f0;border-radius:6px;font-size:10px;color:#64748b">
      ℹ Requiere revisión manual en el módulo correspondiente.

  }[p.accion_disponible]||'';

  // Sección extra para duplicados e IDs
  const extra_ids_html = p.extra_ids ? `<div style="margin-top:6px;padding:6px 10px;background:#fef9c3;border-radius:6px;font-size:10px;color:#713f12">

        ${(p.nombre||p.apellido)?`<div style="font-size:12px;font-weight:700;color:#111">${p.nombre||''} ${p.apellido||''}</div>`:''}
        ${p.ci?`<div style="font-size:11px;color:#374151">CI: <strong>${p.ci}</strong></div>`:''}

        ${p.curso_alumno_anio?`<div style="font-size:11px;color:#6b7280">Año: <strong>${p.curso_alumno_anio}°</strong> ${p.curso_alumno_division||''}</div>`:''}

        ${p.docente_solicitante?`<div style="font-size:11px;color:#374151">Docente: <strong>${p.docente_solicitante}</strong></div>`:''}

        ${p.sol_id?`<div style="font-size:10px;color:#9ca3af">ID: <code>${p.sol_id}</code></div>`:''}

        ${p.detalle_raw?`<div style="font-size:10px;color:#9ca3af;word-break:break-all;max-width:200px">${p.detalle_raw.slice(0,120)}</div>`:''}
      </div>`:''}
    </div>
    ${extra_ids_html}
    ${pago_info}
    ${hist_html}
    ${accion_btns}`;

  return `<div id="diag-card-${i}" style="background:${bg};border:1.5px solid ${bdr};border-radius:10px;overflow:hidden">
    <!-- Card header — siempre visible -->
    <div onclick="diagToggle(${i})" style="padding:10px 14px;cursor:pointer;display:flex;align-items:center;gap:10px;user-select:none">
      <span style="font-size:16px">${ico}</span>
      <div style="flex:1">
        <div style="display:flex;align-items:center;gap:8px;flex-wrap:wrap">
          <span style="font-size:10px;font-weight:800;color:${tipoBadgeColor};background:${tipoBadgeBg};padding:2px 7px;border-radius:4px;letter-spacing:.04em">${tipoLabel}</span>
          <span style="font-size:12px;font-weight:600;color:#1f2937">${p.nombre||''} ${p.apellido||''}</span>
          ${p.ci?`<span style="font-size:11px;color:#6b7280">· CI: ${p.ci}</span>`:''}
          ${p.materia?`<span style="font-size:11px;color:#374151">· <strong>${p.materia}</strong></span>`:''}
        </div>

      <span id="diag-arrow-${i}" style="color:#6b7280;font-size:14px;transition:transform .2s">▼</span>
    </div>
    <!-- Card body — expandible -->
    <div id="diag-body-${i}" style="display:none;padding:0 14px 14px;border-top:1px solid ${bdr}">
      ${detail_html}
    </div>
  </div>`;
}
function diagToggle(i){
  const body=document.getElementById('diag-body-'+i);
  const arrow=document.getElementById('diag-arrow-'+i);
  if(!body)return;
  const open=body.style.display==='none';
  body.style.display=open?'block':'none';
  if(arrow)arrow.style.transform=open?'rotate(180deg)':'rotate(0deg)';
}
function diagGrupoToggle(key){
  const el=document.getElementById('diag-grupo-'+key);
  const arrow=document.getElementById('diag-garrow-'+key);
  if(!el)return;
  const open=el.style.display==='none'||el.style.display==='';
  // Default open, toggle to hide
  const currentlyVisible=el.style.display!=='none';
  el.style.display=currentlyVisible?'none':'flex';
  el.style.flexDirection='column';
  el.style.gap='6px';
  if(arrow)arrow.style.transform=currentlyVisible?'rotate(-90deg)':'rotate(0deg)';
}
async function repararSolicitud(solId,accion,btn){
  const orig=btn.textContent;
  btn.disabled=true;btn.textContent='⏳ Procesando...';
  try{
    const r=await api('POST','/api/admin/reparar-solicitudes',{sol_id:solId,accion});
    btn.textContent='✅ '+r.mensaje;btn.style.background='#166534';
    toast('✓ '+r.mensaje,'ok');
    setTimeout(()=>mostrarDiagnostico(),1800);
  }catch(e){
    btn.disabled=false;btn.textContent=orig;
    toast('Error: '+e.message,'err');
  }
}
async function repararAlumno(alumnoId,accion,btn){
  const orig=btn.textContent;
  btn.disabled=true;btn.textContent='⏳ Creando cuenta...';
  try{
    const r=await api('POST','/api/admin/reparar-alumno',{alumno_id:alumnoId,accion});
    btn.textContent='✅ '+r.mensaje;btn.style.background='#166534';
    toast('✓ '+r.mensaje+(r.email?' · Email: '+r.email:''),'ok');
    setTimeout(()=>mostrarDiagnostico(),2000);
  }catch(e){
    btn.disabled=false;btn.textContent=orig;
    toast('Error: '+e.message,'err');
  }
}
function limpFiltrosAudit(){
  ['audAccion','audTabla','audDesde','audHasta'].forEach(id=>{const el=document.getElementById(id);if(el)el.value='';});
  const b=document.getElementById('audBus');if(b)b.value='';
  cargarAuditoria();
}
async function cargarAuditoria(){
  const accion=v('audAccion'), tabla=v('audTabla');
  const desde=v('audDesde'), hasta=v('audHasta'), lim=v('audLim')||200;
  let url=`/api/admin/auditoria?limite=${lim}`;
  if(accion)url+=`&accion=${accion}`;
  if(tabla)url+=`&tabla=${tabla}`;
  if(desde)url+=`&desde=${desde}`;
  if(hasta)url+=`&hasta=${hasta}`;
  const el=document.getElementById('audTbl');
  const stats=document.getElementById('audStats');
  try{
    const r=await api('GET',url);
    W._auditData=r.registros||r;
    const regs=W._auditData;
    // Stats
    if(stats&&r.stats){
      stats.innerHTML=`<div style="display:flex;gap:8px;flex-wrap:wrap">
        ${(r.stats||[]).map(s=>`<span style="padding:4px 10px;background:#f0f4f8;border-radius:8px;font-size:11px"><strong>${s.accion}</strong>: ${s.total}</span>`).join('')}
      </div>`;
    }
    if(!el)return;
    if(!regs.length){el.innerHTML='<div class="es">Sin registros para los filtros seleccionados</div>';return;}
    const accionColor={LOGIN:'bg',UPDATE_NOTA:'bb',DELETE:'br',BACKUP:'bg',ERROR:'br',HABILITAR:'ba',PAGO:'bb',REEMPLAZO:'ba'};
    el.innerHTML=`<div class="card"><div class="tw" style="overflow-x:auto"><table style="font-size:11px;width:100%;border-collapse:collapse;min-width:900px">
      <thead><tr style="background:#f0f4f8;font-size:11px">
        <th style="padding:7px 10px;border:1px solid var(--bdr);white-space:nowrap;color:#374151">📅 Fecha / Hora</th>
        <th style="padding:7px 10px;border:1px solid var(--bdr);color:#374151">👤 Usuario</th>
        <th style="padding:7px 10px;border:1px solid var(--bdr);background:#fffbeb;color:#92400e;font-weight:700">✍ Descripción de la acción <span style="font-size:9px;font-weight:400;opacity:.7">(clic → módulo)</span></th>
        <th style="padding:7px 10px;border:1px solid var(--bdr);color:#374151">⚡ Acción / Módulo</th>
        <th style="padding:7px 10px;border:1px solid var(--bdr);color:#374151">🎯 Afecta a</th>
        <th style="padding:7px 10px;border:1px solid var(--bdr);color:#374151">🔄 Cambio</th>
        <th style="padding:7px 10px;border:1px solid var(--bdr);color:#7c3aed">📄 Raw</th>
      </tr></thead>
      <tbody id="audBody">
      ${regs.map(r=>audRow(r,accionColor)).join('')}
      </tbody>
    </table></div></div>
    <p style="font-size:11px;color:var(--t3);margin-top:6px">Mostrando ${regs.length} registros · Última actualización: ${new Date().toLocaleTimeString('es-PY')}</p>`;
  }catch(e){if(el)el.innerHTML=`<div class="es">Error: ${e.message}</div>`;}
}
function describirAccion(r){
  let det={};
  try{det=JSON.parse(r.detalle||'{}');}catch{}
  const tabla=(r.tabla||'').toLowerCase();
  const accion=(r.accion||'').toUpperCase();
  const al=det.alumno||det.alumno_nombre||det.nombre||'';
  const doc=det.docente||det.docente_nombre||'';
  const mat=det.materia||det.materia_nombre||'';
  const conc=det.concepto||'';
  const monto=det.monto?`Gs. ${Number(det.monto).toLocaleString('es-PY')}`:'';
  const carrera=det.carrera||det.carrera_nombre||'';
  const nota=det.nota_nueva!=null?det.nota_nueva:(det.nota!=null?det.nota:'');

  const ci   = det.ci||det.alumno_ci||'';
  const ip   = det.ip||'';
  const url  = det.url||det.endpoint||'';

  if(accion==='LOGIN')        return `🔐 Inició sesión en el sistema${ip?' · IP: <code>'+ip+'</code>':''}`;
  if(accion==='LOGOUT')       return `🚪 Cerró sesión`;
  if(accion==='BACKUP')       return `💾 Realizó un respaldo de la base de datos`;
  if(accion==='ERROR')        return `❌ Error del sistema${url?' en <code>'+url+'</code>':''}${det.mensaje?' — '+det.mensaje:det.error?' — '+det.error:''}`;

  // Solicitudes de alumnos (vinculaciones docente)
  if(accion==='SOLICITUD_ALUMNO'){
    let txt=`📥 Docente envió solicitud de vinculación de alumno`;
    if(al)  txt+=`: <strong>${al}</strong>`;
    if(det.apellido) txt+=` ${det.apellido}`;
    if(ci)  txt+=` · CI: ${ci}`;
    if(mat) txt+=` · Materia: ${mat}`;
    return txt;
  }
  if(accion==='RESOLVER_ALUMNO'){
    const aprobado=det.accion==='aprobar';
    let txt=`${aprobado?'✅':'❌'} ${aprobado?'Aprobó':'Rechazó'} solicitud de vinculación de alumno`;
    if(al)  txt+=`: <strong>${al}</strong>`;
    if(ci)  txt+=` · CI: ${ci}`;
    return txt;
  }
  if(accion==='SOLICITUD_EGRESO'||accion==='EGRESO'){
    let txt=`🎓 Solicitud de egreso`;
    if(al)  txt+=` de <strong>${al}</strong>`;
    if(det.carrera) txt+=` — ${det.carrera}`;
    return txt;
  }
  if(accion==='RESOLVER_EGRESO'){
    const aprobado=det.accion==='aprobar';
    let txt=`${aprobado?'🎓✅':'🎓❌'} ${aprobado?'Aprobó egreso':'Rechazó egreso'}`;
    if(al) txt+=` de <strong>${al}</strong>`;
    if(det.observacion) txt+=` · Obs: ${det.observacion}`;
    return txt;
  }

  if(accion==='PAGO'||tabla==='pagos'&&accion==='CREATE'){
    let txt=`💰 Registró un pago`;
    if(conc) txt+=` de <strong>${conc}</strong>`;
    if(monto) txt+=` por <strong>${monto}</strong>`;
    const alumnoNom=det.alumno||al;
    if(alumnoNom) txt+=` — Alumno: <strong>${alumnoNom}</strong>`;
    if(det.medio_pago) txt+=` (${det.medio_pago})`;
    return txt;
  }
  if(accion==='UPDATE_NOTA'){
    let txt=`📝 Modificó una nota`;
    if(mat)  txt+=` de <strong>${mat}</strong>`;
    if(nota!=='') txt+=` → <strong>${nota}</strong>`;
    if(al)   txt+=` (${al})`;
    return txt;
  }
  if(accion==='UPDATE_ASISTENCIA'){
    let txt=`📅 Llamó lista`;
    if(det.materia) txt+=` — <strong>${det.materia}</strong>`;
    if(det.carrera) txt+=` · ${det.carrera}`;
    if(det.anio)    txt+=` ${det.anio}`;
    if(det.seccion) txt+=` ${det.seccion}`;
    if(det.fecha)   txt+=` · Fecha: ${det.fecha}`;
    if(det.presentes!=null) txt+=` · <span style="color:#2e7d32">${det.presentes}P</span>`;
    if(det.ausentes!=null)  txt+=`/<span style="color:#c62828">${det.ausentes}A</span>`;
    if(det.docente) txt+=` · Docente: ${det.docente}`;
    return txt;
  }
  if(accion==='HABILITAR'){
    let txt=`✅ Habilitó a <strong>${al||'un alumno'}</strong> para rendir examen`;
    if(det.tipo_examen) txt+=` (${det.tipo_examen.replace(/_/g,' ')})`;
    return txt;
  }
  if(accion==='REEMPLAZO'){
    let txt=`🔄 Registró un reemplazo de docente`;
    if(doc) txt+=`: <strong>${doc}</strong>`;
    if(mat) txt+=` en ${mat}`;
    return txt;
  }
  if(accion==='HONORARIO'){
    let txt=`💵 Registró un honorario`;
    if(doc)   txt+=` para <strong>${doc}</strong>`;
    if(monto) txt+=` de <strong>${monto}</strong>`;
    return txt;
  }
  if(accion==='DELETE'){
    if(tabla==='pagos')      return `🗑 Eliminó un pago${conc?' ('+conc+')':''}${al?' de '+al:''}`;
    if(tabla==='notas')      return `🗑 Eliminó una nota${mat?' de '+mat:''}${al?' ('+al+')':''}`;
    if(tabla==='alumnos')    return `🗑 Eliminó el alumno${al?' <strong>'+al+'</strong>':''}${carrera?' — '+carrera:''}`;
    if(tabla==='examenes')   return `🗑 Eliminó un examen${mat?' de '+mat:''}`;
    if(tabla==='asignaciones')return `🗑 Eliminó una asignación de docente`;
    if(tabla==='docentes'||tabla==='usuarios') return `🗑 Eliminó el usuario${al?' <strong>'+al+'</strong>':''}`;
    return `🗑 Eliminó un registro${tabla?' en '+tabla:''}`;
  }
  if(accion==='CREATE'||accion==='INSERT'){
    if(tabla==='alumnos')        return `👤 Dio de alta al alumno${al?' <strong>'+al+'</strong>':''}${carrera?' en '+carrera:''}`;
    if(tabla==='examenes')       return `📝 Creó un examen${mat?' de <strong>'+mat+'</strong>':''}`;
    if(tabla==='asignaciones')   return `📋 Asignó un docente${doc?' <strong>'+doc+'</strong>':''}${mat?' a '+mat:''}`;
    if(tabla==='reemplazos')     return `🔄 Registró un reemplazo${doc?' de <strong>'+doc+'</strong>':''}${mat?' en '+mat:''}`;
    if(tabla==='periodos')       return `📅 Creó nuevo período lectivo${det.anio?' <strong>'+det.anio+'</strong>':''}${det.descripcion?' — '+det.descripcion:''}`;
    if(tabla==='carreras')       return `🏫 Creó la carrera <strong>${det.nombre||carrera}</strong>`;
    if(tabla==='cursos')         return `📚 Creó un curso${det.anio?' Año <strong>'+det.anio+'</strong>':''}${carrera?' — '+carrera:''}`;
    if(tabla==='materias')       return `📖 Creó la materia <strong>${mat||det.nombre||''}</strong>`;
    if(tabla==='docente_materias')return `🔗 Vinculó docente${doc?' <strong>'+doc+'</strong>':''} a materia${mat?' '+mat:''}`;
    if(tabla==='avisos')         return `📢 Publicó un aviso${det.titulo?' — <strong>'+det.titulo+'</strong>':''}`;
    if(tabla==='becas')          return `🏅 Registró beca${al?' para <strong>'+al+'</strong>':''}${det.tipo?' ('+det.tipo+')':''}`;
    if(tabla==='constancias')    return `📄 Emitió constancia${al?' para <strong>'+al+'</strong>':''}${det.tipo?' — '+det.tipo:''}`;
    return `➕ Creó un registro en <strong>${tabla}</strong>`;
  }
  if(accion==='UPDATE'){
    if(tabla==='alumnos')    return `✏ Modificó datos del alumno${al?' <strong>'+al+'</strong>':''}`;
    if(tabla==='notas')      return `📝 Actualizó nota${mat?' de <strong>'+mat+'</strong>':''}${nota!==''?' → <strong>'+nota+'</strong>':''}${al?' ('+al+')':''}`;
    if(tabla==='examenes')   return `✏ Modificó un examen${mat?' de <strong>'+mat+'</strong>':''}`;
    if(tabla==='docentes'||tabla==='usuarios') return `✏ Modificó datos del usuario${al?' <strong>'+al+'</strong>':''}`;
    if(tabla==='periodos')   return `✏ Modificó el período lectivo${det.anio?' <strong>'+det.anio+'</strong>':''}`;
    if(tabla==='carreras')   return `✏ Modificó la carrera <strong>${det.nombre||carrera}</strong>`;
    if(tabla==='materias')   return `✏ Modificó la materia <strong>${mat||det.nombre||''}</strong>`;
    if(tabla==='pagos')      return `✏ Modificó un pago${conc?' ('+conc+')':''}${al?' de <strong>'+al+'</strong>':''}`;
    return `✏ Actualizó un registro en <strong>${tabla}</strong>`;
  }

  // Fallback mejorado
  const labels={LOGIN:'Inicio de sesión',UPDATE_NOTA:'Modificación de nota',UPDATE_ASISTENCIA:'Modificación asistencia',DELETE:'Eliminación',BACKUP:'Respaldo del sistema',HABILITAR:'Habilitación',PAGO:'Pago registrado',REEMPLAZO:'Reemplazo docente',HONORARIO:'Honorario',ERROR:'Error del sistema',CREATE:'Creación',UPDATE:'Modificación',INSERT:'Creación',SOLICITUD_ALUMNO:'Solicitud vinculación alumno',RESOLVER_ALUMNO:'Resolución solicitud alumno',EGRESO:'Egreso',RESOLVER_EGRESO:'Resolución de egreso'};
  let base=`${labels[accion]||accion}${tabla&&tabla!=='sistema'?' en '+tabla:''}`;
  if(al) base+=` — ${al}`;
  return base;
}

// Determina si una fila de auditoría tiene navegación disponible
function audPuedNavegar(r){
  const tabla=(r.tabla||'').toLowerCase();
  const accion=(r.accion||'').toUpperCase();
  if(['LOGIN','LOGOUT','BACKUP','ERROR','PURGE_AUDIT'].includes(accion)) return false;
  const tabsNav=['pagos','alumnos','examenes','notas','asistencia','honorarios','reemplazos','usuarios','docentes','asignaciones','constancias','becas','habilitaciones_examen','avisos','solicitudes_alumno','solicitudes_egreso','carreras','cursos','periodos','materias','docente_materias'];
  return tabsNav.includes(tabla)||accion.includes('ALUMNO')||accion.includes('EGRESO')||accion.includes('SOLICITUD');
}

// Navega al registro exacto según el tipo de acción
async function audNavegar(audId){
  const r=(W._auditData||[]).find(x=>x.id===audId);
  if(!r) return;
  let det={};
  try{det=JSON.parse(r.detalle||'{}');}catch{}
  const tabla=(r.tabla||'').toLowerCase();
  const accion=(r.accion||'').toUpperCase();

  // ── PAGOS: abre directamente el panel del alumno ──────────────────────────
  if(tabla==='pagos'&&det.alumno_id){
    await go('pagos');          // espera a que pgPagos termine de renderizar
    await _audAbrirPanelAlumno(det.alumno_id);
    return;
  }

  // ── HABILITACIÓN: registro_id = alumno_id → abre panel en pagos ───────────
  if((tabla==='habilitaciones_examen'||accion==='HABILITAR_ALUMNO')&&r.registro_id&&r.registro_id!=='bulk'){
    await go('pagos');
    await _audAbrirPanelAlumno(r.registro_id);
    return;
  }

  // ── CONSTANCIA: detalle.alumno_id → va a constancias ──────────────────────
  if(tabla==='constancias'){
    await go('constancias');
    return;
  }

  // ── ALUMNOS / SOLICITUDES ALUMNO ──────────────────────────────────────────
  if(tabla==='alumnos'||tabla==='alumnos_grupo'||tabla==='solicitudes_alumno'||accion.includes('ALUMNO')){
    go('alumnos');
    return;
  }

  // ── SOLICITUDES EGRESO ────────────────────────────────────────────────────
  if(tabla==='solicitudes_egreso'||accion.includes('EGRESO')){
    go('alumnos');
    return;
  }

  // ── EXÁMENES ───────────────────────────────────────────────────────────────
  if(tabla==='examenes'||tabla==='asignaciones'){
    go('examenes');
    return;
  }

  // ── INSTITUCIÓN: carreras, cursos, periodos, materias ────────────────────
  if(['carreras','cursos','periodos','materias','docente_materias'].includes(tabla)){
    go('institucion');
    return;
  }

  // ── NOTAS ──────────────────────────────────────────────────────────────────
  if(tabla==='notas') { go('notas'); return; }

  // ── ASISTENCIA ─────────────────────────────────────────────────────────────
  if(tabla==='asistencia') { go('asistencia'); return; }

  // ── HONORARIOS ─────────────────────────────────────────────────────────────
  if(tabla==='honorarios') { go('honorarios'); return; }

  // ── REEMPLAZOS ─────────────────────────────────────────────────────────────
  if(tabla==='reemplazos') { go('reemplazos'); return; }

  // ── USUARIOS / DOCENTES ────────────────────────────────────────────────────
  if(tabla==='usuarios'||tabla==='docentes') { go('usuarios'); return; }

  // ── BECAS ──────────────────────────────────────────────────────────────────
  if(tabla==='becas') { go('becas'); return; }

  // ── AVISOS ─────────────────────────────────────────────────────────────────
  if(tabla==='avisos') { go('avisos'); return; }
}

function audRow(r,accionColor){
  let det={};
  try{det=JSON.parse(r.detalle||'{}');}catch{}
  const c=accionColor||{};
  const tablaLabel={notas:'Notas',pagos:'Pagos',alumnos:'Alumnos',examenes:'Exámenes',asistencia:'Asistencia',honorarios:'Honorarios',reemplazos:'Reemplazos',usuarios:'Usuarios',sistema:'Sistema',docentes:'Docentes',asignaciones:'Asignaciones',constancias:'Constancias',becas:'Becas',avisos:'Avisos',solicitudes_alumno:'Solicitudes',solicitudes_egreso:'Egreso',periodos:'Períodos',carreras:'Carreras',cursos:'Cursos',materias:'Materias'}[r.tabla||'']||r.tabla||'—';

  const rid=r.id.replace(/[^a-z0-9_]/gi,'_');

  // Columna "Afecta a" — extrae la persona o registro afectado
  const afectaNombre = det.alumno||(det.nombre&&det.apellido?(det.nombre+' '+det.apellido):null)||det.docente||det.usuario||det.alumno_nombre||'';
  const afectaCi = det.ci||det.alumno_ci||'';
  const afectaMateria = det.materia||det.materia_nombre||'';
  const afectaConcepto = det.concepto||'';

  // Columna "Cambio" — muestra diferencias (notas, pagos, etc.)
  let cambioHtml='';
  if(r.accion==='UPDATE_NOTA'||r.accion==='UPLOAD_NOTA'){
    const vieja=det.nota_vieja!=null?det.nota_vieja:'';
    const nueva=det.nota_nueva!=null?det.nota_nueva:det.nota!=null?det.nota:'';
    if(nueva!=='') cambioHtml=vieja!==''&&vieja!==nueva?`<span style="color:#dc2626;text-decoration:line-through">${vieja}</span> → <strong style="color:#166534">${nueva}</strong>`:`<strong style="color:#166534">${nueva}</strong>`;
  } else if(r.accion==='PAGO'||r.tabla==='pagos'){
    if(det.monto) cambioHtml=`<strong style="color:#166534">Gs.${Number(det.monto).toLocaleString('es-PY')}</strong>`;
  } else if(r.accion==='HABILITAR') {
    cambioHtml=`<span style="color:#d97706">${det.tipo_examen||(det.habilitado?'Habilitado':'—')}</span>`;
  } else if(r.accion==='LOGIN') {
    cambioHtml=det.ip?`<code style="font-size:9px;color:#6b7280">${det.ip}</code>`:'';
  } else if(r.accion==='ERROR') {
    cambioHtml=`<span style="color:#dc2626;font-size:10px">${(det.error||det.mensaje||'').slice(0,40)}</span>`;
  } else if(det.estado) {
    cambioHtml=`<span style="color:#2563eb">${det.estado}</span>`;
  }

  // Detalle expandido (JSON legible)
  const detalleExpanded = Object.entries(det).length
    ? Object.entries(det).map(([k,vl])=>`<div style="display:flex;gap:8px;padding:2px 0;border-bottom:1px solid #f0f0f0;font-size:10px"><span style="color:#9ca3af;min-width:120px;flex-shrink:0">${k}</span><span style="color:#374151;font-weight:500;word-break:break-all">${JSON.stringify(vl)}</span></div>`).join('')
    : '<span style="color:#9ca3af;font-size:10px">Sin detalle</span>';

  const accionBadgeMap={LOGIN:'bg',UPDATE_NOTA:'bb',UPDATE_ASISTENCIA:'bb',DELETE:'br',BACKUP:'bg',ERROR:'br',HABILITAR:'ba',PAGO:'bb',REEMPLAZO:'ba',HONORARIO:'ba',CREATE:'bg',INSERT:'bg',UPDATE:'bb',SOLICITUD_ALUMNO:'bb',RESOLVER_ALUMNO:'bg',EGRESO:'bg',CONSTANCIA:'bg',REPARAR:'ba'};

  const tdStyle='padding:5px 8px;border:1px solid var(--bdr);vertical-align:top';
  const descCell=puedNav
    ?`<td onclick="audNavegar('${r.id}')" onmouseover="this.style.background='#fef3c7'" onmouseout="this.style.background='#fffbeb'" style="${tdStyle};background:#fffbeb;cursor:pointer;max-width:260px">
        ${describirAccion(r)}
        <div class="aud-nav-hint" style="font-size:9px;color:#92400e;margin-top:2px;font-weight:600">↗ Ir al módulo</div>
      </td>`
    :`<td style="${tdStyle};max-width:260px;font-size:12px">${describirAccion(r)}</td>`;

  return `<tr id="aud-row-${rid}" style="transition:background .1s">
    <td style="${tdStyle};white-space:nowrap;font-family:monospace;font-size:10px;color:#374151">${fmtFechaHora(r.fecha)}</td>
    <td style="${tdStyle};white-space:nowrap">
      <div style="font-size:12px;font-weight:700">${r.user_nombre||'Sistema'} ${r.user_apellido||''}</div>
      <span class="bx ${r.rol==='director'?'br':r.rol==='docente'?'bb':r.rol==='alumno'?'bg':'bgr'}" style="font-size:9px">${r.rol||'sistema'}</span>
    </td>
    ${descCell}
    <td style="${tdStyle};text-align:center;white-space:nowrap">
      <span class="bx ${accionBadgeMap[r.accion]||'bgr'}" style="font-size:9px">${r.accion||'—'}</span>
      <div style="font-size:10px;color:#6b7280;margin-top:2px">${tablaLabel}</div>
    </td>
    <td style="${tdStyle};min-width:90px">${afectaNombre?`<div style="font-size:11px;font-weight:600">${afectaNombre}</div>`:''}${afectaCi?`<div style="font-size:10px;color:#6b7280">CI: ${afectaCi}</div>`:''}${afectaMateria?`<div style="font-size:10px;color:#374151">${afectaMateria}</div>`:''}${afectaConcepto?`<div style="font-size:10px;color:#374151">${afectaConcepto}</div>`:''}</td>
    <td style="${tdStyle};min-width:80px">${cambioHtml}</td>
    <td style="${tdStyle};cursor:pointer" onclick="audToggleDetalle('${rid}')" title="Ver detalle completo">
      <span style="font-size:10px;color:#7c3aed;font-weight:600">+ ver</span>
    </td>
  </tr>
  <tr id="aud-det-${rid}" style="display:none;background:#f8f9fa">
    <td colspan="7" style="padding:10px 16px;border:1px solid var(--bdr)">
      <div style="font-size:11px;font-weight:700;color:#374151;margin-bottom:6px">📋 Detalle completo del registro</div>
      <div style="display:grid;grid-template-columns:auto 1fr;gap:2px 16px;max-width:600px">${detalleExpanded}</div>
      <div style="margin-top:6px;font-size:10px;color:#9ca3af">ID: ${r.id} · Tabla: ${r.tabla||'—'} · Registro: ${r.registro_id||'—'}</div>
    </td>
  </tr>`;
}

async function limpiarDisco(){
  const logEl=document.getElementById('discoLimpiezaLog');
  if(logEl){logEl.style.display='block';logEl.innerHTML='<span style="color:#6b7280">⏳ Limpiando...</span>';}

  }

async function limpiarAuditoria(){
  const dias=prompt('Eliminar registros de auditoría más antiguos de cuántos días (mínimo 30):','90');
  if(!dias||isNaN(dias))return;
  if(!confirm(`¿Eliminar registros de auditoría anteriores a ${dias} días? Esta acción no se puede deshacer.`))return;
  try{
    const r=await api('DELETE','/api/admin/auditoria',{dias:parseInt(dias)});
    toast(`✓ ${r.eliminados} registros eliminados`,'ok');

}

let _cstTimer=null;
function debounceConstancia(){
  clearTimeout(_cstTimer);
  const val=(document.getElementById('cstBus')||{}).value||'';
  if(val.length===0){ limpiarFiltrosConstancia(); return; }
  if(val.length===1) return;
  _cstTimer=setTimeout(()=>cargarConstancias(),400);
}

function limpiarFiltrosConstancia(){
  ['cstBus','cstCarr','cstAnio'].forEach(id=>{const el=document.getElementById(id);if(el)el.value='';});
  const ph=document.getElementById('cstPlaceholder');
  const tw=document.getElementById('cstTablaWrap');
  if(ph)ph.style.display='';if(tw)tw.style.display='none';
}

async function cargarConstancias(){
  const bus=(document.getElementById('cstBus')||{}).value||'';
  const carrId=(document.getElementById('cstCarr')||{}).value||'';
  const anio=(document.getElementById('cstAnio')||{}).value||'';

  const hayFiltro=bus.length>=2||carrId||anio;
  const ph=document.getElementById('cstPlaceholder');
  const tw=document.getElementById('cstTablaWrap');
  const tbody=document.getElementById('cstCuerpo');

  if(!hayFiltro){
    if(ph)ph.style.display='';if(tw)tw.style.display='none';return;
  }
  if(ph)ph.style.display='none';if(tw)tw.style.display='';
  if(tbody)tbody.innerHTML=`<tr><td colspan="7" style="text-align:center;padding:32px;color:#94a3b8">⏳ Cargando...</td></tr>`;

  try{
    const qs=new URLSearchParams();
    if(bus.length>=2) qs.set('busqueda',bus);
    if(carrId) qs.set('carrera_id',carrId);
    // anio: filtrar client-side sobre los resultados
    let als=await api('GET','/api/alumnos?'+qs.toString());

    // Filtro de año (client-side via curso_anio)
    if(anio) als=als.filter(a=>String(a.curso_anio||'')=== String(anio));

    const cnt=document.getElementById('cstCount');
    if(!als.length){
      if(tbody)tbody.innerHTML=`<tr><td colspan="7" style="text-align:center;padding:32px;color:#94a3b8">Sin alumnos con esos filtros</td></tr>`;
      if(cnt)cnt.textContent='';return;
    }
    if(cnt)cnt.textContent=`${als.length} alumno${als.length!==1?'s':''} encontrado${als.length!==1?'s':''}`;

    if(tbody)tbody.innerHTML=als.map((a,i)=>{
      const nombre=`${a.display_apellido||a.apellido||''}, ${a.display_nombre||a.nombre||''}`;
      const carrera=a.carrera_nombre||'Sin asignar';
      const anioTxt=a.curso_anio?`${a.curso_anio}°`:'—';
      const div=a.curso_division&&a.curso_division!=='U'?a.curso_division:'U';
      const ci=a.display_ci||a.ci||'—';
      return `<tr style="border-bottom:1px solid #f1f5f9;${i%2?'background:#f8fafc':''}">
        <td style="padding:10px;text-align:center;color:#94a3b8;font-size:11px">${i+1}</td>
        <td style="padding:10px 16px;font-weight:700;color:#1e293b">${nombre}</td>
        <td style="padding:10px 12px;color:#475569;font-size:12px">${carrera}</td>
        <td style="padding:10px 12px;text-align:center;color:#475569">${anioTxt}</td>
        <td style="padding:10px 12px;text-align:center;color:#64748b;font-size:12px">${div==='U'?'Única':'Secc. '+div}</td>
        <td style="padding:10px 12px;color:#64748b;font-size:12px">${ci}</td>
        <td style="padding:10px 12px;text-align:center">
          <button onclick="imprimirConstancia('${a.id}')" style="background:#eff6ff;color:#1d4ed8;border:1px solid #93c5fd;border-radius:7px;padding:5px 12px;font-size:12px;font-weight:600;cursor:pointer" title="Emitir constancia de estudios">📄 Emitir constancia</button>
        </td>
      </tr>`;
    }).join('');
  }catch(e){
    if(tbody)tbody.innerHTML=`<tr><td colspan="7" style="text-align:center;padding:32px;color:#b91c1c">Error: ${e.message}</td></tr>`;
  }
}

    modal(`<div style="text-align:center;padding:16px">

      <h4 style="color:#e65100">Pago de constancia requerido</h4>

    <div class="f"><label>A quién va dirigido <span style="color:var(--t2);font-size:11px">(se insertará "Presente" debajo)</span></label>

async function registrarPagoConstancia(alId,arancel){
  cm();

}

  <!-- FILTROS -->
  <div class="fb" style="flex-wrap:wrap;gap:8px;margin-bottom:10px">
    <select id="filtUsRol" onchange="filtUs()" style="min-width:140px">
      <option value="">Todos los roles</option>
      <option value="director">Director</option>
      <option value="docente">Docentes</option>
      <option value="alumno">Alumnos</option>
    </select>
    <select id="filtUsCarr" onchange="filtUsCursos();filtUs()" style="min-width:160px">
      <option value="">Todas las carreras</option>
      ${carrs.map(c=>`<option value="${c.id}">${c.nombre}</option>`).join('')}
    </select>
    <select id="filtUsAnio" onchange="filtUs()" style="min-width:110px">
      <option value="">Todos los años</option>
      ${anios.map(a=>`<option value="${a}">${a}° año</option>`).join('')}
    </select>
    <select id="filtUsCurso" onchange="filtUs()" style="min-width:150px">
      <option value="">Todas las secciones</option>
      ${cursos.map(cu=>`<option value="${cu.id}">${cu.carrera_nombre} ${cu.anio}°${cu.division==='U'?'':cu.division}</option>`).join('')}
    </select>
    <input id="filtUsBus" placeholder="🔍 Buscar nombre o email..." oninput="filtUs()" style="min-width:200px"/>
  </div>
  <div id="tbUsuarios">
  ${renderTbUsuarios(data)}
  </div>`;
}
function filtUsCursos(){
  const carrId=v('filtUsCarr');
  const sel=document.getElementById('filtUsCurso');
  if(!sel)return;
  const cursos=(W._usData?.cursos||[]).filter(cu=>!carrId||cu.carrera_id===carrId);
  sel.innerHTML='<option value="">Todas las secciones</option>'+cursos.map(cu=>`<option value="${cu.id}">${cu.carrera_nombre} ${cu.anio}°${cu.division==='U'?'':cu.division}</option>`).join('');
}
function filtUs(){
  const rol=v('filtUsRol'), carrId=v('filtUsCarr'), anio=v('filtUsAnio');
  const cursoId=v('filtUsCurso'), bus=(v('filtUsBus')||'').toLowerCase();
  let l=W._usData?.data||[];
  if(rol) l=l.filter(u=>u.rol===rol);
  if(bus) l=l.filter(u=>(u.nombre||'').toLowerCase().includes(bus)||(u.apellido||'').toLowerCase().includes(bus)||(u.email||'').toLowerCase().includes(bus));
  // Para alumnos: filtrar por carrera/año/curso usando datos de als
  if(carrId||anio||cursoId){
    const alsFilt=new Set((W._usData?.als||[])
      .filter(a=>(!carrId||a.carrera_id===carrId)&&(!anio||String(a.curso_anio)===anio)&&(!cursoId||a.curso_id===cursoId))
      .map(a=>a.usuario_id).filter(Boolean));
    l=l.filter(u=>u.rol!=='alumno'||alsFilt.has(u.id));
  }
  const tb=document.getElementById('tbUsuarios');
  if(tb)tb.innerHTML=renderTbUsuarios(l);
}
function renderTbUsuarios(lista){
  if(!lista.length)return'<div class="es">Sin usuarios con esos filtros</div>';
  const rolColor={director:'br',docente:'bb',alumno:'bg'};
  return`<div class="card"><div class="tw"><table><thead><tr>
    <th>Nombre</th><th>Email / CI</th><th>Rol</th><th>Estado</th><th>Carrera / Curso</th><th></th>
  </tr></thead><tbody>
  ${lista.map(u=>{
    // Buscar datos extra si es alumno
    const al=(W._usData?.als||[]).find(a=>a.usuario_id===u.id);
    return`<tr>
      <td><strong>${u.nombre||''} ${u.apellido||''}</strong></td>
      <td style="font-size:12px">${u.email||''}<br><span style="color:var(--t3)">${u.ci||''}</span></td>
      <td><span class="bx ${rolColor[u.rol]||'bgr'}">${u.rol}</span></td>
      <td><span class="bx ${u.activo?'bg':'br'}">${u.activo?'Activo':'Inactivo'}</span></td>
      <td style="font-size:12px">${al?`${al.carrera_nombre||''} ${al.curso_anio?al.curso_anio+'°':''}`:'-'}</td>
      <td><div class="abs">
        <button class="bs i" onclick='mUsuario(${JSON.stringify(u).replace(/"/g,"&quot;")})'>Editar</button>
        <button class="bs s" onclick="mPassU('${u.id}')">Clave</button>
        <button class="bs d" onclick="delU('${u.id}')">Eliminar</button>
      </div></td>
    </tr>`;
  }).join('')}
  </tbody></table></div></div>`;
}
async function crearAccesosAlumnos(){
  if(!confirm('¿Crear/actualizar accesos para todos los alumnos sin usuario?\n\n✓ Usuario: nombre.apellido@its.edu.py\n✓ Contraseña: número de cédula (CI)\n\nLos alumnos que ya tienen acceso no serán modificados.'))return;
  try{
    const r=await api('POST','/api/alumnos/crear-accesos',{});
    toast(`✓ ${r.creados} accesos creados/actualizados${r.errores?.length?' · '+r.errores.length+' errores':''}`, r.creados?'ok':'warn', 6000);
    if(r.errores?.length) console.warn('Errores al crear accesos:', r.errores);
    go('alumnos');
  }catch(e){toast('Error: '+e.message,'err');}
}
async function reseedDocentes(){
  if(!confirm('¿Crear usuarios de acceso para todos los docentes que no tienen usuario?\nContraseña inicial: docente123'))return;
  try{
    const r=await api('POST','/api/admin/reseed-docentes',{});
    toast(`✓ ${r.created} usuarios docentes creados (${r.total} docentes en total)`,'ok',5000);
    go('usuarios');
  }catch(e){toast('Error: '+e.message,'err');}
}
function mUsuario(u){const e=!!u;modal(`<h4>${e?'Editar':'Nuevo'} usuario</h4><div class="fg">
  <div class="fr"><div class="f"><label>Nombre <span style="color:var(--red)">*</span></label><input id="un2" value="${e?u.nombre:''}" placeholder="Nombre" oninput="autoEmailUsuario()"/></div>
  <div class="f"><label>Apellido</label><input id="uap" value="${e?u.apellido||'':''}" placeholder="Apellido" oninput="autoEmailUsuario()"/></div></div>
  <div class="f"><label>C.I. <span style="color:var(--red)">*</span></label><input id="uci2" value="${e?u.ci||'':''}" placeholder="Sin puntos ni guiones — será la contraseña inicial" oninput="autoEmailUsuario()"/></div>
  <div class="f"><label>Email (usuario de ingreso)</label>
    <input id="uem" value="${e?u.email:''}" placeholder="Se completa automático desde CI"/>
    <p style="font-size:10px;color:var(--t2);margin-top:3px">📋 El usuario ingresará con este email y su CI como contraseña</p>
  </div>
  ${!e?`<div class="f"><label>Contraseña inicial</label>
    <input id="ups" type="text" placeholder="Se completa automático desde CI" style="background:#f5f5f5"/>
    <p style="font-size:10px;color:#2e7d32;margin-top:2px">✓ La contraseña se genera automáticamente desde el CI</p>
  </div>`:''}
  <div class="f"><label>Rol</label><select id="urol" onchange="onCambioRolU()">
    <option value="director" ${e&&u.rol==='director'?'selected':''}>Director — acceso total</option>
    <option value="docente" ${e&&u.rol==='docente'?'selected':''}>Docente — cargar notas y asistencia</option>
    <option value="alumno" ${e&&u.rol==='alumno'?'selected':''}>Alumno — ver sus propios datos</option>
  </select></div>
  <div id="panelDocU" style="display:none;background:#f0faf4;border:1px solid #bbf7d0;border-radius:8px;padding:10px;margin-top:-4px">
    <p style="font-size:12px;font-weight:700;color:#166534;margin-bottom:6px">👤 Vincular a docente existente</p>
    <select id="uDocId"><option value="">— Seleccionar docente —</option></select>
    <p style="font-size:11px;color:var(--t2);margin-top:4px">El docente podrá ingresar con este usuario y ver solo sus materias asignadas.</p>
  </div>
  ${e?`<div class="f"><label>Estado</label><select id="uact"><option value="1" ${u.activo?'selected':''}>Activo</option><option value="0" ${!u.activo?'selected':''}>Inactivo</option></select></div>`:''}
</div><div class="mf"><button class="bs" onclick="cm()">Cancelar</button><button class="bn" onclick="svUsuario('${e?u.id:''}')">Guardar</button></div>`);
  setTimeout(()=>onCambioRolU(),100);
}
function autoEmailUsuario(){
  const ci=(v('uci2')||'').replace(/[^0-9]/g,'');
  const nom=(v('un2')||'').toLowerCase().replace(/\s+/g,'');
  const ape=(v('uap')||'').toLowerCase().replace(/\s+/g,'');
  const em=document.getElementById('uem');
  const pw=document.getElementById('ups');
  if(em&&!em.dataset.manual){
    em.value=ci?`${ci}@its.edu.py`:(nom&&ape?`${nom}.${ape}@its.edu.py`:'');
  }
  if(pw&&ci) pw.value=ci;
}
async function svUsuario(id){
  const ci=v('uci2')||'';
  const o={nombre:v('un2'),apellido:v('uap'),ci,email:v('uem'),rol:v('urol')};
  if(!o.nombre||!o.email)return alert('Completar nombre y email');
  if(!id){
    // Contraseña = CI si existe, sino lo que ingresó
    const pwInput=v('ups')||'';
    o.password=pwInput||ci;
    if(!o.password||o.password.length<3)return alert('Ingresar cédula para generar la contraseña');
  } else {
    o.activo=v('uact')==='1';
  }
  const docId=v('uDocId');
  try{
    let userId;
    if(id){await api('PUT','/api/usuarios/directores/'+id,o);userId=id;}
    else{const r=await api('POST','/api/usuarios/directores',o);userId=r.id;}
    if(o.rol==='docente'&&docId){
      await api('PUT','/api/docentes/vincular',{docente_id:docId,usuario_id:userId}).catch(()=>{});
    }
    cm();go('usuarios');
    toast(`✓ Usuario creado — ingresar con: ${o.email} / contraseña: ${o.password||ci}`,'ok',8000);
  }catch(e){alert(e.message);}
}
function mPassU(id){modal(`<h4>Cambiar contraseña</h4><div class="fg"><div class="f"><label>Nueva contraseña</label><input id="npu" type="password" placeholder="Mín. 4 caracteres"/></div></div>
<div class="mf"><button class="bs" onclick="cm()">Cancelar</button><button class="bn" onclick="svPassU('${id}')">Guardar</button></div>`);}
async function svPassU(id){const p=v('npu');if(p.length<4)return alert('Mín. 4 caracteres');await api('PUT','/api/usuarios/directores/'+id+'/password',{password:p});cm();alert('Contraseña actualizada');}
async function delU(id){if(!confirm('¿Eliminar?'))return;try{await api('DELETE','/api/usuarios/directores/'+id);go('usuarios');}catch(e){alert(e.message);}}

// ── MI PERFIL ─────────────────────────────────────────────────────────────────
async function pgPerfil(el){
  const u=await api('GET','/api/mi-perfil');
  el.innerHTML=`<div class="ph"><h3>Mi perfil</h3></div>
  <div class="card card-p" style="max-width:460px">
    <div style="display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-bottom:20px">
      <div><div style="font-size:11px;color:var(--t3)">Nombre</div><div style="font-size:15px;font-weight:600">${u.nombre} ${u.apellido||''}</div></div>
      <div><div style="font-size:11px;color:var(--t3)">Email</div><div style="font-size:13px">${u.email}</div></div>
      <div><div style="font-size:11px;color:var(--t3)">Rol</div><span class="bx bb">${u.rol}</span></div>
    </div>
    <div style="border-top:1px solid var(--bdr);padding-top:16px">
      <p style="font-size:14px;font-weight:600;margin-bottom:12px">Cambiar contraseña</p>
      <div class="fg" style="max-width:320px">
        <div class="f"><label>Contraseña actual</label><input id="pa2" type="password" placeholder="Tu contraseña actual"/></div>
        <div class="f"><label>Nueva contraseña</label><input id="pn2" type="password" placeholder="Mín. 4 caracteres"/></div>
        <div class="f"><label>Confirmar nueva</label><input id="pc2" type="password" placeholder="Repetir"/></div>
        <button class="bn" onclick="svMiPass()">Cambiar contraseña</button>
        <div id="pmsg" style="margin-top:8px;font-size:13px"></div>
      </div>
    </div>
  </div>`;
}
async function svMiPass(){
  const actual=v('pa2'),nueva=v('pn2'),conf=v('pc2');
  const msg=document.getElementById('pmsg');
  if(!actual||!nueva)return msg.innerHTML='<span style="color:var(--red)">Completar todos los campos</span>';
  if(nueva!==conf)return msg.innerHTML='<span style="color:var(--red)">Las contraseñas no coinciden</span>';
  if(nueva.length<4)return msg.innerHTML='<span style="color:var(--red)">Mín. 4 caracteres</span>';
  try{await api('PUT','/api/mi-perfil/password',{actual,nueva});msg.innerHTML='<span style="color:var(--green)">✓ Contraseña cambiada</span>';['pa2','pn2','pc2'].forEach(id=>document.getElementById(id).value='');}
  catch(e){msg.innerHTML=`<span style="color:var(--red)">${e.message}</span>`;}
}

// ── INIT ──────────────────────────────────────────────────────────────────────
if(tok){
  try{const p=JSON.parse(atob(tok.split('.')[1]));if(p.exp*1000>Date.now()){me=p;startApp();}else{localStorage.removeItem('its_tk3');tok=null;}}
  catch{localStorage.removeItem('its_tk3');tok=null;}
}
</script>
