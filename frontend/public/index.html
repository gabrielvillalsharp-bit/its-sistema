<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1.0"/>
<title>Santísima Trinidad — Sistema Académico</title>
<!-- build:20260512-PERF-C -->
<link rel="preconnect" href="https://fonts.googleapis.com"/>
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin/>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet"/>
<style>
*{box-sizing:border-box;margin:0;padding:0;font-family:'Inter',-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif}
:root{
  --blue:#166534;--bl:#dcfce7;--bld:#14532d;
  --green:#27500A;--gl:#EAF3DE;
  --red:#791F1F;--rl:#FCEBEB;
  --amb:#633806;--al:#FAEEDA;
  --pur:#3C3489;--pl:#EEEDFE;
  --bdr:#e2e1dc;--bg:#f5f4f0;--txt:#111110;--t2:#57564f;--t3:#8a8880;
  --shadow-sm:0 1px 3px rgba(0,0,0,.06),0 1px 2px rgba(0,0,0,.04);
  --shadow-md:0 4px 16px rgba(0,0,0,.08),0 2px 6px rgba(0,0,0,.05);
  --shadow-lg:0 20px 48px rgba(0,0,0,.13),0 8px 24px rgba(0,0,0,.08);
}
body{background:var(--bg);color:var(--txt);min-height:100vh;text-rendering:optimizeLegibility;-webkit-font-smoothing:antialiased;font-feature-settings:'cv02','cv03','cv04','cv11'}
.hidden{display:none!important}
input,select,textarea,button{font-family:inherit;font-size:14px}
input,select,textarea{width:100%;padding:8px 10px;border:1px solid var(--bdr);border-radius:8px;background:#fff;color:var(--txt);outline:none;transition:border-color .15s,box-shadow .15s}
input:focus,select:focus,textarea:focus{border-color:var(--blue);box-shadow:0 0 0 3px rgba(22,101,52,.12)}
/* ── LOGIN ─────────────────────────────────── */
#lp{min-height:100vh;display:flex;align-items:center;justify-content:center;background:linear-gradient(145deg,#f0fdf4 0%,#ffffff 50%,#f0faf4 100%)}
.lc{background:#fff;border:1px solid var(--bdr);border-radius:22px;padding:2.4rem;width:390px;box-shadow:var(--shadow-md)}
.ll{text-align:center;margin-bottom:1.6rem}
.lb{
  width:116px;height:116px;
  background:#ffffff;
  border-radius:24px;
  display:inline-flex;align-items:center;justify-content:center;
  margin-bottom:14px;
  position:relative;
  box-shadow:
    0 1px 0 rgba(255,255,255,.9) inset,
    0 2px 4px rgba(0,0,0,.06),
    0 8px 24px rgba(22,101,52,.20),
    0 22px 44px rgba(22,101,52,.11);
  animation: logoFloat 4s ease-in-out infinite;
  transform-style: preserve-3d;
}
/* Borde degradado fino y bien verde */
.lb::before{
  content:'';
  position:absolute;inset:0;
  border-radius:24px;
  padding:1px;
  background:linear-gradient(135deg,#22c55e,#16a34a,#15803d,#22c55e);
  -webkit-mask:linear-gradient(#fff 0 0) content-box,linear-gradient(#fff 0 0);
  -webkit-mask-composite:xor;mask-composite:exclude;
  pointer-events:none;
}
/* Reflejo superior (efecto vidrio) */
.lb::after{
  content:'';
  position:absolute;top:0;left:0;right:0;height:45%;
  border-radius:24px 24px 60% 60%;
  background:linear-gradient(180deg,rgba(255,255,255,.45) 0%,rgba(255,255,255,0) 100%);
  pointer-events:none;z-index:2;
}
@keyframes logoFloat{
  0%,100%{transform:translateY(0px) rotateX(0deg) rotateY(0deg);box-shadow:0 2px 4px rgba(0,0,0,.06),0 8px 24px rgba(22,101,52,.20),0 22px 44px rgba(22,101,52,.11);}
  25%  {transform:translateY(-7px) rotateX(4deg) rotateY(-3deg);box-shadow:0 12px 32px rgba(22,101,52,.24),0 32px 52px rgba(22,101,52,.13);}
  50%  {transform:translateY(-10px) rotateX(0deg) rotateY(4deg);box-shadow:0 16px 40px rgba(22,101,52,.26),0 36px 58px rgba(22,101,52,.13);}
  75%  {transform:translateY(-5px) rotateX(-3deg) rotateY(-2deg);box-shadow:0 10px 28px rgba(22,101,52,.22),0 28px 48px rgba(22,101,52,.12);}
}
.lb svg{width:48px;height:48px;fill:#166634}
.lb img{width:104px;height:104px;object-fit:contain;border-radius:20px;display:block;position:relative;z-index:1}
.lc h1{font-size:20px;font-weight:700;margin-bottom:3px;letter-spacing:-.02em}
.lc p{font-size:13px;color:var(--t2)}
.f{margin-bottom:14px}
.f label{display:block;font-size:12px;color:var(--t2);margin-bottom:4px;font-weight:600;letter-spacing:.01em}
.bp{width:100%;padding:11px;background:linear-gradient(160deg,#1f8246 0%,#166534 100%);color:#fff;border:none;border-radius:10px;font-size:14px;font-weight:700;cursor:pointer;transition:all .18s;letter-spacing:.01em;box-shadow:inset 0 1px 0 rgba(255,255,255,.22),0 3px 12px rgba(22,101,52,.28)}
.bp:hover{transform:translateY(-1px);box-shadow:inset 0 1px 0 rgba(255,255,255,.28),0 6px 18px rgba(22,101,52,.34)}
.bp:active{transform:translateY(1px);box-shadow:inset 0 1px 0 rgba(255,255,255,.12),0 1px 4px rgba(22,101,52,.15)}
.dl{margin-top:1rem;padding-top:1rem;border-top:1px solid var(--bdr)}
.dl p{font-size:11px;color:var(--t3);margin-bottom:6px}
.db2{display:block;width:100%;text-align:left;padding:7px 10px;border:1px solid var(--bdr);border-radius:9px;background:#fafaf8;color:var(--t2);cursor:pointer;font-size:12px;margin-bottom:4px;transition:background .15s}
.db2:hover{background:#f1f0ec}
#le{font-size:12px;color:#b91c1c;margin-top:6px;display:none}
/* ── APP ───────────────────────────────────── */
#ap{display:flex;flex-direction:column;min-height:100vh}
.tb{display:flex;align-items:center;gap:12px;padding:0 20px;height:52px;background:linear-gradient(105deg,#0f4422 0%,#155c30 35%,#0e4020 65%,#0a2f16 100%);position:sticky;top:0;z-index:30;box-shadow:0 4px 24px rgba(10,47,22,.60),0 1px 0 rgba(255,255,255,.10) inset,0 8px 0 rgba(0,0,0,.12);transform-style:preserve-3d}
.tb::after{content:'';position:absolute;inset:0;background:linear-gradient(180deg,rgba(255,255,255,.09) 0%,rgba(255,255,255,0) 60%);pointer-events:none}
.tl{width:34px;height:34px;background:#fff;border-radius:8px;display:flex;align-items:center;justify-content:center;box-shadow:0 2px 8px rgba(0,0,0,.20),0 1px 0 rgba(255,255,255,.8) inset;flex-shrink:0;position:relative;overflow:hidden}
.tl::before{content:'';position:absolute;inset:0;border-radius:10px;padding:1px;background:linear-gradient(135deg,#22c55e,#15803d,#22c55e);-webkit-mask:linear-gradient(#fff 0 0) content-box,linear-gradient(#fff 0 0);-webkit-mask-composite:xor;mask-composite:exclude;pointer-events:none}
.tl svg{width:18px;height:18px;fill:#166534}
.tl img{width:28px;height:28px;object-fit:contain;border-radius:6px;display:block}
.tb h2{font-size:13.5px;font-weight:800;letter-spacing:-.015em;color:#fff;text-shadow:0 1px 4px rgba(0,0,0,.35),0 0 20px rgba(255,255,255,.08)}
.tr2{margin-left:auto;display:flex;align-items:center;gap:10px}
.rp{font-size:11px;padding:3px 10px;border-radius:20px;font-weight:700;letter-spacing:.01em}
.rp-director{background:rgba(255,255,255,.22);color:#fff;border:1px solid rgba(255,255,255,.35)}
.rp-docente{background:rgba(255,255,255,.18);color:#e0f7ea;border:1px solid rgba(255,255,255,.28)}
.rp-alumno{background:rgba(255,255,255,.18);color:#fef3c7;border:1px solid rgba(255,255,255,.28)}
.rp-secretaria{display:none}
.xb{font-size:12px;padding:5px 14px;border:1px solid rgba(255,255,255,.30);border-radius:8px;background:rgba(255,255,255,.15);color:#fff;cursor:pointer;transition:all .16s;font-weight:600;backdrop-filter:blur(4px)}
.xb:hover{background:rgba(255,255,255,.25);border-color:rgba(255,255,255,.50);box-shadow:0 2px 8px rgba(0,0,0,.15)}
/* ── SIDEBAR ───────────────────────────────── */
.ly{display:flex;flex:1}
.sb{width:210px;flex-shrink:0;background:linear-gradient(180deg,#ffffff 0%,#f2f2f0 100%);border-right:1.5px solid #e0dfd9;padding:6px 7px 40px;position:sticky;top:52px;height:calc(100vh - 52px);overflow-y:auto;overflow-x:hidden;box-shadow:2px 0 10px rgba(0,0,0,.07);transition:width .25s ease;scrollbar-width:thin;scrollbar-color:#c8c7c0 transparent}
.sb::-webkit-scrollbar{width:4px}
.sb::-webkit-scrollbar-track{background:transparent}
.sb::-webkit-scrollbar-thumb{background:#c8c7c0;border-radius:4px}
.sb::-webkit-scrollbar-thumb:hover{background:#a8a7a0}
.sb.col{width:52px}
.sb-toggle{display:flex;align-items:center;justify-content:center;padding:5px 6px;position:sticky;bottom:0;background:linear-gradient(180deg,transparent 0%,#f0efeb 60%);margin-top:2px}
.sb-toggle-btn{width:auto;padding:4px 10px;border-radius:6px;border:1px solid #d8d7d1;background:#fff;cursor:pointer;display:flex;align-items:center;justify-content:center;gap:4px;color:#666;transition:all .15s;box-shadow:0 1px 3px rgba(0,0,0,.07);font-size:10px;font-weight:600}
.sb.col .sb-toggle-btn .sb-toggle-lbl{display:none}
.sb-toggle-btn:hover{background:#f0fdf4;border-color:#a8d5b8;color:#166534}
.sb-toggle-btn:hover{background:#f0fdf4;border-color:#a8d5b8;color:#166534}
.sb-toggle-btn svg{transition:transform .25s ease}
.sb.col .sb-toggle-btn svg{transform:rotate(180deg)}
.ng{font-size:9px;font-weight:800;color:#9a9890;padding:11px 8px 3px;letter-spacing:.12em;text-transform:uppercase;transition:opacity .2s,height .2s;white-space:nowrap;overflow:hidden;text-shadow:0 1px 0 rgba(255,255,255,.9),0 -1px 0 rgba(0,0,0,.04)}
.sb.col .ng{opacity:0;height:0;padding:0}
.ni{display:flex;align-items:center;gap:9px;padding:7px 10px;border-radius:9px;cursor:pointer;font-size:12px;color:#1a1a18;border:none;background:none;width:100%;text-align:left;margin-bottom:1px;transition:background .15s,color .14s,transform .18s,box-shadow .18s;font-weight:600;line-height:1.3;white-space:nowrap;position:relative;transform-style:preserve-3d;transform-origin:left center}
.ni:hover{background:rgba(22,101,52,.08);color:#0f4d27;transform:translateX(3px) rotateY(-4deg);box-shadow:2px 2px 8px rgba(22,101,52,.10)}
.ni.active{background:linear-gradient(90deg,rgba(22,101,52,.13) 0%,rgba(22,101,52,.05) 100%);color:#0f4d27;font-weight:700;border-left:2px solid #1f8246;padding-left:9px;transform:none;box-shadow:none}
.sb.col .ni{justify-content:center;padding:9px 5px}
.sb.col .ni:hover{transform:scale(1.10);box-shadow:0 4px 12px rgba(22,101,52,.15)}
.sb.col .ni.active{border-left:2px solid #1f8246;padding-left:3px}
.ni-lbl{transition:opacity .2s,width .2s;overflow:hidden;white-space:nowrap}
.sb.col .ni-lbl{opacity:0;width:0;pointer-events:none}
.ni-ico{width:16px;height:16px;flex-shrink:0;stroke:currentColor;fill:none;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round;transition:transform .15s;color:#4a7a5a}
.ni:hover .ni-ico{transform:scale(1.12);color:#166534}
.ni.active .ni-ico{color:#166534}
.sb.col .ni[data-l]:hover::after{content:attr(data-l);position:absolute;left:calc(100% + 10px);top:50%;transform:translateY(-50%);background:#0f2218;color:#fff;padding:5px 12px;border-radius:8px;font-size:12px;font-weight:600;white-space:nowrap;z-index:9999;pointer-events:none;box-shadow:0 4px 14px rgba(0,0,0,.25)}
.sb.col .ni[data-l]:hover::before{content:'';position:absolute;left:calc(100% + 2px);top:50%;transform:translateY(-50%);border:6px solid transparent;border-right-color:#0f2218;z-index:9999}
/* ── NAV ACCORDION ─────────────────────────── */
.ng-hdr{display:flex;align-items:center;justify-content:space-between;width:100%;padding:9px 10px 4px;background:none;border:none;cursor:pointer;font-size:9px;font-weight:800;color:#7a7870;letter-spacing:.13em;text-transform:uppercase;border-radius:6px;transition:color .15s;margin-top:2px;text-align:left;white-space:nowrap;overflow:hidden;text-shadow:0 1px 0 rgba(255,255,255,.9),0 -1px 0 rgba(0,0,0,.04),0 1px 2px rgba(0,0,0,.06)}
.ng-hdr:hover{color:#166534;text-shadow:0 1px 0 rgba(255,255,255,.95),0 1px 4px rgba(22,101,52,.15)}
.ng-hdr svg{flex-shrink:0;transition:transform .22s ease;opacity:.45;color:#7a7870}
.ng-items{overflow:hidden;transition:max-height .24s ease}
.sb.col .ng-hdr{display:none}
.sb.col .ng-items{max-height:none!important}
/* ── AL-PAGO-ITEM ──────────────────────────── */
.al-pago-item{padding:12px 14px;border-bottom:1px solid var(--bdr);cursor:pointer;transition:background .15s,border-left .12s;display:flex;align-items:center;gap:12px;border-left:3px solid transparent}
.al-pago-item:hover{background:#f0faf4!important;border-left-color:#86efac}
.al-pago-item.activo{background:#e8f5e9!important;border-left:3px solid var(--blue)}
.al-pago-item.al-pago-sel{background:#e8f5e9!important;border-left:3px solid #1D9E75}
/* ── CONTENT ───────────────────────────────── */
.ct{flex:1;padding:22px;min-width:0;overflow-x:hidden}
.ph{display:flex;align-items:center;justify-content:space-between;margin-bottom:18px;gap:8px;flex-wrap:wrap}
.ph h3{font-size:18px;font-weight:700;letter-spacing:-.02em}
.ph-right{display:flex;gap:8px;flex-wrap:wrap}
/* ── BUTTONS ───────────────────────────────── */
.bn{padding:9px 18px;background:linear-gradient(110deg,#1f8246 0%,#166534 40%,#1a6b3a 60%,#1f8246 80%,#166534 100%);background-size:250% 100%;background-position:100% 0;color:#fff;border:none;border-radius:10px;font-size:13px;font-weight:700;cursor:pointer;transition:background-position .55s ease,transform .18s,box-shadow .18s;letter-spacing:.01em;box-shadow:inset 0 1px 0 rgba(255,255,255,.22),0 2px 8px rgba(22,101,52,.22)}
.bn:hover{background-position:0% 0;transform:translateY(-1px);box-shadow:inset 0 1px 0 rgba(255,255,255,.28),0 4px 14px rgba(22,101,52,.32)}
.bn:active{transform:translateY(1px);box-shadow:inset 0 1px 0 rgba(255,255,255,.12),0 1px 4px rgba(22,101,52,.14)}
.bs{padding:6px 14px;font-size:12px;border:1px solid var(--bdr);border-radius:8px;background:#fff;color:var(--txt);cursor:pointer;white-space:nowrap;transition:all .15s;font-weight:600;box-shadow:0 1px 3px rgba(0,0,0,.06),0 1px 0 rgba(0,0,0,.04)}
.bs:hover{background:#f7fdf9;border-color:#a8d5b8;color:var(--blue);box-shadow:0 3px 8px rgba(22,101,52,.12);transform:translateY(-1px)}
.bs:active{transform:translateY(0)}
.bs.d{color:#b91c1c;border-color:#fca5a5}.bs.d:hover{background:var(--rl);border-color:#f87171;color:#991b1b;box-shadow:0 3px 8px rgba(185,28,28,.12)}
.bs.i{color:var(--bld);border-color:#86efac}.bs.i:hover{background:var(--bl);border-color:#4ade80}
.bs.s{color:var(--green);border-color:#86efac}.bs.s:hover{background:var(--gl)}
.bs.o{color:var(--amb);border-color:#fcd34d}.bs.o:hover{background:var(--al)}
/* ── STAT CARDS ────────────────────────────── */
.sr{display:grid;grid-template-columns:repeat(auto-fit,minmax(110px,1fr));gap:12px;margin-bottom:20px}
.sc{background:#fff;border:1px solid var(--bdr);border-radius:13px;padding:14px 16px;cursor:default;box-shadow:var(--shadow-sm);transition:box-shadow .22s,border-color .22s,transform .22s;will-change:transform}
.sc .sl{font-size:10px;color:var(--t3);margin-bottom:3px;font-weight:700;text-transform:uppercase;letter-spacing:.05em}
.sc .sv{font-size:28px;font-weight:800;letter-spacing:-.02em;line-height:1.1}
.sc .ss{font-size:11px;color:var(--t2);margin-top:2px}
.sc.clickable{cursor:pointer}
.sc.clickable:hover{border-color:var(--blue);background:var(--bl);box-shadow:0 6px 20px rgba(22,101,52,.14),0 2px 6px rgba(0,0,0,.06);transform:translateY(-3px) scale(1.01)}
/* ── CARDS ─────────────────────────────────── */
.card{background:#fff;border:1px solid var(--bdr);border-radius:14px;overflow:hidden;margin-bottom:18px;box-shadow:var(--shadow-sm);transition:box-shadow .24s,border-color .24s,transform .24s;will-change:transform}
.card:hover{box-shadow:0 10px 32px rgba(0,0,0,.10),0 2px 8px rgba(0,0,0,.05);border-color:#c8e6d0;transform:translateY(-3px)}
.card-p{padding:18px}
/* ── TABLES ────────────────────────────────── */
.tw{overflow-x:auto}
table{width:100%;border-collapse:collapse;font-size:13px}
th{padding:10px 12px;text-align:left;background:#fafaf8;color:var(--t3);font-weight:700;font-size:11px;border-bottom:1px solid var(--bdr);text-transform:uppercase;letter-spacing:.04em}
td{padding:9px 12px;border-bottom:1px solid var(--bdr);color:var(--txt);vertical-align:middle}
tr:last-child td{border-bottom:none}
tr:hover td{background:#fafaf7}
/* ── BADGES ────────────────────────────────── */
.bx{display:inline-block;font-size:11px;padding:2px 9px;border-radius:20px;font-weight:700;white-space:nowrap;letter-spacing:.01em}
.bg{background:var(--gl);color:var(--green)}
.br{background:var(--rl);color:var(--red)}
.bb{background:var(--bl);color:var(--bld)}
.ba{background:var(--al);color:var(--amb)}
.bp2{background:var(--pl);color:var(--pur)}
.bgr{background:#f1f0ec;color:#5f5e5a}
.bora{background:#fff3e0;color:#e65100}
.abs{display:flex;gap:4px;flex-wrap:wrap}
/* ── MISC ──────────────────────────────────── */
.es{text-align:center;padding:48px;color:var(--t3);font-size:14px}
.fb{display:flex;gap:8px;margin-bottom:14px;flex-wrap:wrap;align-items:center}
.fb select{padding:7px 10px;font-size:13px;border:1px solid var(--bdr);border-radius:8px;background:#fff;color:var(--txt);width:auto}
/* ── MODAL ─────────────────────────────────── */
.mb{position:fixed;inset:0;background:rgba(0,0,0,.38);display:flex;align-items:flex-start;justify-content:center;padding:40px 16px;z-index:9999;overflow-y:auto;backdrop-filter:blur(3px)}
.modal{background:#fff;border:1px solid var(--bdr);border-radius:18px;padding:1.8rem;width:100%;max-width:560px;box-shadow:var(--shadow-lg)}
.modal h4{font-size:17px;font-weight:700;margin-bottom:1.3rem;letter-spacing:-.015em}
.modal-lg{max-width:860px}
.fg{display:grid;gap:12px}
.fr{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.fr3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:10px}
.mf{display:flex;justify-content:flex-end;gap:8px;margin-top:1.3rem;padding-top:1rem;border-top:1px solid var(--bdr)}
/* ── NOTAS ─────────────────────────────────── */
.nota-inp{width:58px!important;padding:5px 4px!important;text-align:center;border:1px solid var(--bdr);border-radius:6px;font-size:13px}
.nota-inp:focus{border-color:var(--blue)}
.nota-inp:disabled{background:#f5f5f3;color:var(--t3);cursor:not-allowed}
.al-pago-item:hover{background:#f0faf4!important}
.al-pago-item.activo{background:#e8f5e9!important;border-left:3px solid var(--green)}
.nota-col{text-align:center}
.prom-tag{display:inline-flex;align-items:center;justify-content:center;min-width:36px;padding:4px 8px;border-radius:8px;font-size:14px;font-weight:800}
.nota-tag{display:inline-flex;align-items:center;justify-content:center;min-width:28px;padding:4px 10px;border-radius:20px;font-size:15px;font-weight:800}
.n5{background:#EAF3DE;color:#27500A}
.n4{background:#E6F1FB;color:#0C447C}
.n3{background:#EEEDFE;color:#3C3489}
.n2{background:#FAEEDA;color:#633806}
.n1{background:#FCEBEB;color:#791F1F}
.n-{background:#f1f0ec;color:#888}
/* ── ASISTENCIA ────────────────────────────── */
.asopt{padding:7px 14px;border:1px solid var(--bdr);border-radius:8px;cursor:pointer;font-size:14px;font-weight:700;background:#fff;color:var(--t2);transition:background .12s,border-color .12s}
.asopt.P{background:var(--gl);color:var(--green);border-color:#86efac}
.asopt.A{background:var(--rl);color:var(--red);border-color:#fca5a5}
.asopt.T{background:var(--al);color:var(--amb);border-color:#fcd34d}
.asopt.J{background:var(--bl);color:var(--bld);border-color:#86efac}
/* ── MISC SMALL ────────────────────────────── */
.cur-tag{display:inline-flex;font-size:11px;padding:2px 8px;border-radius:6px;background:var(--pl);color:var(--pur);font-weight:600}
.tip{font-size:12px;color:var(--t3);margin-top:4px}
.peso-box{background:#fafaf8;border:1px solid var(--bdr);border-radius:10px;padding:12px;font-size:12px}
.peso-box .titulo{font-weight:700;font-size:13px;margin-bottom:6px}
.iz{border:2px dashed var(--bdr);border-radius:10px;padding:24px;text-align:center;cursor:pointer;color:var(--t2);font-size:13px;transition:border-color .15s,background .15s}
.iz:hover{border-color:var(--blue);color:var(--blue);background:var(--bl)}
.ir{margin-top:10px;padding:10px;border-radius:8px;font-size:13px}
.ir.ok{background:var(--gl);color:var(--green)}
.ir.err{background:var(--rl);color:var(--red)}
.rec-indicator{font-size:10px;color:var(--amb);font-weight:600;display:block}
/* ── AVISOS ────────────────────────────────── */
.aviso-card{border:1px solid var(--bdr);border-radius:12px;padding:14px 18px;margin-bottom:10px;background:#fff;box-shadow:var(--shadow-sm);transition:box-shadow .15s}
.aviso-card:hover{box-shadow:var(--shadow-md)}
.aviso-card.urgente{border-left:4px solid var(--red);background:var(--rl)}
.aviso-card.examen{border-left:4px solid var(--blue);background:var(--bl)}
.aviso-card.administrativo{border-left:4px solid var(--amb);background:var(--al)}
.aviso-card.info{border-left:4px solid var(--green);background:var(--gl)}
.aviso-titulo{font-size:14px;font-weight:700;margin-bottom:4px}
.aviso-meta{font-size:11px;color:var(--t3);margin-top:6px}
/* ── CALENDARIO ────────────────────────────── */
.cal-grid{display:grid;grid-template-columns:repeat(7,1fr);gap:5px;margin-bottom:12px}
.cal-hdr{text-align:center;font-size:11px;font-weight:700;color:var(--t3);padding:4px;letter-spacing:.04em}
.cal-day{border:1px solid var(--bdr);border-radius:10px;padding:6px;min-height:66px;background:#fff;font-size:12px;cursor:default;transition:border-color .12s,background .12s;box-shadow:var(--shadow-sm)}
.cal-day.today{border-color:var(--blue);background:var(--bl);box-shadow:0 0 0 1px var(--blue)}
.cal-day.has-exam{cursor:pointer}
.cal-day.has-exam:hover{background:#f0f9ff;border-color:#86efac}
.cal-day-num{font-size:11px;color:var(--t3);margin-bottom:4px;font-weight:700}
.cal-event{font-size:10px;border-radius:5px;padding:2px 5px;margin-bottom:2px;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.cal-event.Parcial{background:var(--bl);color:var(--bld)}
.cal-event.Final{background:var(--rl);color:var(--red)}
.cal-event.Recuperatorio{background:var(--al);color:var(--amb)}
/* ── DASHBOARD WELCOME ─────────────────────── */
.dash-hero{background:linear-gradient(135deg,#166534 0%,#1a6b3a 40%,#1f8246 100%);border-radius:18px;padding:22px 26px;margin-bottom:18px;position:relative;overflow:hidden;box-shadow:0 8px 32px rgba(22,101,52,.28)}
.dash-hero::before{content:'';position:absolute;top:-40px;right:-40px;width:220px;height:220px;border-radius:50%;background:rgba(255,255,255,.06);pointer-events:none}
.dash-hero::after{content:'';position:absolute;bottom:-60px;right:80px;width:160px;height:160px;border-radius:50%;background:rgba(255,255,255,.04);pointer-events:none}
.dash-hero-inner{position:relative;z-index:1;display:flex;align-items:center;gap:24px;flex-wrap:wrap}
.dash-hero-left{flex:1;min-width:200px}
.dash-hero-right{flex:1;min-width:200px;max-width:380px;background:rgba(255,255,255,.12);border:1px solid rgba(255,255,255,.20);border-radius:12px;padding:12px 15px;backdrop-filter:blur(4px)}
.dash-greeting{font-size:22px;font-weight:800;color:#fff;letter-spacing:-.03em;margin-bottom:3px}
.dash-sub{font-size:12px;color:rgba(255,255,255,.72);margin-bottom:14px}
.dash-qa{display:flex;gap:7px;flex-wrap:wrap}
.dash-qa-btn{padding:7px 14px;background:rgba(255,255,255,.18);border:1px solid rgba(255,255,255,.25);border-radius:9px;color:#fff;font-size:11px;font-weight:700;cursor:pointer;transition:background .15s,transform .15s}
.dash-qa-btn:hover{background:rgba(255,255,255,.28);transform:translateY(-1px)}
.frase-txt{font-size:11px;font-style:italic;color:#fff;line-height:1.55;font-weight:600;text-shadow:0 1px 3px rgba(0,0,0,.20)}
.frase-autor{font-size:10px;color:rgba(255,255,255,.82);margin-top:5px;font-weight:700;letter-spacing:.03em}
.dash-kpi{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:12px;margin-bottom:20px}
.kpi-card{background:#fff;border:1px solid var(--bdr);border-radius:14px;padding:16px 18px;box-shadow:var(--shadow-sm);transition:transform .22s,box-shadow .22s,border-color .22s;will-change:transform;position:relative;overflow:hidden}
.kpi-card::before{content:'';position:absolute;top:0;left:0;right:0;height:3px;border-radius:14px 14px 0 0}
.kpi-card.green::before{background:linear-gradient(90deg,#1f8246,#166534)}
.kpi-card.red::before{background:linear-gradient(90deg,#f87171,#b91c1c)}
.kpi-card.amber::before{background:linear-gradient(90deg,#fbbf24,#b45309)}
.kpi-card.blue::before{background:linear-gradient(90deg,#60a5fa,#1d4ed8)}
.kpi-card.purple::before{background:linear-gradient(90deg,#a78bfa,#6d28d9)}
.kpi-card:hover{transform:translateY(-3px);box-shadow:0 10px 28px rgba(0,0,0,.09);border-color:#cde8d5}
.kpi-icon{font-size:22px;margin-bottom:8px;display:block}
.kpi-val{font-size:30px;font-weight:800;letter-spacing:-.03em;line-height:1;margin-bottom:3px}
.kpi-lbl{font-size:11px;color:var(--t3);font-weight:700;text-transform:uppercase;letter-spacing:.05em}
/* ── PROGRESO ──────────────────────────────── */
.prog-bar{height:6px;border-radius:3px;background:#e5e4df;overflow:hidden;margin-top:4px}
.prog-fill{height:100%;border-radius:3px;background:linear-gradient(90deg,var(--blue),#1f8246);transition:width .3s}
/* ── PRINT ─────────────────────────────────── */
@media print{
  .sb,.tb,.mf,.bn,.bs,.fb,.abs{display:none!important}
  .ct{padding:0}
  body{background:#fff}
  .card{border:none;box-shadow:none}
}
/* ── TOAST ─────────────────────────────────── */
#toast-container{position:fixed;top:20px;right:20px;z-index:10000;display:flex;flex-direction:column;gap:8px;pointer-events:none}
.toast{display:flex;align-items:center;gap:10px;padding:12px 18px;border-radius:13px;font-size:13px;font-weight:600;min-width:220px;max-width:360px;box-shadow:var(--shadow-md);animation:toastIn .25s ease;pointer-events:auto}
.toast.ok{background:#e8f5e9;color:#2e7d32;border:1px solid #c8e6c9}
.toast.err{background:#ffebee;color:#c62828;border:1px solid #ffcdd2}
.toast.info{background:#dcfce7;color:#166534;border:1px solid #bbf7d0}
.toast.warn{background:#fff3e0;color:#e65100;border:1px solid #ffe0b2}
@keyframes toastIn{from{opacity:0;transform:translateX(40px)}to{opacity:1;transform:translateX(0)}}
/* ── SKELETON ──────────────────────────────── */
.skel{background:linear-gradient(90deg,#f0f0ee 25%,#e6e5e2 50%,#f0f0ee 75%);background-size:200% 100%;animation:shimmer 1.4s infinite;border-radius:6px;display:inline-block}
@keyframes shimmer{0%{background-position:200% 0}100%{background-position:-200% 0}}
/* ── ANIMATIONS ────────────────────────────── */
.saved-ok{display:inline-block;font-size:10px;color:#2e7d32;font-weight:700;margin-left:4px;animation:fadeInQ .3s ease}
@keyframes fadeInQ{from{opacity:0;transform:scale(.8)}to{opacity:1;transform:scale(1)}}
@keyframes pulse-bell{0%,100%{transform:scale(1)}40%{transform:scale(1.25) rotate(-8deg)}60%{transform:scale(1.2) rotate(8deg)}}
/* ── SCROLLBAR ─────────────────────────────── */
::-webkit-scrollbar{width:5px;height:5px}
::-webkit-scrollbar-track{background:transparent}
::-webkit-scrollbar-thumb{background:#d0cfc9;border-radius:3px}
::-webkit-scrollbar-thumb:hover{background:#b8b7b1}
/* ── SPLASH ────────────────────────────────── */
#splash{position:fixed;inset:0;z-index:99999;display:flex;flex-direction:column;align-items:center;justify-content:center;background:linear-gradient(145deg,#f0fdf4 0%,#ffffff 50%,#ecfdf5 100%);transition:opacity .5s ease,visibility .5s ease;pointer-events:none}
#splash.hide{opacity:0;visibility:hidden}
.sp-logo{width:108px;height:108px;background:#fff;border-radius:26px;display:inline-flex;align-items:center;justify-content:center;position:relative;box-shadow:0 2px 4px rgba(0,0,0,.06),0 12px 32px rgba(22,101,52,.22),0 28px 56px rgba(22,101,52,.12);animation:spFloat 1.8s ease-out both;transform-style:preserve-3d}
.sp-logo::before{content:'';position:absolute;inset:0;border-radius:26px;padding:1.5px;background:linear-gradient(135deg,#22c55e,#15803d,#22c55e);-webkit-mask:linear-gradient(#fff 0 0) content-box,linear-gradient(#fff 0 0);-webkit-mask-composite:xor;mask-composite:exclude;pointer-events:none}
.sp-logo img{width:96px;height:96px;object-fit:contain;border-radius:22px;display:block;position:relative;z-index:1}
.sp-logo svg{width:52px;height:52px;fill:#166634}
.sp-title{margin-top:24px;font-size:22px;font-weight:800;letter-spacing:-.025em;color:#166534;animation:spFade 1.8s .3s ease-out both;text-align:center}
.sp-sub{margin-top:6px;font-size:13px;font-weight:500;color:#5a9e78;animation:spFade 1.8s .5s ease-out both}
.sp-bar{margin-top:32px;width:140px;height:3px;border-radius:2px;background:#dcfce7;overflow:hidden;animation:spFade 1.8s .4s ease-out both}
.sp-bar-fill{height:100%;border-radius:2px;background:linear-gradient(90deg,#22c55e,#166534);animation:spLoad 1.1s .2s ease-out both}
@keyframes spFloat{0%{opacity:0;transform:translateY(24px) scale(.88)}60%{transform:translateY(-6px) scale(1.02)}100%{opacity:1;transform:translateY(0) scale(1)}}
@keyframes spFade{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:translateY(0)}}
@keyframes spLoad{from{width:0}to{width:100%}}
</style>
</head>
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.min.js"></script>
<body>
<div id="toast-container"></div>

<div id="splash">
  <div class="sp-logo" id="splashLogoCont">
    <svg viewBox="0 0 24 24"><path d="M12 3L2 8v8l10 5 10-5V8L12 3zm0 2.18L20 9v.09L12 13.09 4 9.09V9l8-3.82zM4 11.28l8 4 8-4V17l-8 4-8-4v-5.72z"/></svg>
  </div>
  <div class="sp-title">Instituto Técnico Superior</div>
  <div class="sp-sub">Santísima Trinidad</div>
  <div class="sp-bar"><div class="sp-bar-fill"></div></div>
</div>

<div id="lp">
<div class="lc">
  <div class="ll">
    <div class="lb" id="loginLogoCont">
      <!-- Logo dinámico: se carga desde /api/logo; fallback al ícono SVG -->
      <svg id="loginLogoSvg" viewBox="0 0 24 24"><path d="M12 3L2 8v8l10 5 10-5V8L12 3zm0 2.18L20 9v.09L12 13.09 4 9.09V9l8-3.82zM4 11.28l8 4 8-4V17l-8 4-8-4v-5.72z"/></svg>
    </div>
    <h1>Instituto Técnico Superior</h1>
    <p>Santísima Trinidad — Sistema Académico</p>
  </div>
  <div class="f"><label>Email o C.I.</label><input id="lem" placeholder="Ej: 1234567 o director@its.edu.py" onkeydown="if(event.key==='Enter')document.getElementById('lps').focus()"/></div>
  <div class="f"><label>Contraseña</label><input id="lps" type="password" placeholder="Tu número de cédula" onkeydown="if(event.key==='Enter')doLogin()"/></div>
  <button class="bp" onclick="doLogin()">Ingresar al sistema</button>
  <div id="le" style="font-size:12px;color:#b91c1c;margin-top:6px;padding:8px;background:#fff3f3;border-radius:6px;display:none">Email/CI o contraseña incorrectos</div>
  <div style="font-size:11px;color:#888;margin-top:8px;text-align:center">
    Alumnos: ingresá con tu N° de cédula como usuario y contraseña
  </div>
</div>
</div>

<div id="ap" class="hidden">
<div class="tb">
  <div class="tl" id="sysLogoCont"><svg viewBox="0 0 24 24"><path d="M12 3L2 8v8l10 5 10-5V8L12 3zm0 2.18L20 9v.09L12 13.09 4 9.09V9l8-3.82zM4 11.28l8 4 8-4V17l-8 4-8-4v-5.72z"/></svg></div>
  <div>
    <h2>Instituto Técnico Superior — Santísima Trinidad</h2>
    <p style="font-size:9px;margin-top:1px;font-style:italic;color:rgba(255,255,255,.65)">Desarrollado por Abg. Gabriel Sharp</p>
  </div>
  <div class="tr2">
    <span id="un" style="font-size:13px;color:#fff;font-weight:700;text-shadow:0 1px 3px rgba(0,0,0,.30)"></span>
    <span id="rp" class="rp"></span>
    <button id="notif-bell-btn" onclick="go('avisos')" title="Avisos pendientes" style="display:none;position:relative;background:#e53935;color:#fff;border:none;border-radius:8px;padding:5px 12px;font-size:12px;font-weight:700;cursor:pointer;animation:pulse-bell .9s infinite;margin-right:4px">
      🔔 <span id="notif-bell-count">0</span>
    </button>
    <button class="xb" onclick="logout()">Salir</button>
  </div>
</div>
<div class="ly">
  <nav class="sb" id="nav"></nav>
  <div class="ct" id="mc"></div>
</div>
</div>
<div id="mr"></div>

<script>
const API='';let tok=localStorage.getItem('its_tk3');let me=null;const W=window;

// ── TOAST NOTIFICATIONS ───────────────────────────────────────────────────────
function toast(msg, tipo='info', duracion=3500){
  const c=document.getElementById('toast-container');
  if(!c)return;
  const icons={ok:'✓',err:'✗',info:'ℹ',warn:'⚠'};
  const t=document.createElement('div');
  t.className=`toast ${tipo}`;
  t.innerHTML=`<span style="font-size:16px">${icons[tipo]||'ℹ'}</span><span style="flex:1">${msg}</span><button onclick="this.parentElement.remove()" style="background:none;border:none;cursor:pointer;color:inherit;font-size:16px;padding:0 0 0 4px">×</button>`;
  c.appendChild(t);
  setTimeout(()=>{t.style.animation='toastIn .25s ease reverse';setTimeout(()=>t.remove(),220);},duracion);
}

// ── SKELETON LOADER ───────────────────────────────────────────────────────────
function skeletonTable(cols=5, rows=6){
  return `<div class="card"><div style="padding:16px">${Array(rows).fill(0).map(()=>`<div style="display:flex;gap:12px;margin-bottom:10px">${Array(cols).fill(0).map(()=>`<div class="skel" style="height:18px;flex:1"></div>`).join('')}</div>`).join('')}</div></div>`;
}

// ── FEEDBACK GUARDADO EN NOTAS ────────────────────────────────────────────────
function showSaved(cellId){
  const el=document.getElementById(cellId);
  if(!el)return;
  const s=document.createElement('span');
  s.className='saved-ok';s.textContent='✓';
  el.appendChild(s);
  setTimeout(()=>s.remove(),2000);
}

async function api(m,u,b,isFile){
  const o={method:m,headers:{}};
  if(tok)o.headers.Authorization='Bearer '+tok;
  if(b&&!isFile){o.headers['Content-Type']='application/json';o.body=JSON.stringify(b);}
  else if(b)o.body=b;
  try{
    const r=await fetch(API+u,o);
    if(r.status===401){
      // Solo redirigir si ya estábamos logueados (tok existía)
      if(tok){
        tok=null;localStorage.removeItem('its_tk3');
        toast('Sesión expirada. Por favor ingresá nuevamente.','warn',5000);
        setTimeout(()=>{me=null;document.getElementById('app').style.display='none';document.getElementById('lp').style.display='flex';},2000);
      }
      const e=await r.json().catch(()=>({error:'Credenciales incorrectas'}));
      throw new Error(e.error||'Credenciales incorrectas');
    }
    if(!r.ok){const e=await r.json().catch(()=>({error:'Error del servidor'}));throw new Error(e.error||'Error');}
    return r.json();
  }catch(e){
    if(e.message==='Failed to fetch'||e.message==='NetworkError when attempting to fetch resource.'||e.name==='TypeError'){
      throw new Error('Error de conexión — verificá que el servidor esté en marcha');
    }
    throw e;
  }
}

async function doLogin(){
  document.getElementById('le').style.display='none';
  const email=v('lem'), password=v('lps');
  if(!email||!password){
    document.getElementById('le').textContent='Ingresá email/CI y contraseña';
    document.getElementById('le').style.display='block';
    return;
  }
  try{
    const res=await api('POST','/api/login',{email,password});
    tok=res.token;me=res.user;localStorage.setItem('its_tk3',tok);startApp();
  }catch(e){
    const msg=e.message==='Sesión expirada'?'Credenciales incorrectas':e.message||'Credenciales incorrectas';
    document.getElementById('le').textContent=msg;
    document.getElementById('le').style.display='block';
  }
}
function logout(){tok=null;me=null;localStorage.removeItem('its_tk3');show('lp');hide('ap');}

// Carga el logo institucional (login + topbar del sistema)
(function cargarLogoLogin(){
  fetch('/api/logo').then(r=>r.json()).then(data=>{
    if(!data.logo) return;
    // Splash
    const sp=document.getElementById('splashLogoCont');
    if(sp) sp.innerHTML=`<img src="${data.logo}" alt="Logo ITS"/>`;
    // Login
    const lc=document.getElementById('loginLogoCont');
    if(lc) lc.innerHTML=`<img src="${data.logo}" alt="Logo ITS"/>`;
    // Topbar del sistema (puede no existir aún; se reintenta al hacer startApp)
    const sc=document.getElementById('sysLogoCont');
    if(sc) sc.innerHTML=`<img src="${data.logo}" alt="Logo ITS"/>`;
    // Guardamos para cuando startApp lo necesite
    window._itsLogo=data.logo;
  }).catch(()=>{});
})();
// Auto-dismiss splash after 1.4s regardless of login state
(function dismissSplash(){
  setTimeout(()=>{
    const sp=document.getElementById('splash');
    if(sp){sp.classList.add('hide');}
  },1400);
})();

function startApp(){
  hide('lp');show('ap');
  document.getElementById('un').textContent=me.nombre+' '+me.apellido;
  // Aplicar logo en topbar (por si ya se cargó antes del login)
  if(window._itsLogo){
    const sc=document.getElementById('sysLogoCont');
    if(sc) sc.innerHTML=`<img src="${window._itsLogo}" alt="Logo ITS"/>`;
  }
  // Cargar logo institucional globalmente para todas las actas
  api('GET','/api/institucion').then(i=>{ W._instLogo=i.logo_base64||''; }).catch(()=>{ W._instLogo=''; });
  const rp=document.getElementById('rp');rp.textContent=me.rol;rp.className='rp rp-'+me.rol;
  buildNav();
  const inicio='dashboard';
  go(inicio);
  // ── Notificación de avisos ─────────────────────────────────────────────────
  async function checkNotifAvisos(){
    try{
      let avs=await api('GET','/api/avisos');
      if(me.rol!=='director'){
        avs=(avs||[]).filter(a=>{
          const esReemplazo=a.titulo?.toLowerCase().includes('reemplazo');
          const esSoloDirector=a.destinatario==='director'&&a.autor_id!==me.id;
          const esAvisoExamenAuto=a.tipo==='examen'&&a.autor_id!==me.id;
          return !esReemplazo&&!esSoloDirector&&!esAvisoExamenAuto;
        });
      }
      const vistos=JSON.parse(localStorage.getItem('its_avisos_vistos')||'[]');
      const nuevos=(avs||[]).filter(a=>!vistos.includes(a.id));
      // Para docentes: contar exámenes próximos (7 días) no vistos
      let examCount=0;
      if(me.rol==='docente'&&me.docenteId){
        try{
          const hoy=new Date().toISOString().split('T')[0];
          const lim=new Date();lim.setDate(lim.getDate()+7);
          const limStr=lim.toISOString().split('T')[0];
          const todos=await api('GET',`/api/examenes?desde=${hoy}&hasta=${limStr}`);
          const vistoEx=JSON.parse(localStorage.getItem('its_exam_vistos')||'[]');
          examCount=todos.filter(e=>{
            const esDoc=e.docente_id===me.docenteId||(e.docente_nombre&&`${e.docente_nombre} ${e.docente_apellido}`===`${me.nombre} ${me.apellido}`);
            return esDoc&&!vistoEx.includes(e.id);
          }).length;
          W._examNotifCount=examCount;
        }catch{}
      }
      const total=nuevos.length+examCount;

      // ── 1. Botón de notificación en el header (siempre visible) ──────────
      const bellBtn=document.getElementById('notif-bell-btn');
      const bellCount=document.getElementById('notif-bell-count');
      if(bellBtn){
        bellBtn.style.display=total?'inline-block':'none';
        if(bellCount) bellCount.textContent=total;
        bellBtn.style.background=examCount>0?'#D85A30':'#e53935';
        bellBtn.title=total===1?'1 aviso pendiente':`${total} avisos pendientes — clic para ver`;
      }
      // ── 1b. Botón en la cima del sidebar ──────────────────────────────────
      const navBtn=document.getElementById('nav-avisos-btn');
      const navTxt=document.getElementById('nav-avisos-txt');
      if(navBtn){
        navBtn.style.display=total?'block':'none';
        if(navTxt) navTxt.textContent=total===1?'1 aviso sin leer':`${total} avisos sin leer`;
      }

      // ── 2. Badge en el botón ni-avisos (dentro del grupo) ─────────────────
      const btn=document.getElementById('ni-avisos');
      if(btn){
        let badge=btn.querySelector('.notif-badge');
        if(!badge){
          badge=document.createElement('span');
          badge.className='notif-badge';
          badge.style.cssText='display:inline-flex;align-items:center;justify-content:center;color:#fff;font-size:10px;font-weight:800;border-radius:50%;min-width:20px;height:20px;padding:0 4px;margin-left:auto;box-shadow:0 2px 6px rgba(0,0,0,.3)';
          btn.appendChild(badge);
        }
        badge.textContent=total||'';
        badge.style.display=total?'inline-flex':'none';
        const col=examCount>0?'#D85A30':'#e53935';
        badge.style.background=col;
        badge.style.animation=total?'pulse-bell .9s infinite':'none';
        btn.style.fontWeight=total?'800':'';
        btn.style.color=total?'#166534':'';
      }

      // ── 3. Badge en el encabezado del grupo que contiene "avisos" ─────────
      const groups=window._navGroups||[];
      const grpIdx=groups.findIndex(g=>g.i.some(i=>i.id==='avisos'));
      if(grpIdx>=0){
        const hdr=document.getElementById('ngh-'+grpIdx);
        if(hdr){
          let hBadge=hdr.querySelector('.notif-badge');
          if(!hBadge){
            hBadge=document.createElement('span');

        }
      }

      W._avisosPendientes=total;

function toggleSidebar(){

}
function toggleNavGrp(idx){
  const items=document.getElementById('ngi-'+idx);
  const hdr=document.getElementById('ngh-'+idx);
  if(!items) return;
  const closed=items.style.maxHeight==='0px';
  if(closed){
    items.style.maxHeight=items.scrollHeight+'px';
    if(hdr) hdr.querySelector('svg').style.transform='rotate(0deg)';
  } else {
    items.style.maxHeight='0px';
    if(hdr) hdr.querySelector('svg').style.transform='rotate(-90deg)';
  }
}

async function guardarEditPago(pagoId, alId){
  const concepto=v('epConcepto'), monto=v('epMonto'), fecha=v('epFecha'), medio=v('epMedio'), comprobante=v('epComprobante');
  if(!concepto||!monto||!fecha) return toast('Completá todos los campos obligatorios','err');
  try{
    await api('PUT','/api/pagos/'+pagoId,{concepto,monto:parseFloat(monto),fecha_pago:fecha,medio_pago:medio,comprobante:comprobante||null});
    cm();
    toast('✓ Pago actualizado','ok');
    if(alId) refreshKanban(alId);
  }catch(e){ toast('Error: '+e.message,'err'); }
}
async function del(id,tipo){
  const labels={notas:'nota',pagos:'pago',examenes:'examen programado',alumnos:'alumno',docentes:'docente',asistencia:'registro de asistencia',avisos:'aviso',actividades:'actividad',feriados:'feriado',usuarios:'usuario',reemplazos:'reemplazo',carreras:'carrera',cursos:'sección',materias:'materia',asignaciones:'asignación',becas:'beca',periodos:'período'};
  const label=labels[tipo]||'registro';
  const extra=tipo==='alumnos'?'<br><span style="color:#c62828;font-size:12px">⚠ También se eliminarán sus notas, asistencia y pagos asociados.</span>':tipo==='carreras'?'<br><span style="color:#c62828;font-size:12px">⚠ También se eliminarán los secciones, materias y asignaciones de esta carrera.</span>':'';
  confirm2(
    `🗑 Eliminar ${label}`,
    `<p>¿Confirmar la eliminación de este ${label}?</p>${extra}<p style="font-size:12px;color:#c62828;margin-top:8px;font-weight:600">⚠ Esta acción no se puede deshacer.</p>`,
    async function(){
      try{
        await api('DELETE','/api/'+tipo+'/'+id);
        // Invalida caché del calendario si se borra un examen o actividad
        if(tipo==='examenes'||tipo==='actividades') _calInvalidar();
        go(cur);
        toast(`✓ ${label.charAt(0).toUpperCase()+label.slice(1)} eliminado`,'ok');
      }catch(e){toast('Error al eliminar: '+e.message,'err');}
    },
    null
  );
}

      // El backend ya filtra por docente y rango de fechas
      misExamenes=(await api('GET',`/api/examenes?desde=${hoy}&hasta=${limStr}`))
        .sort((a,b)=>a.fecha.localeCompare(b.fecha));
    }catch{}
  }

  let avisos=avs||[];
  // Filtrar avisos según rol
  if(me.rol!=='director'){
    avisos=avisos.filter(a=>{
      const esReemplazo=a.titulo?.toLowerCase().includes('reemplazo');
      const esSoloDirector=a.destinatario==='director'&&a.autor_id!==me.id;
      // Avisos de tipo 'examen' generados automáticamente solo para director
      const esAvisoExamenAuto=a.tipo==='examen'&&a.autor_id!==me.id;
      return !esReemplazo&&!esSoloDirector&&!esAvisoExamenAuto;

  // Avisos ya vistos (marcados como leídos)
  const vistos=new Set(JSON.parse(localStorage.getItem('its_avisos_vistos')||'[]'));

  const avisosLeidos=avisos.filter(a=>vistos.has(a.id));

  function marcarAvisoLeido(id){
    const vst=JSON.parse(localStorage.getItem('its_avisos_vistos')||'[]');
    if(!vst.includes(id)){vst.push(id);localStorage.setItem('its_avisos_vistos',JSON.stringify(vst));}
    const card=document.getElementById('av-'+id);
    if(card){card.style.opacity='0';card.style.transform='translateY(-6px)';card.style.transition='all 0.25s';setTimeout(()=>{card.remove();checkNotifAvisos();},260);}

      <div style="display:flex;gap:4px;flex-wrap:wrap;align-items:center">
        ${esDirector?`<span style="font-size:10px;padding:2px 6px;border-radius:10px;background:#f0f0f0;color:#555">${destLabel[a.destinatario||'todos']}</span>`:''}
        <span class="bx ${a.tipo==='urgente'?'br':a.tipo==='examen'?'bb':a.tipo==='administrativo'?'ba':'bg'}">${a.tipo}</span>
        ${esDirector||a.autor_id===me.id?`<button class="bs d" onclick="event.stopPropagation();del('${a.id}','avisos')">✕</button>`:''}
      </div>
    </div>
    <div style="font-size:13px;margin-top:8px;line-height:1.5">${a.contenido}</div>
    <div class="aviso-meta">Por: ${a.autor_nombre} ${a.autor_apellido||''} · ${a.fecha_creacion?.split('T')[0]||''} · <em style="color:var(--t3)">Clic para marcar como leído</em></div>
  </div>`;
  }
  W.marcarAvisoLeido=marcarAvisoLeido;

  el.innerHTML=`<div class="ph"><h3>Avisos y comunicados</h3>
    <div class="ph-right">
      ${esDirector&&avisosSinLeer.length?`<button class="bs" onclick="[...document.querySelectorAll('[id^=av-]')].forEach(c=>c.click())" title="Marcar todos como leídos">✓ Leer todos</button>`:''}

      ${puedeEditar?`<button class="bn" onclick="mAviso()">+ Nuevo aviso</button>`:''}
      ${me.rol==='docente'?`<button class="bs o" onclick="mAvisoDirector()" title="Enviar mensaje privado al Director">✉ Avisar al Director</button>`:''}
    </div></div>

  ${misExamenes.length?`<div style="margin-bottom:16px;border:2px solid #D85A30;border-radius:10px;overflow:hidden;box-shadow:0 2px 8px #D85A3022">
    <div style="background:linear-gradient(90deg,#D85A30,#e07448);color:#fff;padding:10px 16px;display:flex;align-items:center;gap:8px">
      <span style="font-size:18px;animation:pulse-bell 1.5s infinite">🔔</span>
      <strong style="font-size:13px">Tus exámenes programados (próximos 30 días)</strong>
      <span style="margin-left:auto;background:rgba(255,255,255,.25);border-radius:12px;padding:2px 8px;font-size:11px">${misExamenes.length} examen${misExamenes.length!==1?'es':''}</span>
    </div>
    ${misExamenes.map((e,i)=>{
      const diasRestantes=Math.ceil((new Date(e.fecha)-new Date())/(1000*60*60*24));
      const urgente=diasRestantes<=3;
      return`<div style="padding:12px 16px;border-bottom:${i<misExamenes.length-1?'1px solid #f5ddd8':''};background:${urgente?'#fff8f6':'#fff'};display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:8px">
        <div>
          <div style="font-weight:700;font-size:14px">${e.materia_nombre||''} <span style="font-weight:400;color:var(--t2)">·</span> <span style="color:#D85A30">${e.tipo}</span></div>
          <div style="font-size:12px;color:var(--t2);margin-top:2px">${e.carrera_nombre||''} ${e.curso_anio?e.curso_anio+'°':''} ${e.hora?'· '+e.hora:''} ${e.aula?'· Aula '+e.aula:''}</div>
        </div>
        <div style="display:flex;flex-direction:column;align-items:flex-end;gap:4px">
          <span style="font-size:15px;font-weight:800;color:${urgente?'#c62828':'#D85A30'}">${fmtFecha(e.fecha)}</span>
          <span style="font-size:11px;padding:2px 8px;border-radius:10px;background:${urgente?'#ffebee':'#fff3e0'};color:${urgente?'#c62828':'#e65100'};font-weight:700">${urgente?'⚡ ':''} En ${diasRestantes} día${diasRestantes!==1?'s':''}</span>
        </div>
      </div>`;
    }).join('')}
  </div>`:''}

  ${esDirector&&actividad.length?`
  <div style="margin-bottom:20px;border:1px solid #e2e8f0;border-radius:12px;overflow:hidden">
    <div style="background:#f8fafc;padding:10px 16px;display:flex;align-items:center;justify-content:space-between;border-bottom:1px solid #e2e8f0">
      <span style="font-weight:700;font-size:13px;color:#334155">📋 Actividad reciente del sistema</span>
      <span style="font-size:11px;color:#94a3b8">Últimas ${actividad.length} acciones</span>
    </div>
    <div style="max-height:320px;overflow-y:auto">
      ${actividad.map(a=>{
        let det={};try{det=JSON.parse(a.detalle||'{}');}catch{}
        const quien=(a.user_apellido||'')+' '+(a.user_nombre||'');
        const quienHtml=`<strong>${quien.trim()||'Sistema'}</strong>`;
        const dPY=a.fecha?new Date(String(a.fecha).replace(' ','T')+(String(a.fecha).includes('Z')||String(a.fecha).includes('+')?'':'Z')):null;
        const ahoraOpts={timeZone:'America/Asuncion'};
        const fechaPY=dPY?dPY.toLocaleDateString('es-PY',{...ahoraOpts,year:'numeric',month:'2-digit',day:'2-digit'}):'';
        const horaPY=dPY?dPY.toLocaleTimeString('es-PY',{...ahoraOpts,hour:'2-digit',minute:'2-digit'}):'';
        const hoyPY=new Date().toLocaleDateString('es-PY',ahoraOpts);
        const ayerPY=new Date(Date.now()-86400000).toLocaleDateString('es-PY',ahoraOpts);
        const cuandoLabel=fechaPY===hoyPY?`Hoy ${horaPY}`:fechaPY===ayerPY?`Ayer ${horaPY}`:`${fechaPY} ${horaPY}`;
        const mapa={
          PAGO:{icon:'💰',fn:d=>`registró pago <em>${d.concepto||''}</em>${d.monto?' — Gs. '+Number(d.monto).toLocaleString():''}`,color:'#dcfce7'},
          'EDIT':{icon:'✏️',fn:(d,t)=>t==='pagos'?`modificó un pago`:`editó en ${t}`,color:'#e0f2fe'},
          'DELETE':{icon:'🗑️',fn:(d,t)=>`eliminó registro en ${t}${d.concepto?' ('+d.concepto+')':''}`,color:'#fee2e2'},
          UPLOAD_EXAMEN:{icon:'📎',fn:d=>`adjuntó archivo de examen: <em>${d.archivo||''}</em>`,color:'#fef9c3'},
          AVISO:{icon:'📢',fn:d=>`publicó aviso: <em>${d.titulo||''}</em>`,color:'#f3e8ff'},
          NOTAS:{icon:'📝',fn:d=>`cargó notas`,color:'#e0f2fe'},
          ASISTENCIA:{icon:'✅',fn:d=>`registró asistencia`,color:'#dcfce7'},
          DELETE_ASISTENCIA:{icon:'↩️',fn:d=>`eliminó registro de asistencia`,color:'#fee2e2'},
          ANULAR_ASISTENCIA:{icon:'↩️',fn:d=>`anuló asistencia del ${d.fecha||''}`,color:'#fee2e2'},
          BACKUP:{icon:'💾',fn:d=>`backup automático creado`,color:'#f1f5f9'},
          CLOUD_BACKUP:{icon:'☁️',fn:d=>`backup subido a Google Drive`,color:'#dbeafe'},
        };
        const cfg=mapa[a.accion]||{icon:'🔔',fn:(d,t)=>`${a.accion} en ${t||''}`,color:'#f8fafc'};
        const desc=cfg.fn(det,a.tabla||'');
        // Items clicables: UPLOAD_EXAMEN → ir al examen
        const esClicable=a.accion==='UPLOAD_EXAMEN'&&a.registro_id;
        const onclick=esClicable?`onclick="irAlExamenDesdeActividad('${a.registro_id}')" title="Clic para ir al examen y descargar el archivo"`:'' ;
        return `<div style="padding:9px 16px;border-bottom:1px solid #f1f5f9;display:flex;gap:10px;align-items:flex-start;background:${cfg.color}22;${esClicable?'cursor:pointer;':''}${esClicable?'transition:background .15s;':''}" ${onclick} ${esClicable?`onmouseover="this.style.background='#fef9c3'" onmouseout="this.style.background='${cfg.color}22'"`:''}>
          <span style="font-size:16px;flex-shrink:0;margin-top:1px">${cfg.icon}</span>
          <div style="flex:1;min-width:0">
            <div style="font-size:12px;color:#1e293b;line-height:1.4">${quienHtml} ${desc}</div>
            ${esClicable?'<div style="font-size:10px;color:#d97706;font-weight:600;margin-top:2px">👆 Clic para ir al examen y descargar</div>':''}
          </div>
          <div style="font-size:10px;color:#94a3b8;white-space:nowrap;flex-shrink:0">${cuandoLabel}</div>
        </div>`;
      }).join('')}
    </div>
  </div>`:''}

  ${avisosSinLeer.length?`
  <div style="display:flex;align-items:center;gap:12px;background:linear-gradient(90deg,#e53935,#ef5350);color:#fff;border-radius:12px;padding:12px 18px;margin-bottom:16px;box-shadow:0 3px 10px rgba(229,57,53,.35);animation:fadeInQ .3s ease">
    <span style="font-size:24px;animation:pulse-bell 1s infinite">🔔</span>
    <div style="flex:1">
      <div style="font-size:14px;font-weight:800">Tenés ${avisosSinLeer.length} aviso${avisosSinLeer.length!==1?'s':''} sin leer</div>
      <div style="font-size:12px;opacity:.85;margin-top:2px">Hacé clic en cada uno para marcarlo como leído</div>
    </div>
    ${esDirector&&avisosSinLeer.length?`<button onclick="[...document.querySelectorAll('[id^=av-]')].forEach(c=>c.click())" style="background:rgba(255,255,255,.2);border:1px solid rgba(255,255,255,.5);color:#fff;border-radius:8px;padding:6px 12px;font-size:12px;font-weight:700;cursor:pointer;white-space:nowrap">✓ Marcar todos</button>`:''}
  </div>`:''}

  ${!avisos.length?`<div class="es">No hay avisos activos</div>`:''}
  ${avisosSinLeer.length?`<p style="font-size:11px;font-weight:700;color:var(--t2);margin-bottom:8px">📬 Sin leer (${avisosSinLeer.length})</p>`:''}
  ${avisosSinLeer.map(a=>renderAvisoCard(a,false)).join('')}
  ${avisosLeidos.length?`<p style="font-size:11px;font-weight:700;color:var(--t3);margin-top:16px;margin-bottom:8px">✓ Ya leídos (${avisosLeidos.length})</p>${avisosLeidos.map(a=>renderAvisoCard(a,true)).join('')}`:''}
  `;
}
function mAvisoDirector(){
  modal(`<h4>✉ Mensaje al Director</h4>
  <p style="font-size:12px;color:var(--t2);margin-bottom:10px">Este mensaje será visible solo para el Director.</p>
  <div class="fg">
    <div class="f"><label>Asunto <span style="color:var(--red)">*</span></label>
      <input id="adTit" placeholder="Ej: Consulta sobre examen, Solicitud de reemplazo..."/></div>
    <div class="f"><label>Mensaje <span style="color:var(--red)">*</span></label>
      <textarea id="adCon" rows="4" placeholder="Escribí tu mensaje aquí..." style="width:100%;padding:8px;border:1px solid var(--bdr);border-radius:7px;font-size:13px;resize:vertical"></textarea></div>
  </div>
  <div class="mf">
    <button class="bs" onclick="cm()">Cancelar</button>
    <button class="bn" onclick="svAvisoDirector()">✉ Enviar al Director</button>
  </div>`);
}
async function svAvisoDirector(){
  const titulo=v('adTit'),contenido=v('adCon');
  if(!titulo||!contenido)return alert('Completar asunto y mensaje');
  try{
    await api('POST','/api/avisos',{titulo:`✉ [Docente] ${titulo}`,contenido,tipo:'administrativo',destinatario:'director',fijado:0});
    cm();toast('✉ Mensaje enviado al Director correctamente','ok',4000);
  }catch(e){toast('Error: '+e.message,'err');}
}

function mAviso(){
  const esDirector=me.rol==='director';
  const esDocente=me.rol==='docente';
  const asigs=W._notasAsigs||W._misAsigsRep||[];
  // Filtro combinado carrera+materia para docente (más rápido)
  const combos=[...new Map(asigs.map(a=>[
    a.carrera_nombre+'|||'+a.materia_nombre,
    {carrera:a.carrera_nombre,materia:a.materia_nombre}
  ])).values()].sort((a,b)=>(a.carrera+a.materia).localeCompare(b.carrera+b.materia));
  const optsDestino=esDirector
    ?'<option value="todos">Todos</option><option value="docentes">Solo docentes</option><option value="alumnos">Solo alumnos</option><option value="director">Solo Director y Secretaría</option>'
    :esDocente
      ?'<option value="mis-alumnos">Mis alumnos</option>'
      :'<option value="director">Solo al Director</option>';
  const filtroCombo=(esDocente&&combos.length)
    ?`<div class="f"><label>Carrera / Materia (opcional)</label>
       <select id="avCombo">
         <option value="">— Todos mis alumnos —</option>
         ${combos.map(c=>'<option value="'+c.carrera+'|||'+c.materia+'">'+c.carrera+' — '+c.materia+'</option>').join('')}
       </select></div>`:'';
  modal(`<h4>Nuevo aviso / comunicado</h4><div class="fg">
  <div class="f"><label>Título</label><input id="avt" placeholder="Título del aviso"/></div>
  <div class="f"><label>Contenido</label><textarea id="avc" rows="4" placeholder="Escribí el mensaje..." style="width:100%;padding:8px;border:1px solid var(--bdr);border-radius:7px;font-size:13px;resize:vertical"></textarea></div>
  <div class="fr">
    <div class="f"><label>Tipo</label><select id="avtp"><option value="info">Información general</option><option value="examen">Examen</option><option value="administrativo">Administrativo</option><option value="urgente">Urgente</option></select></div>
    <div class="f"><label>¿Fijar arriba?</label><select id="avf"><option value="0">No</option><option value="1">Sí</option></select></div>
  </div>
  <div class="f"><label>Público objetivo</label><select id="avdest">${optsDestino}</select></div>
  ${filtroCombo}
</div><div class="mf"><button class="bs" onclick="cm()">Cancelar</button><button class="bn" onclick="svAviso()">Publicar</button></div>`);
}
async function svAviso(){
  const t=v('avt'),c=v('avc');
  if(!t||!c)return alert('Completar título y contenido');
  const combo=document.getElementById('avCombo')?.value||'';
  let titulo=t;
  if(combo){
    const [carr,mat]=combo.split('|||');
    titulo=`${t} [${mat} — ${carr}]`;
  }
  const destinatario=document.getElementById('avdest')?.value||'todos';
  const tipo=document.getElementById('avtp')?.value||'info';
  const fijado=document.getElementById('avf')?.value==='1';
  if(!destinatario){toast('Seleccioná un destinatario','warn');return;}
  try{
    await api('POST','/api/avisos',{titulo,contenido:c,tipo,fijado,destinatario});
    cm();go('avisos');
    toast('✓ Aviso publicado correctamente','ok',3000);
  }catch(e){toast('Error al publicar: '+e.message,'err');}
}

function mCarrera(c){
  const e=!!c;
  const aniosActivos=e?(c.anios_activos||[1,2]):[1,2];
  const chkAnios=[1,2,3,4].map(a=>{
    const checked=aniosActivos.includes(a)?'checked':'';
    return `<label style="display:flex;align-items:center;gap:4px;font-size:13px"><input type="checkbox" id="ca${a}" value="${a}" ${checked}/> ${a}° año</label>`;
  }).join('');
  modal(`<h4>${e?'Editar':'Nueva'} carrera</h4><div class="fg">
  <div class="fr">
    <div class="f"><label>Nombre</label><input id="cn" value="${e?c.nombre:''}" placeholder="Ej: Enfermería"/></div>
    <div class="f"><label>Código</label><input id="cc" value="${e?c.codigo:''}" placeholder="Ej: ENF"/></div>
  </div>
  <div class="fr">
    <div class="f"><label>Turno</label><select id="ct">${['Mañana','Tarde','Nocturno'].map(t=>`<option ${e&&c.turno===t?'selected':''}>${t}</option>`).join('')}</select></div>
    <div class="f"><label>Duración (años)</label><input id="cs" type="number" value="${e?c.semestres:2}" min="1" max="4" placeholder="Ej: 2"/></div>
  </div>
  <div class="f"><label>Años que ofrece la carrera</label>
    <div style="display:flex;gap:8px;flex-wrap:wrap;margin-top:4px">${chkAnios}</div>
    <p style="font-size:10px;color:var(--t2);margin-top:4px">Seleccioná los años que tiene esta carrera</p>
  </div>
</div><div class="mf"><button class="bs" onclick="cm()">Cancelar</button><button class="bn" onclick="svCarrera('${e?c.id:''}')">Guardar</button></div>`);
}
async function svCarrera(id){
  const o={nombre:v('cn'),codigo:v('cc').toUpperCase(),turno:v('ct'),semestres:parseInt(v('cs'))};
  if(!o.nombre||!o.codigo)return alert('Completar nombre y código');
  id?await api('PUT','/api/carreras/'+id,o):await api('POST','/api/carreras',o);cm();go('carreras');
}

async function svMat(id,o,conConflicto){
  try{
    let matId=id;
    if(id) await api('PUT','/api/materias/'+id,o);
    else{const r=await api('POST','/api/materias',o);matId=r.id;}
    // Crear/actualizar asignación automáticamente
    if(o.docente_id&&o.curso_id&&matId){
      const periodo=await api('GET','/api/periodos').then(ps=>ps.find(p=>p.activo)||ps[0]).catch(()=>null);
      if(periodo){
        const existe=await api('GET',`/api/asignaciones?materia_id=${matId}&curso_id=${o.curso_id}&periodo_id=${periodo.id}`).catch(()=>[]);
        if(!existe||!existe.length){
          // Crear nueva asignación si no existe
          await api('POST','/api/asignaciones',{docente_id:o.docente_id,materia_id:matId,curso_id:o.curso_id,periodo_id:periodo.id,turno:o.turno,hora_inicio:o.turno===1?'19:00':'20:40',hora_fin:o.turno===1?'20:20':'22:00'}).catch(()=>{});
        } else {
          // Actualizar docente en asignación existente si cambió
          const asig=existe[0];
          if(asig.docente_id!==o.docente_id){
            await api('PUT',`/api/asignaciones/${asig.id}/docente`,{docente_id:o.docente_id}).catch(()=>{});
          }
        }
      }
    }
    cm();
    if(conConflicto)toast('⚠ Materia guardada con conflicto — pendiente de revisión del Director','warn',5000);
    else toast('✓ Materia guardada y asignada automáticamente','ok');
    go('materias');
  }catch(e){alert('Error: '+e.message);}
}

async function ejecutarPromocion(pid){
  const orig=v('prom_orig'), dest=v('prom_dest');
  if(!orig||!dest)return alert('Seleccionar curso origen y destino');
  if(!confirm('¿Confirmar promoción masiva? Los alumnos cambiarán de curso.'))return;
  try{
    const r=await api('POST','/api/periodos/'+pid+'/promover',{modo:'promocion',curso_origen_id:orig,curso_destino_id:dest});
    document.getElementById('promMsg').innerHTML=`<div class="ir ok">✓ ${r.promovidos} alumnos promovidos al nuevo curso</div>`;
  }catch(e){document.getElementById('promMsg').innerHTML=`<div class="ir err">${e.message}</div>`;}
}

// ── VER MATERIAS DOCENTE (supervisión integrada en sección Docentes) ──────────
async function verMateriasDocente(docId, nombre){
  if(!docId)return;
  const asigs=await api('GET','/api/asignaciones/docente/'+docId);
  const total=asigs.reduce((a,x)=>a+x.total_alumnos,0);
  const cargadas=asigs.reduce((a,x)=>a+x.notas_cargadas,0);
  const pctGlobal=total?Math.round(cargadas/total*100):0;
  modal(`<h4>📋 ${nombre} — Materias asignadas</h4>
  <div style="background:#f0faf4;border-radius:8px;padding:10px 14px;margin-bottom:14px;display:flex;align-items:center;gap:12px">
    <div style="flex:1">
      <div style="display:flex;justify-content:space-between;font-size:12px;margin-bottom:4px">
        <span>${asigs.length} materias · ${total} alumnos</span>
        <strong>${cargadas}/${total} notas (${pctGlobal}%)</strong>
      </div>
      <div class="prog-bar"><div class="prog-fill" style="width:${pctGlobal}%"></div></div>
    </div>
  </div>
  ${asigs.length?`<div style="overflow-x:auto"><table style="width:100%;font-size:12px;border-collapse:collapse">
    <thead><tr style="background:#f5f5f5">
      <th style="padding:7px 10px;text-align:left;border-bottom:1px solid var(--bdr)">Materia</th>
      <th style="padding:7px 8px;text-align:left;border-bottom:1px solid var(--bdr)">Carrera/Sección</th>
      <th style="padding:7px 8px;text-align:center;border-bottom:1px solid var(--bdr)">Parciales</th>
      <th style="padding:7px 8px;text-align:center;border-bottom:1px solid var(--bdr)">Finales</th>
      <th style="padding:7px 8px;text-align:center;border-bottom:1px solid var(--bdr)">Completas</th>
      <th style="padding:7px 8px;text-align:center;border-bottom:1px solid var(--bdr)">Estado</th>
      <th style="padding:7px 8px;border-bottom:1px solid var(--bdr)"></th>
    </tr></thead>
    <tbody>
    ${asigs.map(a=>{
      const pctN=a.total_alumnos?Math.round(a.notas_cargadas/a.total_alumnos*100):0;
      const pctP=a.total_alumnos?Math.round(a.parciales_cargados/a.total_alumnos*100):0;
      const pctF=a.total_alumnos?Math.round(a.finales_cargados/a.total_alumnos*100):0;
      const est=pctN===100?'bg':pctN>0?'ba':'br';
      const estLabel=pctN===100?'Completo':pctN>0?'En proceso':'Sin cargar';
      return `<tr style="border-bottom:1px solid var(--bdr)">
        <td style="padding:8px 10px"><strong>${a.materia_nombre}</strong></td>
        <td style="padding:8px 8px"><span class="cur-tag">${a.carrera_nombre} ${a.curso_anio}°${a.curso_division==='U'?'':a.curso_division}</span></td>
        <td style="padding:8px 8px;text-align:center">
          <div style="font-size:11px">${a.parciales_cargados}/${a.total_alumnos}</div>
          <div class="prog-bar" style="width:60px;margin:0 auto"><div class="prog-fill" style="width:${pctP}%;background:var(--amb)"></div></div>
        </td>
        <td style="padding:8px 8px;text-align:center">
          <div style="font-size:11px">${a.finales_cargados}/${a.total_alumnos}</div>
          <div class="prog-bar" style="width:60px;margin:0 auto"><div class="prog-fill" style="width:${pctF}%;background:var(--red)"></div></div>
        </td>
        <td style="padding:8px 8px;text-align:center">
          <div style="font-size:11px">${a.notas_cargadas}/${a.total_alumnos} (${pctN}%)</div>
          <div class="prog-bar" style="width:60px;margin:0 auto"><div class="prog-fill" style="width:${pctN}%"></div></div>
        </td>
        <td style="padding:8px 8px;text-align:center"><span class="bx ${est}">${estLabel}</span></td>
        <td style="padding:8px 8px">
          <div class="abs">
            <button class="bs i" onclick="cm();setTimeout(()=>{go('notas');setTimeout(()=>W.loadNotas('${a.id||a.asignacion_id}'),600);},100)">Cargar notas</button>
            ${me.rol==='director'?`<button class="bs o" onclick="W.imprimirActa('${a.id||a.asignacion_id}')">Acta</button>`:''}
          </div>
        </td>
      </tr>`;
    }).join('')}
    </tbody>
  </table></div>`:'<div class="es">Este docente no tiene asignaciones en el período activo</div>'}
  <div class="mf"><button class="bs" onclick="cm()">Cerrar</button></div>`,true);
}

// ── ELIMINAR POR GRUPO ────────────────────────────────────────────────────────
function mEliminarGrupo(){
  const carrs=W._carrs||[];
  const cursos=W._cursos||[];
  const anios=[...new Set(cursos.map(cu=>cu.anio).filter(Boolean))].sort();
  modal(`<div class="mh"><h4>🗑 Eliminar por Grupo</h4><button class="mc" onclick="cm()">✕</button></div>
    <div class="fg">
      <div class="ir" style="background:#fce4ec;border:1px solid #e57373;color:#b71c1c;border-radius:6px;padding:10px;margin-bottom:14px;font-size:13px">
        ⚠ <strong>Esta acción es irreversible.</strong> Se eliminarán permanentemente todos los alumnos del grupo seleccionado, incluyendo sus pagos, notas, asistencia y cuentas de acceso.
      </div>
      <div class="fr">
        <div class="f"><label>Carrera <span style="color:var(--red)">*</span></label>
          <select id="delGrpCarr" onchange="filtDelGrpCursos()">
            <option value="">Seleccionar carrera...</option>
            ${carrs.map(c=>`<option value="${c.id}">${c.nombre}</option>`).join('')}
          </select>
        </div>
        <div class="f"><label>Año</label>
          <select id="delGrpAnio" onchange="filtDelGrpCursos()">
            <option value="">Todos los años</option>
            ${anios.map(a=>`<option value="${a}">${a}° año</option>`).join('')}
          </select>
        </div>
        <div class="f"><label>Sección</label>
          <select id="delGrpCurso" onchange="previewDelGrp()">
            <option value="">Todas las secciones</option>
          </select>
        </div>
      </div>
      <div id="delGrpPreview" style="margin-top:10px;font-size:13px;color:#555;min-height:22px"></div>
    </div>
    <div class="mf">
      <button class="bs" onclick="cm()">Cancelar</button>
      <button class="bn" style="background:#b71c1c" onclick="doEliminarGrupo()">🗑 Eliminar grupo</button>
    </div>`);
  filtDelGrpCursos();
}
function filtDelGrpCursos(){
  const carrId=v('delGrpCarr');
  const anio=v('delGrpAnio');
  const cursos=(W._cursos||[]).filter(cu=>(!carrId||cu.carrera_id===carrId)&&(!anio||String(cu.anio)===anio));
  const sel=document.getElementById('delGrpCurso');
  if(sel) sel.innerHTML='<option value="">Todas las secciones</option>'+cursos.map(cu=>`<option value="${cu.id}">${cu.anio}°${cu.division&&cu.division!=='U'?cu.division:''}${cu.turno?' — T'+cu.turno:''}</option>`).join('');
  previewDelGrp();
}
async function previewDelGrp(){
  const carrId=v('delGrpCarr');
  const cursoId=v('delGrpCurso');
  const prev=document.getElementById('delGrpPreview');
  if(!prev)return;
  if(!carrId){prev.innerHTML='';return;}
  try{
    const params='carrera_id='+encodeURIComponent(carrId)+(cursoId?'&curso_id='+encodeURIComponent(cursoId):'');
    const r=await api('GET','/api/alumnos/grupo/count?'+params);
    prev.innerHTML=r.count>0
      ?`<span style="color:#b71c1c;font-weight:600">Se eliminarán <strong>${r.count}</strong> alumno${r.count!==1?'s':''} del grupo seleccionado.</span>`
      :`<span style="color:#388e3c">✓ No hay alumnos en este grupo.</span>`;
  }catch(e){prev.innerHTML='';}
}
async function doEliminarGrupo(){
  const carrId=v('delGrpCarr');
  const cursoId=v('delGrpCurso');
  if(!carrId){toast('Seleccioná una carrera','warn');return;}
  // Obtener preview count antes de confirmar
  const params='carrera_id='+encodeURIComponent(carrId)+(cursoId?'&curso_id='+encodeURIComponent(cursoId):'');
  let count=0;
  try{const r=await api('GET','/api/alumnos/grupo/count?'+params);count=r.count;}catch{}
  if(count===0){toast('No hay alumnos en el grupo seleccionado','warn');return;}
  const carr=(W._carrs||[]).find(c=>c.id===carrId);
  const cur=(W._cursos||[]).find(c=>c.id===cursoId);
  const grpLabel=(carr?carr.nombre:'')+(cur?` — ${cur.anio}°${cur.division&&cur.division!=='U'?cur.division:''}${cur.turno?' T'+cur.turno:''}`:'');
  cm();
  confirm2('⚠ Confirmar eliminación de grupo',
    `<p style="font-size:13px;margin-bottom:10px">Se eliminarán todos los registros del grupo seleccionado. Esta acción es irreversible.</p>
     <div style="background:#fce4ec;border-radius:6px;padding:10px;font-size:13px;color:#b71c1c">
       <strong>Grupo:</strong> ${grpLabel}<br>
       <strong>Alumnos a eliminar:</strong> ${count}<br><br>
       También se eliminarán: pagos, notas, asistencia, habilitaciones y cuentas de acceso de estos alumnos.
     </div>`,
    async function(){
      try{
        const r=await api('DELETE','/api/alumnos/grupo?'+params);
        toast(`✓ Se eliminaron ${r.eliminados} alumno${r.eliminados!==1?'s':''} del grupo`,'ok',5000);
        go('alumnos');
      }catch(e){toast('Error: '+e.message,'err');}
    },null);
}

async function pgAlumnos(el){
  const [als,carrs,cursos]=await Promise.all([api('GET','/api/alumnos'),api('GET','/api/carreras'),api('GET','/api/cursos')]);
  W._als=als;W._carrs=carrs;W._cursos=cursos;
  const anios=[...new Set(cursos.map(cu=>cu.anio).filter(Boolean))].sort();
  el.innerHTML=`<div class="ph"><h3>Alumnos (${als.length})</h3>
    <div class="ph-right">
      <button class="bs o" onclick="crearAccesosMasivos()" title="Crear o actualizar accesos para todos los alumnos">🔑 Crear/Actualizar accesos</button>
      <button class="bs" style="background:#b71c1c;color:#fff;border:none" onclick="mEliminarGrupo()">🗑 Eliminar por Grupo</button>
      <button class="bs i" onclick="mImp()">📥 Importar Excel</button>
      <button class="bn" onclick="mAl()">+ Nuevo alumno</button>
    </div></div>
  <div class="fb" style="flex-wrap:wrap;gap:8px;margin-bottom:8px">
    <input id="filtAlBus" placeholder="🔍 CI o nombre..." oninput="fAlAll()" style="min-width:180px"/>
    <select id="filtAlCarr" onchange="filtAlCursos();fAlAll()"><option value="">Todas las carreras</option>${carrs.map(c=>`<option value="${c.id}">${c.nombre}</option>`).join('')}</select>
    <select id="filtAlAnio" onchange="fAlAll()"><option value="">Todos los años</option>${anios.map(a=>`<option value="${a}">${a}° año</option>`).join('')}</select>
    <select id="filtAlCurso" onchange="fAlAll()"><option value="">Todas las secciones</option>${cursos.map(cu=>`<option value="${cu.id}">${cu.carrera_nombre} ${cu.anio}°${cu.division==='U'?'':cu.division}</option>`).join('')}</select>
    <select id="filtAlTurno" onchange="fAlAll()"><option value="">Todos los turnos</option><option value="1">Turno 1 (19:00)</option><option value="2">Turno 2 (20:40)</option></select>
  </div>
  <div class="card"><div class="tw"><table><thead><tr><th>Matrícula</th><th>Alumno</th><th>C.I.</th><th>Carrera</th><th>Sección</th><th>Est.</th><th></th></tr></thead>
  <tbody id="altb">${als.map(aRow).join('')}</tbody></table></div></div>`;
}
function filtAlCursos(){
  const carrId=v('filtAlCarr');
  const sel=document.getElementById('filtAlCurso');
  if(!sel)return;
  const cursos=(W._cursos||[]).filter(cu=>!carrId||cu.carrera_id===carrId);
  sel.innerHTML='<option value="">Todas las secciones</option>'+cursos.map(cu=>`<option value="${cu.id}">${cu.carrera_nombre} ${cu.anio}°${cu.division==='U'?'':cu.division}${cu.turno?' T'+cu.turno:''}</option>`).join('');
}
function fAlAll(){
  const bus=(v('filtAlBus')||'').toLowerCase().trim();
  const carrId=v('filtAlCarr');
  const anio=v('filtAlAnio');
  const cursoId=v('filtAlCurso');
  const turno=v('filtAlTurno');
  const tb=document.getElementById('altb');if(!tb)return;
  let l=W._als||[];
  if(bus)l=l.filter(a=>(a.display_nombre||'').toLowerCase().includes(bus)||(a.display_apellido||'').toLowerCase().includes(bus)||(a.display_ci||'').toLowerCase().includes(bus));
  if(carrId) l=l.filter(a=>a.carrera_id===carrId);
  if(anio)   l=l.filter(a=>String(a.curso_anio||a.anio)===anio);
  if(cursoId)l=l.filter(a=>a.curso_id===cursoId);
  if(turno){const ct=new Set((W._cursos||[]).filter(cu=>String(cu.turno)===turno).map(cu=>cu.id));l=l.filter(a=>ct.has(a.curso_id));}
  tb.innerHTML=l.map(aRow).join('')||'<tr><td colspan="7" class="es">Sin alumnos</td></tr>';
}
function fAl(t,val){if(t==='c'){const el=document.getElementById('filtAlCarr');if(el)el.value=val;}if(t==='cu'){const el=document.getElementById('filtAlCurso');if(el)el.value=val;}fAlAll();}

</tr>`;}
// Función mRow para materias — también debe ser global
function mRow(m){

async function buscarYGuardarAl(){
  const nombre=(v('an')||'').trim();
  const apellido=(v('aap')||'').trim();
  const ci=(v('aci')||'').trim().replace(/[^0-9]/g,'');
  if(!nombre||!apellido){alert('Completar nombre y apellido');return;}
  if(!v('acar')){alert('Seleccionar una carrera');return;}
  // Guardar datos del formulario para usarlos si el usuario vuelve o confirma creación
  W._pendingAlDatos={
    nombre,apellido,ci,
    telefono:(v('atel')||'').trim(),
    carrera_id:v('acar'),
    curso_id:v('acur')||null,
    fecha_ingreso:v('aing')||new Date().toISOString().split('T')[0],
    curso_anio:(W._cursos||[]).find(cu=>cu.id===v('acur'))?.anio||null
  };
  const btn=document.getElementById('btn-guardar-al');
  if(btn){btn.disabled=true;btn.textContent='⏳ Buscando...';}
  try{
    const params=new URLSearchParams();
    if(ci) params.set('ci',ci);
    if(apellido) params.set('apellido',apellido);
    if(nombre) params.set('nombre',nombre);
    const res=await api('GET','/api/alumnos/buscar-conflicto?'+params.toString());
    if(!res.total){
      // Sin conflictos → guardar directo
      await svAl('');
      return;
    }
    // Hay coincidencias → mostrar panel de conflicto
    if(btn){btn.disabled=false;btn.textContent='🔍 Buscar y Guardar';}
    _mostrarPanelConflictoAl(res.conflictos);
  }catch(e){
    if(btn){btn.disabled=false;btn.textContent='🔍 Buscar y Guardar';}
    alert('Error al buscar: '+e.message);
  }
}

async function limpiarExamenesTipo(){
  const tipo=prompt('¿Qué tipo de exámenes eliminar?\nOpciones: Parcial · Recuperatorio · Final · Final Recuperatorio · Complementario · Extraordinario');
  if(!tipo)return;
  const TIPOS=['Parcial','Recuperatorio','Final','Final Recuperatorio','Complementario','Extraordinario'];
  if(!TIPOS.includes(tipo))return toast('Tipo inválido','warn');
  // Obtener conteo antes de confirmar
  try{
    const examenes=await api('GET','/api/examenes',{tipo});
    const n=Array.isArray(examenes)?examenes.filter(e=>e.tipo===tipo).length:0;
    if(!confirm(`⚠️ ATENCIÓN: Se eliminarán ${n} exámenes de tipo "${tipo}".\n\nEsta acción es IRREVERSIBLE y borrará el examen de TODAS las materias.\n\n¿Confirmar eliminación?`))return;
    if(prompt(`Para confirmar, escribí exactamente: ELIMINAR ${tipo}`)!==`ELIMINAR ${tipo}`)return toast('Confirmación incorrecta — operación cancelada','warn');
  }catch(e){
    if(!confirm(`¿Eliminar TODOS los exámenes de tipo "${tipo}"? Esta acción no se puede deshacer.`))return;
  }
  try{
    const r=await api('DELETE','/api/examenes/bulk/tipo',{tipo});
    toast(`✓ ${r.eliminados} exámenes "${tipo}" eliminados`,'ok',4000);
    go('examenes');
  }catch(e){toast('Error: '+e.message,'err');}
}

  const carr=v('filtEgrCarr'), anio=v('filtEgrAnio'), est=v('filtEgrEst');

  if(carr) cands=cands.filter(c=>c.carrera_nombre===carr);

  if(est==='puede') cands=cands.filter(c=>c.puede_egresar&&!c.solicitud);

async function cargarRepositorio(tipo){
  const esPrograma=tipo==='programa';
  const carId=v(esPrograma?'repProgCarr':'repContCarr')||'';
  const anio=v(esPrograma?'repProgAnio':'repContAnio')||'';
  const turno=esPrograma?'':v('repContTurno')||'';
  const matId=v(esPrograma?'repProgMat':'repContMat')||'';
  let url='/api/repositorio/'+(esPrograma?'programas':'contenidos');
  const q=[];
  if(carId)q.push('carrera_id='+carId);
  if(matId)q.push('materia_id='+matId);
  if(anio)q.push('anio='+anio);
  if(turno)q.push('turno='+turno);

  const desc=v('repUpDesc'), dia=v('repUpDia'), turno=v('repUpTurno'), unidad=v('repUpUnidad');

  if(tipo==='contenido'&&!dia)return alert('Especificá el día de la clase');
  if(tipo==='contenido'&&!unidad)return alert('Especificá la unidad desarrollada');
  const fd=new FormData();
  fd.append('archivo',file);
  fd.append('tipo',tipo);
  if(carrId)fd.append('carrera_id',carrId);
  if(matId)fd.append('materia_id',matId);

    fd.append('turno',turno||'1');
  }

  if(btn){btn.disabled=true;btn.textContent='Subiendo...';}
  try{
    await api('POST','/api/repositorio',fd,true);

    go(tipo==='programa'?'repositorio-programas':'repositorio-contenidos');
  }catch(e){
    if(btn){btn.disabled=false;btn.textContent='⬆ Subir';}

  }
