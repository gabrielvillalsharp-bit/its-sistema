async function chkDuplicadoExamen(){
  const asigId=v('exas'),tipo=v('exti');
  const alerta=document.getElementById('alertDupExamen');
  if(!alerta)return;
  if(!asigId||!tipo){alerta.style.display='none';return;}
  try{
    const exs=await api('GET',`/api/examenes?tipo=${encodeURIComponent(tipo)}`);
    const dup=exs.find(e=>e.asignacion_id===asigId&&e.tipo===tipo);
    if(dup){
      alerta.style.display='block';
      alerta.style.background='#ffebee';
      alerta.style.border='1px solid #ef9a9a';
      alerta.style.borderRadius='6px';
      alerta.style.padding='8px 10px';
      alerta.innerHTML=`🚫 <strong>Ya existe un examen de tipo "${tipo}"</strong> para esta materia (fecha: ${fmtFecha(dup.fecha)}). <strong>No se puede volver a programar.</strong>`;
    } else {
      // Verificar si está unificada con otro examen ya programado
      const slots=document.querySelectorAll('[id^="unifSlot_"]');
      let dupUnif=null;
      slots.forEach(slot=>{
        const n=slot.id.replace('unifSlot_','');
        const val=v('ufs_'+n);
        if(val&&!dupUnif){
          const dup2=exs.find(e=>e.asignacion_id===val&&e.tipo===tipo);
          if(dup2)dupUnif={asig:val,examen:dup2};
        }
      });
      if(dupUnif){
        alerta.style.display='block';
        alerta.style.background='#fff3e0';
        alerta.style.border='1px solid #ffb74d';
        alerta.style.borderRadius='6px';
        alerta.style.padding='8px 10px';
        alerta.innerHTML=`⚠ Una materia unificada ya tiene un examen de tipo <strong>${tipo}</strong> programado. Esa materia será omitida al guardar.`;
      } else {
        alerta.style.display='none';
      }
    }
  }catch{}
}
function updPuntosMax(){
  const tipo=v('exti');
  const inp=document.getElementById('expmax');
  const hint=document.getElementById('ptshint');
  if(!inp)return;
  if(tipo==='Extraordinario'){inp.value=100;if(hint)hint.textContent='Extraordinario siempre vale 100 pts';}
  else if(tipo==='Parcial'||tipo==='Recuperatorio'){inp.value=20;if(hint)hint.textContent='Parciales = 20 pts cada uno';}
  else{inp.value=50;if(hint)hint.textContent='Finales = 50 pts cada uno';}
}
async function svExamen(id){
  // Recopilar unificaciones de los slots dinámicos
  const unifs=[];
  const slots=document.querySelectorAll('[id^="unifSlot_"]');
  slots.forEach(slot=>{
    const n=slot.id.replace('unifSlot_','');
    const val=v('ufs_'+n);
    if(val&&!unifs.includes(val))unifs.push(val);
  });
  const o={
    asignacion_id:v('exas'),tipo:v('exti'),fecha:v('exfe'),hora:v('exho'),
    aula:v('exau'),observacion:v('exob'),periodo_id:parseInt(v('expe'))||null,
    puntos_max:parseInt(v('expmax'))||20,
    asignaciones_unif: unifs
  };
  if(!o.fecha)return alert('Ingresá la fecha del examen');
  if(!o.asignacion_id)return alert('Seleccioná una materia');
  try{
    if(id){
      await api('PUT','/api/examenes/'+id,o);
      _calInvalidar(o.fecha); // invalida el mes afectado en el caché
      cm(); go('examenes'); toast('✓ Examen actualizado','ok');
    } else {
      const r=await api('POST','/api/examenes',o);
      _calInvalidar(o.fecha); // invalida el mes afectado en el caché
      cm(); go('examenes');
      if(r.advertencia){
        toast(`✓ Examen guardado — ⚠ ${r.advertencia}`,'warn',6000);
      } else {
        const totalCreados=1+(r.unif_creados?.length||0);
        toast(`✓ ${totalCreados} examen${totalCreados>1?'es':''} programado${totalCreados>1?'s':''}${r.unif_creados?.length?` (${r.unif_creados.length} unificado${r.unif_creados.length>1?'s':''})`:''}`,'ok',4000);
      }
    }
  }catch(e){
    if(e.message?.includes('409')||e.duplicado){
      toast('⚠ Ya existe ese examen para esta materia en esa fecha','warn',5000);
    } else {
      toast('Error: '+e.message,'err');
    }
  }
}

    else url+='?docente_usuario_id='+me.id;
  }
  const horarios=await api('GET',url);
  let h=horarios||[];
  // Fallback extra: si el docente tiene docenteId, filtrar también por docente_usuario_id
  if(me.rol==='docente'&&h.length===0&&me.docenteId){

    const todosH=await api('GET','/api/horarios').catch(()=>[]);

// ── CALENDARIO DE EXÁMENES ────────────────────────────────────────────────────
async function pgCalendario(el){
  const hoy=new Date();
  W._calFecha={anio:hoy.getFullYear(),mes:hoy.getMonth()};
  W._calEl=el;
  // Cachés por sesión
  if(!W._calCache) W._calCache={};       // clave 'YYYY-MM' → {exs, acts}
  if(!W._calFeriados) W._calFeriados=null; // se carga una sola vez
  await renderCalendario(el);
}

function _calKey(anio,mes){return `${anio}-${String(mes+1).padStart(2,'0')}`;}
// Invalida el caché del calendario (llamar al crear/editar/borrar exámenes)
function _calInvalidar(fechaISO){
  if(!W._calCache) return;
  if(fechaISO){
    // Solo invalida el mes afectado
    const key=fechaISO.slice(0,7); // 'YYYY-MM'
    delete W._calCache[key];
  } else {
    // Invalida todo
    W._calCache={};
  }
}

// Pre-carga silenciosa de un mes (sin bloquear)
async function _preFetchMes(anio,mes){
  const key=_calKey(anio,mes);
  if(W._calCache&&W._calCache[key]) return; // ya cacheado
  const d=new Date(anio,mes,1), u=new Date(anio,mes+1,0);
  const desde=`${anio}-${String(mes+1).padStart(2,'0')}-01`;
  const hasta=`${anio}-${String(mes+1).padStart(2,'0')}-${String(u.getDate()).padStart(2,'0')}`;
  const filtDoc=me.rol==='docente'&&me.docenteId?'&docente_id='+me.docenteId:'';
  try{
    const [exs,acts]=await Promise.all([
      api('GET',`/api/examenes/calendario?desde=${desde}&hasta=${hasta}${filtDoc}`),
      api('GET',`/api/actividades?desde=${desde}&hasta=${hasta}`).catch(()=>[])
    ]);
    if(W._calCache) W._calCache[key]={exs,acts};
  }catch{}
}

async function renderCalendario(el){
  const {anio,mes}=W._calFecha;
  const key=_calKey(anio,mes);
  const desde=`${anio}-${String(mes+1).padStart(2,'0')}-01`;
  const ultimo=new Date(anio,mes+1,0);
  const hasta=`${anio}-${String(mes+1).padStart(2,'0')}-${String(ultimo.getDate()).padStart(2,'0')}`;
  const filtDoc=me.rol==='docente'&&me.docenteId?'&docente_id='+me.docenteId:'';

  // Mostrar skeleton inmediatamente mientras carga
  if(!W._calCache?.[key]){
    el.innerHTML=`<div class="ph"><h3>📅 Calendario de exámenes</h3></div>
    <div style="background:#fff;border:1px solid var(--bdr);border-radius:14px;padding:24px;text-align:center;color:#94a3b8;box-shadow:var(--shadow-sm)">
      <div style="font-size:28px;margin-bottom:8px">⏳</div>
      <div style="font-size:14px;font-weight:600;color:#64748b">Cargando calendario...</div>
    </div>`;
  }

  // Feriados: cargar solo una vez por sesión
  if(!W._calFeriados){
    W._calFeriados=await api('GET','/api/feriados').catch(()=>[]);
  }
  const feriados=W._calFeriados;

  // Exámenes y actividades: usar caché si existe
  let exs,acts;
  if(W._calCache?.[key]){
    ({exs,acts}=W._calCache[key]);
  } else {
    [exs,acts]=await Promise.all([
      api('GET',`/api/examenes/calendario?desde=${desde}&hasta=${hasta}${filtDoc}`),
      api('GET',`/api/actividades?desde=${desde}&hasta=${hasta}`).catch(()=>[])
    ]);
    W._calCache[key]={exs,acts};
  }

  // Pre-fetch del mes siguiente en background (sin await)
  const sigMes=mes===11?{a:anio+1,m:0}:{a:anio,m:mes+1};
  _preFetchMes(sigMes.a,sigMes.m);
  const ferSet=new Set(feriados.map(f=>f.fecha));
  const ferMap=Object.fromEntries(feriados.map(f=>[f.fecha,f]));
  const porFecha={};

  // Agrupar exámenes: misma materia+tipo+hora+fecha+docente → un solo item con múltiples cursos
  const exsAgrupados=[];
  const exGrpMap={};
  exs.forEach(e=>{
    const key=`${e.fecha}|${e.materia_nombre}|${e.tipo}|${e.hora||''}|${e.docente_nombre||''}`;
    const cursoLabel=`${e.carrera_nombre||''} ${e.curso_anio?e.curso_anio+'°':''}${e.curso_division&&e.curso_division!=='U'?' '+e.curso_division:''}`.trim();
    if(exGrpMap[key]){
      if(!exGrpMap[key]._cursos.includes(cursoLabel))exGrpMap[key]._cursos.push(cursoLabel);
    } else {
      const grp={...e,_tipo:'examen',_cursos:[cursoLabel]};
      exGrpMap[key]=grp; exsAgrupados.push(grp);
    }
  });
  exsAgrupados.forEach(e=>{if(!porFecha[e.fecha])porFecha[e.fecha]=[];porFecha[e.fecha].push(e);});
  (acts||[]).forEach(a=>{if(!porFecha[a.fecha])porFecha[a.fecha]=[];porFecha[a.fecha].push({...a,_tipo:'actividad'});});
  W._calExs=exsAgrupados; W._calActs=acts||[];

  // Colores y helpers
  const tipoColor=t=>t==='Extraordinario'?{bg:'#f3e5f5',bdr:'#9c27b0',txt:'#6a1b9a'}:t?.startsWith('Final')||t==='Complementario'?{bg:'#fff0f0',bdr:'#e53935',txt:'#b71c1c'}:{bg:'#e8f0fe',bdr:'#1565c0',txt:'#0d47a1'};
  const turnoLabel=e=>e.asig_turno===2?{lbl:'T2 · 20:40',col:'#4a148c'}:{lbl:'T1 · 19:00',col:'#0d47a1'};
  const esAlumno=me.rol==='alumno';
  const esDir=me.rol==='director';

  // Chip de examen dentro del calendario
  function chipExamen(e){
    const tc=tipoColor(e.tipo);
    const prof=e.docente_nombre?`${e.docente_apellido||''} ${e.docente_nombre||''}`.trim():'';
    const cursos=e._cursos?.join(' · ')||e.carrera_nombre||'';
    const tipoCorto=e.tipo==='Recuperatorio'?'Recup.':e.tipo==='Extraordinario'?'Extra.':e.tipo==='Complementario'?'Compl.':(e.tipo||'');
    return `<div style="background:${tc.bg};border-radius:5px;padding:3px 5px;margin-bottom:2px;font-size:10px;border-left:3px solid ${tc.bdr};cursor:${esAlumno?'default':'pointer'}"
      ${!esAlumno?`onclick="verExamen('${e.id}')" title="${e.tipo} — ${e.materia_nombre||''} — ${prof}"`:''}>
      <div style="display:flex;align-items:center;gap:3px;margin-bottom:1px;overflow:hidden">
        <span style="background:${tc.bdr};color:#fff;border-radius:3px;padding:0 3px;font-size:8px;font-weight:800;flex-shrink:0">${tipoCorto}</span>
        <strong style="color:${tc.txt};font-size:10px;line-height:1.1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;flex:1">${e.materia_nombre||'—'}</strong>
      </div>
      ${prof?`<div style="color:#555;font-size:9px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis">👤 ${prof}</div>`:''}
    </div>`;
  }

  const meses=['Enero','Febrero','Marzo','Abril','Mayo','Junio','Julio','Agosto','Septiembre','Octubre','Noviembre','Diciembre'];
  const dias=['Dom','Lun','Mar','Mié','Jue','Vie','Sáb'];
  const hoyStr=new Date().toISOString().split('T')[0];
  const primerDia=new Date(anio,mes,1).getDay();
  const totalDias=ultimo.getDate();
  let celdas='';

  for(let i=0;i<primerDia;i++)celdas+=`<div></div>`;
  for(let d=1;d<=totalDias;d++){
    const fs=`${anio}-${String(mes+1).padStart(2,'0')}-${String(d).padStart(2,'0')}`;
    const esHoy=fs===hoyStr;
    const esFeriado=ferSet.has(fs);
    const evs=(porFecha[fs]||[]);
    const examenes=evs.filter(e=>e._tipo==='examen');
    const actividades=evs.filter(e=>e._tipo==='actividad');

    // Separar por turno
    const t1=examenes.filter(e=>e.asig_turno!==2&&!(e.hora&&e.hora>='20'));
    const t2=examenes.filter(e=>e.asig_turno===2||(e.hora&&e.hora>='20'));

    // Ordenar cada turno por tipo (Parcial→Final→Extra) y luego por materia
    const ordenTipo=t=>t==='Parcial'?0:t==='Recuperatorio'?1:t?.startsWith('Final')?2:t==='Complementario'?3:4;
    const sortEx=(a,b)=>ordenTipo(a.tipo)-ordenTipo(b.tipo)||(a.materia_nombre||'').localeCompare(b.materia_nombre||'');
    t1.sort(sortEx); t2.sort(sortEx);

    const MAX_VISIBLE=2; // máximo chips sin "ver más"
    const totalEx=examenes.length;
    const showAll=totalEx<=MAX_VISIBLE;
    const t1Vis=showAll?t1:t1.slice(0,Math.min(t1.length,MAX_VISIBLE));
    const t2Vis=showAll?t2:t2.slice(0,Math.max(0,MAX_VISIBLE-t1.length));
    const resto=totalEx-(t1Vis.length+t2Vis.length);

    let cellContent='';

    // Actividades
    cellContent+=actividades.map(a=>`<div style="background:#e8f5e9;border-radius:4px;padding:2px 5px;margin-bottom:2px;font-size:9px;border-left:2px solid #4caf50">📌 ${a.titulo||''}</div>`).join('');

    // Turno 1
    if(t1Vis.length){
      cellContent+=`<div style="display:flex;align-items:center;gap:3px;margin-bottom:2px;margin-top:${actividades.length?'3px':'0'}">
        <div style="height:1px;flex:1;background:#1565c0;opacity:.25"></div>
        <span style="font-size:8px;font-weight:800;color:#1565c0;white-space:nowrap">T1 · 19:00</span>
        <div style="height:1px;flex:1;background:#1565c0;opacity:.25"></div>
      </div>${t1Vis.map(chipExamen).join('')}`;
    }

    // Turno 2
    if(t2Vis.length){
      cellContent+=`<div style="display:flex;align-items:center;gap:3px;margin-bottom:2px;margin-top:${t1Vis.length?'3px':'0'}">
        <div style="height:1px;flex:1;background:#4a148c;opacity:.25"></div>
        <span style="font-size:8px;font-weight:800;color:#4a148c;white-space:nowrap">T2 · 20:40</span>
        <div style="height:1px;flex:1;background:#4a148c;opacity:.25"></div>
      </div>${t2Vis.map(chipExamen).join('')}`;
    }

    // "Ver más" si hay muchos
    if(resto>0){
      cellContent+=`<div onclick="abrirDetalleDia('${fs}')" style="text-align:center;font-size:9px;color:#1565c0;font-weight:700;cursor:pointer;background:#e8f0fe;border-radius:4px;padding:2px;margin-top:2px">+${resto} más →</div>`;
    }

    // Botón agregar
    if(esDir){
      cellContent+=`<button onclick="mExamen()" style="font-size:8px;padding:1px 5px;border:1px dashed #ccc;border-radius:4px;background:transparent;cursor:pointer;margin-top:2px;color:var(--t3);width:100%">+ Examen</button>`;
    }

    celdas+=`<div style="border:1px solid ${esHoy?'#166534':esFeriado?'#ffcc02':'var(--bdr)'};border-radius:8px;padding:5px 6px;min-height:60px;background:${esFeriado?'#fff8e1':esHoy?'#f0fdf4':'#fff'};${esHoy?'box-shadow:0 0 0 2px #bbf7d0;':''}">
      <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:2px">
        <span style="font-weight:${esHoy?'900':'700'};font-size:12px;color:${esFeriado?'#e65100':esHoy?'#166534':'var(--txt)'}">
          ${d}${esHoy?` <span style="font-size:8px;background:#166534;color:#fff;border-radius:3px;padding:0 3px">hoy</span>`:''}
        </span>
        ${totalEx>0?`<span style="font-size:9px;background:${totalEx>=4?'#fee2e2':'#dbeafe'};color:${totalEx>=4?'#b91c1c':'#1d4ed8'};border-radius:10px;padding:1px 5px;font-weight:700">${totalEx}</span>`:''}
        ${esFeriado?`<span style="font-size:8px;color:#e65100" title="${ferMap[fs]?.nombre}">🏖</span>`:''}
      </div>
      ${esFeriado?`<div style="font-size:8px;color:#e65100;font-style:italic;margin-bottom:2px">${ferMap[fs]?.nombre}</div>`:''}
      ${cellContent}
    </div>`;
  }

  el.innerHTML=`<div class="ph"><h3>Calendario de Exámenes</h3>
    <div class="ph-right">
      ${esDir?`<button class="bs o" onclick="mFeriado()" title="Gestionar feriados">📅 Feriados</button>`:''}
      ${esDir?`<button class="bs" onclick="verListaFeriados()">Ver todos los feriados</button>`:''}
      ${esDir?`<button class="bn" onclick="mExamen()">+ Programar examen</button>`:''}
    </div></div>

  <!-- Leyenda de turnos -->
  <div style="display:flex;gap:12px;align-items:center;margin-bottom:10px;flex-wrap:wrap">
    <button class="bs" onclick="W._calFecha.mes--;if(W._calFecha.mes<0){W._calFecha.mes=11;W._calFecha.anio--;}renderCalendario(W._calEl)">◀</button>
    <span style="font-size:16px;font-weight:700">${meses[mes]} ${anio}</span>
    <button class="bs" onclick="W._calFecha.mes++;if(W._calFecha.mes>11){W._calFecha.mes=0;W._calFecha.anio++;}renderCalendario(W._calEl)">▶</button>
    <div style="display:flex;gap:8px;margin-left:8px;flex-wrap:wrap">
      <span style="font-size:10px;background:#e8f0fe;color:#1565c0;border-left:3px solid #1565c0;padding:2px 7px;border-radius:4px;font-weight:700">■ Parcial</span>
      <span style="font-size:10px;background:#fff0f0;color:#b71c1c;border-left:3px solid #e53935;padding:2px 7px;border-radius:4px;font-weight:700">■ Final</span>
      <span style="font-size:10px;background:#f3e5f5;color:#6a1b9a;border-left:3px solid #9c27b0;padding:2px 7px;border-radius:4px;font-weight:700">■ Extra</span>
      ${feriados.filter(f=>f.fecha>=desde&&f.fecha<=hasta).length?`<span style="font-size:10px;color:#e65100">🏖 ${feriados.filter(f=>f.fecha>=desde&&f.fecha<=hasta).length} feriados</span>`:''}
    </div>
  </div>

  <div style="overflow-x:auto;-webkit-overflow-scrolling:touch;border-radius:10px;padding-bottom:4px">
    <div style="min-width:840px">
      <div style="display:grid;grid-template-columns:repeat(7,minmax(120px,1fr));gap:4px;margin-bottom:4px">
        ${dias.map(d=>`<div style="text-align:center;font-size:10px;font-weight:700;color:var(--t2);padding:4px 0;letter-spacing:.04em">${d}</div>`).join('')}
      </div>
      <div style="display:grid;grid-template-columns:repeat(7,minmax(120px,1fr));gap:4px">${celdas}</div>
    </div>
  </div>

  <!-- Panel de detalle del día -->
  <div id="diaDetalle" style="margin-top:16px"></div>`;
}

function abrirDetalleDia(fecha){
  const exs=(W._calExs||[]).filter(e=>e.fecha===fecha);
  const acts=(W._calActs||[]).filter(a=>a.fecha===fecha);
  const esDir=me.rol==='director';

  // Agrupar por turno
  const t1=exs.filter(e=>e.asig_turno!==2&&!(e.hora&&e.hora>='20'));
  const t2=exs.filter(e=>e.asig_turno===2||(e.hora&&e.hora>='20'));

  const renderGrupo=(lista,titulo,color)=>lista.length?`
    <div style="margin-bottom:14px">
      <div style="font-size:11px;font-weight:800;color:${color};text-transform:uppercase;letter-spacing:.07em;padding:5px 12px;background:${color}18;border-radius:6px;margin-bottom:8px">${titulo}</div>
      ${lista.map(e=>{
        const prof=e.docente_nombre?`${e.docente_apellido||''} ${e.docente_nombre||''}`.trim():'Sin docente';
        const cursos=e._cursos?.join(', ')||e.carrera_nombre||'';
        const tc=e.tipo==='Extraordinario'?'#9c27b0':e.tipo?.startsWith('Final')||e.tipo==='Complementario'?'#e53935':'#1565c0';
        const puedeAdjuntar=esDir||(me.rol==='docente');
        const nombreCorto=e.archivo_nombre?(e.archivo_nombre.slice(0,20)+(e.archivo_nombre.length>20?'…':'')):'';
        return `<div style="border:1px solid #e2e8f0;border-radius:10px;padding:12px 16px;margin-bottom:8px;border-left:4px solid ${tc};background:#fff">
          <div style="display:flex;justify-content:space-between;align-items:flex-start;flex-wrap:wrap;gap:8px;margin-bottom:8px">
            <div style="flex:1;min-width:180px">
              <div style="display:flex;align-items:center;gap:6px;margin-bottom:4px">
                <span style="background:${tc};color:#fff;border-radius:4px;padding:1px 7px;font-size:10px;font-weight:800">${e.tipo||''}</span>
                <strong style="font-size:14px;color:#1e293b">${e.materia_nombre||'—'}</strong>
              </div>
              <div style="font-size:12px;color:#475569;margin-bottom:3px">👤 <strong>${prof}</strong></div>
              <div style="font-size:12px;color:#64748b">🎓 ${cursos}</div>
              ${e.aula?`<div style="font-size:11px;color:#94a3b8;margin-top:2px">🏫 Aula ${e.aula}</div>`:''}
            </div>
            <div style="text-align:right;flex-shrink:0">
              <div style="font-size:13px;font-weight:700;color:${tc}">${e.hora||'—'}</div>
              <div style="font-size:11px;color:#94a3b8">${e.puntos_max||'—'} pts</div>
            </div>
          </div>
          ${me.rol!=='alumno'?`<div style="display:flex;gap:6px;flex-wrap:wrap;align-items:center;padding-top:8px;border-top:1px solid #f1f5f9">
            ${esDir?`<button class="bs i" style="font-size:11px" onclick="abrirNotasExamen('${e.asignacion_id}','${e.tipo}')">📊 Notas</button>`:''}
            ${e.archivo_nombre?`
              <span style="font-size:11px;color:#166534;font-weight:600">📎 ${nombreCorto}</span>
              <button class="bs" style="font-size:11px;background:#e8f5e9;color:#2e7d32" onclick="descargarArchivoExamen('${e.id}','${e.archivo_nombre}')">⬇ Descargar</button>
              ${puedeAdjuntar?`<button class="bs d" style="font-size:11px" title="Eliminar archivo adjunto" onclick="borrarArchivoCalendario('${e.id}','${fecha}')">🗑 Eliminar</button>`:''}
            `:`${puedeAdjuntar?`
              <label class="bs" style="font-size:11px;cursor:pointer;background:#fff3e0;border-color:#e65100;color:#e65100" title="Adjuntar examen Word o PDF">
                📎 Adjuntar archivo
                <input type="file" accept=".doc,.docx,.pdf" style="display:none" onchange="subirArchivoCalendario('${e.id}','${fecha}',this)"/>
              </label>
            `:''}`}
          </div>`:''}
        </div>`;
      }).join('')}
    </div>`:''  ;

  const panel=document.getElementById('diaDetalle');
  if(!panel)return;
  panel.innerHTML=`
    <div style="border:1px solid var(--bdr);border-radius:14px;overflow:hidden;box-shadow:var(--shadow-sm)">
      <div style="background:linear-gradient(90deg,#1e3a5f,#1565c0);color:#fff;padding:12px 18px;display:flex;justify-content:space-between;align-items:center">
        <span style="font-weight:700;font-size:14px">📅 ${fmtFecha(fecha)} — ${exs.length} examen${exs.length!==1?'es':''}</span>
        <button onclick="document.getElementById('diaDetalle').innerHTML=''" style="background:rgba(255,255,255,.15);border:none;color:#fff;border-radius:6px;padding:3px 8px;cursor:pointer;font-size:12px">✕ Cerrar</button>
      </div>
      <div style="padding:14px">
        ${acts.length?`<div style="margin-bottom:12px">${acts.map(a=>`<div style="background:#e8f5e9;border-radius:8px;padding:8px 12px;font-size:12px;border-left:3px solid #4caf50">📌 <strong>${a.titulo||''}</strong>${a.descripcion?': '+a.descripcion:''}</div>`).join('')}</div>`:''}
        ${renderGrupo(t1,'🔵 Turno 1 — 19:00 hs','#1565c0')}
        ${renderGrupo(t2,'🟣 Turno 2 — 20:40 hs','#4a148c')}
        ${!exs.length&&!acts.length?'<div class="es">Sin eventos este día</div>':''}
      </div>
    </div>`;
  panel.scrollIntoView({behavior:'smooth',block:'nearest'});
}
async function subirArchivoCalendario(exId,fecha,input){
  const file=input.files[0]; if(!file)return;
  input.value='';
  const fd=new FormData(); fd.append('archivo',file);
  try{
    toast('Subiendo archivo...','info',2000);
    await api('POST','/api/examenes/'+exId+'/archivo',fd,true);
    // Actualizar caché local para refrescar el panel sin recargar el mes
    const ex=(W._calExs||[]).find(e=>String(e.id)===String(exId));
    if(ex) ex.archivo_nombre=file.name;
    toast('✓ Archivo adjuntado: '+file.name,'ok',4000);
    abrirDetalleDia(fecha);
  }catch(e){toast('Error al subir: '+e.message,'err');}
}
async function borrarArchivoCalendario(exId,fecha){
  if(!confirm('¿Eliminar el archivo adjunto de este examen? Esta acción no se puede deshacer.'))return;
  try{
    await api('DELETE','/api/examenes/'+exId+'/archivo');
    const ex=(W._calExs||[]).find(e=>String(e.id)===String(exId));
    if(ex){ex.archivo_nombre=null;}
    toast('✓ Archivo eliminado','ok');
    abrirDetalleDia(fecha);
  }catch(e){toast('Error: '+e.message,'err');}
}

async function svSolicitudAlumno(asigId,tipo){
  const nombre=(v('salNom')||'').trim();
  const apellido=(v('salApe')||'').trim();
  const ci=(v('salCi')||'').trim();
  if(!nombre||!apellido){toast('Completar nombre y apellido','warn');return;}
  let observacion=null;
  if(tipo==='conflicto'){
    const comentario=(v('salComentario')||'').trim();
    if(!comentario){toast('Por favor escribí el comentario para el Director','warn');return;}
    observacion=JSON.stringify({tipo:'conflicto',comentario});
  }
  try{
    await api('POST','/api/solicitudes-alumno',{nombre,apellido,ci,asignacion_id:asigId,observacion});
    cm();
    toast('✓ Solicitud enviada al Director','ok',4000);
  }catch(e){toast('Error: '+e.message,'err');}
}

async function guardarTodasNotas(asigId){
  const btn=document.getElementById('btnGuardarNotas');
  if(btn){btn.disabled=true;btn.textContent='⏳ Guardando...';}
  // Leer TODOS los inputs de la grilla directamente del DOM (evita bug del navegador que
  // guarda contraseña y resetea W._nc antes de que se dispare el onchange)
  const campos=['tp1','tp2','tp3','tp4','tp5','parcial','parcial_recuperatorio','final_ord','final_recuperatorio','complementario','extraordinario'];
  const nc={};
  document.querySelectorAll('[data-al-id]').forEach(row=>{
    const alId=row.dataset.alId;
    if(!alId)return;
    nc[alId]=nc[alId]||{};
    campos.forEach(campo=>{
      const inp=row.querySelector(`[data-campo="${campo}"]`);
      if(inp){const v=inp.value.trim();nc[alId][campo]=v===''?null:parseFloat(v);}
    });
  });
  // Fusionar con W._nc por si hay datos ya cargados
  const merged={...W._nc};
  Object.keys(nc).forEach(alId=>{
    merged[alId]={...(merged[alId]||{}), ...Object.fromEntries(Object.entries(nc[alId]).filter(([,v])=>v!==undefined))};
  });
  let guardados=0, errores=0;
  for(const alId of Object.keys(merged)){
    try{
      await api('PUT',`/api/notas/${alId}/${asigId}`,merged[alId]);
      guardados++;
    }catch{errores++;}
  }
  if(btn){btn.disabled=false;btn.textContent='💾 Guardar notas';}
  if(errores>0){toast(`⚠ ${guardados} guardados, ${errores} con error`,'warn',4000);}
  else{
    toast(`✓ ${guardados} registros guardados correctamente`,'ok',3000);
    // Marcar botón como guardado visualmente sin recargar la grilla
    if(btn){btn.style.background='#1b5e20';btn.textContent='✓ Guardado';}
    setTimeout(()=>{if(btn){btn.style.background='#2e7d32';btn.textContent='💾 Guardar notas';}},2500);
  }
  // NO llamar W.loadNotas() aquí — causaría que los datos desaparezcan
  // Solo recargar si hubo errores para mostrar el estado actualizado
  if(errores>0) W.loadNotas(asigId);
}
W.guardarTodasNotas=guardarTodasNotas;

      }).join('')}

function cargarFechasAsist(asigId){
  if(!asigId){W._asistId=null;return;}
  W._asistId=asigId;
  const sel=document.getElementById('selAsistAsig');
  const opt=sel?.selectedOptions[0];
  // Buscar el día de clase de esta asignación
  const asig=(W._asistAsigs||[]).find(a=>a.id===asigId);
  const horario=(W._asistHorarios||[]).find(h=>h.asignacion_id===asigId);
  const dia=asig?.dia||horario?.dia||opt?.dataset?.dia||'';
  const diasNum={Lunes:1,Martes:2,'Miércoles':3,Jueves:4,Viernes:5};
  const numDia=diasNum[dia]||0;
  // Generar todas las fechas del mes actual que coincidan con ese día
  const hoy=new Date();
  const anio=hoy.getFullYear(), mes=hoy.getMonth();
  const fechas=[];
  const cursor=new Date(anio,mes,1);
  while(cursor.getMonth()===mes){
    if(!numDia||cursor.getDay()===numDia){fechas.push(new Date(cursor));}
    cursor.setDate(cursor.getDate()+1);
  }
  const fecSel=document.getElementById('fecAsist');
  if(!fecSel)return;
  const hoyStr=hoy.toISOString().split('T')[0];
  if(numDia===0){
    // Sin día configurado: mostrar todas las fechas del mes
    fecSel.innerHTML='<option value="">Sin día configurado — todas las fechas</option>';
    for(let d=1;d<=31;d++){
      const f=new Date(anio,mes,d);
      if(f.getMonth()!==mes)break;
      const fs=f.toISOString().split('T')[0];
      fecSel.innerHTML+=`<option value="${fs}" ${fs===hoyStr?'selected':''}>${f.toLocaleDateString('es',{weekday:'short',day:'numeric',month:'short'})}</option>`;
    }
  }else{
    fecSel.innerHTML=`<option value="">— Seleccionar fecha (${dia}s) —</option>`;
    fechas.forEach(f=>{
      const fs=f.toISOString().split('T')[0];
      fecSel.innerHTML+=`<option value="${fs}" ${fs===hoyStr||(!fechas.some(x=>x.toISOString().split('T')[0]===hoyStr)&&f===fechas[0])?'selected':''}>${f.toLocaleDateString('es',{weekday:'long',day:'numeric',month:'long'})}</option>`;
    });
  }
  // Cargar asistencia con la fecha seleccionada
  W.loadAsist(asigId);
}

    </div>`);
  } else {
    // Director: marca directamente como Retirado

        try{

// ── MODAL DE CONFIRMACIÓN RICO (reemplaza confirm() nativo) ──────────────────
function confirm2(titulo, cuerpo, onAceptar, onModificar){
  const id='cfm_'+Date.now();
  // Guardar callbacks en objeto global para evitar toString() que rompe con async functions
  window._cfm=window._cfm||{};
  window._cfm[id+'_ok']=async function(){document.getElementById(id)?.remove();await onAceptar();};
  window._cfm[id+'_mod']=onModificar?function(){document.getElementById(id)?.remove();onModificar();}:null;
  const div=document.createElement('div');
  div.id=id;
  div.style.cssText='position:fixed;inset:0;background:rgba(0,0,0,.55);z-index:10001;display:flex;align-items:center;justify-content:center';
  div.innerHTML=`<div style="background:#fff;border-radius:14px;padding:22px;max-width:440px;width:92%;box-shadow:0 8px 40px rgba(0,0,0,.3)">
    <h4 style="font-size:15px;font-weight:700;color:#1a2a4a;margin-bottom:10px">${titulo}</h4>
    <div style="font-size:13px;color:#444;line-height:1.6;margin-bottom:16px">${cuerpo}</div>
    <div style="display:flex;gap:8px;justify-content:flex-end;flex-wrap:wrap">
      <button onclick="document.getElementById('${id}')?.remove()" style="padding:8px 16px;border:1px solid var(--bdr);border-radius:7px;background:#fff;color:#555;cursor:pointer;font-size:13px;font-weight:600">✕ Cancelar</button>
      ${onModificar?`<button onclick="window._cfm['${id}_mod']()" style="padding:8px 16px;border:1px solid var(--bdr);border-radius:7px;background:#fff3e0;color:#e65100;cursor:pointer;font-size:13px;font-weight:600">✏ Modificar</button>`:''}
      <button onclick="window._cfm['${id}_ok']()" style="padding:8px 20px;border:none;border-radius:7px;background:#166534;color:#fff;cursor:pointer;font-size:13px;font-weight:700">✓ Confirmar</button>
    </div>
  </div>`;
  document.body.appendChild(div);
}

function filtRsAsigs(){

async function generarResumen(){
  const asigId=v('rsAsig'),anio=v('rsAnio'),mes=v('rsMes'),dia=v('rsDia');
  if(!asigId)return alert('Seleccionar una materia');

    let urlAnio=anio,urlMes=mes;
    if(dia){urlAnio=dia.split('-')[0];urlMes=String(parseInt(dia.split('-')[1]));}
    const r=await api('GET',`/api/asistencia/resumen?asignacion_id=${asigId}&anio=${urlAnio}&mes=${urlMes}`);
    let {alumnos,fechas,desde,hasta}=r;
    // Si hay día específico, filtrar solo ese día
    if(dia){fechas=fechas.filter(f=>f===dia);desde=dia;hasta=dia;}
    const meses=['Enero','Febrero','Marzo','Abril','Mayo','Junio','Julio','Agosto','Septiembre','Octubre','Noviembre','Diciembre'];
    const estColor={P:'#d4edda',A:'#f8d7da',T:'#fff3cd',J:'#d1ecf1'};

    semanas.forEach((sem,si)=>{
      html+=`<p style="font-weight:700;font-size:12px;margin:12px 0 6px">${dia?'Detalle del día':'Semana '+(si+1)}</p>

        <th style="padding:5px 6px;border:1px solid var(--bdr);text-align:center;background:#d4edda">P</th>
        <th style="padding:5px 6px;border:1px solid var(--bdr);text-align:center;background:#f8d7da">A</th>
        <th style="padding:5px 6px;border:1px solid var(--bdr);text-align:center">%</th>
      </tr></thead><tbody>
      ${alumnos.map(al=>{
        const presT=Object.values(al.dias||{}).filter(e=>e==='P').length;
        const ausT=Object.values(al.dias||{}).filter(e=>e==='A').length;
        const tot=Object.values(al.dias||{}).length;
        const pct=tot?Math.round(presT/tot*100):0;
        return`<tr>
          <td style="padding:5px 8px;border:1px solid var(--bdr)"><strong>${al.apellido||''}</strong>, ${al.nombre||''}</td>
          ${sem.map(f=>{const e=al.dias?.[f]||'';return`<td style="border:1px solid var(--bdr);text-align:center;background:${estColor[e]||'#fff'};padding:3px">${e||'—'}</td>`;}).join('')}
          <td style="border:1px solid var(--bdr);text-align:center;background:#d4edda;font-weight:700">${presT}</td>
          <td style="border:1px solid var(--bdr);text-align:center;background:#f8d7da;font-weight:700">${ausT}</td>

        </tr>`;
      }).join('')}
      </tbody></table></div>`;
    });
    cm();
    modal(`${html}<div class="mf"><button class="bn" onclick="cm()">Cerrar</button></div>`,true);
  }catch(e){alert('Error: '+e.message);}
}

  const desde=`${anio}-${String(mes).padStart(2,'0')}-01`;

  const hasta=`${anio}-${String(mes).padStart(2,'0')}-${String(fin.getDate()).padStart(2,'0')}`;
  document.getElementById('gmMsg').innerHTML='<div class="ir" style="background:#f0faf4">Generando...</div>';
  try{
    const r=await api('POST','/api/asistencia/generar',{fecha_inicio:desde,fecha_fin:hasta});

  }catch(e){document.getElementById('gmMsg').innerHTML=`<div class="ir err">${e.message}</div>`;}
}

function limpiarFiltrosPagos(){
  const el=document.getElementById('filtPagoBus'); if(el)el.value='';
  const ec=document.getElementById('filtPagoCarr'); if(ec)ec.value='';
  const ea=document.getElementById('filtPagoAnio'); if(ea)ea.value='';
  const ecu=document.getElementById('filtPagoCurso'); if(ecu)ecu.value='';
  const ek=document.getElementById('filtKanbanCol'); if(ek)ek.value='';
  filtPagoCursos();
  // Volver al placeholder
  W._pdata={...W._pdata,als:[]};
  W._kanban={};
  const ph=document.getElementById('pagosPlaceholder');
  const tw=document.getElementById('pagosTablaWrap');
  if(ph)ph.style.display='';
  if(tw)tw.style.display='none';
}

let _busTimer=null;
function debounceBusPagos(){
  clearTimeout(_busTimer);
  const val=(document.getElementById('filtPagoBus')||{}).value||'';
  if(val.length===0){ limpiarFiltrosPagos(); return; }
  if(val.length===1){
    // Mostrar hint de "seguí escribiendo"
    const ph=document.getElementById('pagosPlaceholder');
    const tw=document.getElementById('pagosTablaWrap');
    if(ph){ ph.style.display=''; ph.innerHTML=`<div style="font-size:28px;margin-bottom:10px">⌨️</div><div style="font-size:14px;font-weight:600;color:#64748b">Seguí escribiendo...</div><div style="font-size:12px;color:#94a3b8;margin-top:4px">Necesitás al menos 2 caracteres para buscar en todas las carreras</div>`; }
    if(tw) tw.style.display='none';
    return;
  }
  _busTimer=setTimeout(()=>cargarAlumnosPagos(),400);
}

async function cargarAlumnosPagos(){
  const bus=(document.getElementById('filtPagoBus')||{}).value||'';
  const carrId=String((document.getElementById('filtPagoCarr')||{}).value||'');
  const anio=String((document.getElementById('filtPagoAnio')||{}).value||'');
  const cursoId=String((document.getElementById('filtPagoCurso')||{}).value||'');

  // Sin ningún filtro → mostrar placeholder
  const hayFiltro=bus.length>=2||carrId||anio||cursoId;
  const ph=document.getElementById('pagosPlaceholder');
  const tw=document.getElementById('pagosTablaWrap');
  if(!hayFiltro){
    if(ph)ph.style.display='';
    if(tw)tw.style.display='none';
    return;
  }

  // Mostrar tabla con loading
  if(ph)ph.style.display='none';
  if(tw)tw.style.display='';
  const tbody=document.getElementById('tablaPagosCuerpo');
  if(tbody)tbody.innerHTML=`<tr><td colspan="9" style="text-align:center;padding:32px;color:#94a3b8">⏳ Cargando...</td></tr>`;

  // Construir parámetros
  const qs=new URLSearchParams();
  if(bus.length>=2) qs.set('busqueda',bus);
  // carrera_id se envía al servidor (incluye SIN_ASIGNAR)
  if(carrId) qs.set('carrera_id',carrId);
  if(cursoId) qs.set('curso_id',cursoId);

  // Para kanban: mismos filtros (incluyendo busqueda para no traer todos los alumnos)
  const kanbanQs=new URLSearchParams();
  if(bus.length>=2) kanbanQs.set('busqueda',bus);
  if(carrId) kanbanQs.set('carrera_id',carrId);
  if(cursoId) kanbanQs.set('curso_id',cursoId);

  try{
    const [als,kanban]=await Promise.all([
      api('GET','/api/alumnos?'+qs.toString()),
      api('GET','/api/pagos/resumen-kanban?'+kanbanQs.toString()).catch(()=>({}))
    ]);
    // Filtro de año sigue siendo client-side (viene en el alumno)
    const cursoAnioMap={};
    (W._pagosCursos||[]).forEach(cu=>{cursoAnioMap[String(cu.id)]=String(cu.anio);});
    let lista=als;
    if(anio) lista=lista.filter(a=>(cursoAnioMap[String(a.curso_id||'')]||String(a.curso_anio||''))===anio);
    W._pdata={...W._pdata,als:lista};
    W._kanban=kanban;
    renderTablaPagos();
  }catch(e){
    if(tbody)tbody.innerHTML=`<tr><td colspan="9" style="text-align:center;padding:32px;color:#b91c1c">Error al cargar: ${e.message}</td></tr>`;
  }
}

function renderTablaPagos(){
  const bus=(v('filtPagoBus')||'').toLowerCase().trim();
  const carrId=String(v('filtPagoCarr')||''), anio=String(v('filtPagoAnio')||''), cursoId=String(v('filtPagoCurso')||'');
  const colFil=v('filtKanbanCol')||'';
  let als=W._pdata?.als||[];
  // Mapa curso_id → anio (más confiable que curso_anio del alumno)
  const cursoAnioMap={};
  (W._pagosCursos||[]).forEach(cu=>{cursoAnioMap[String(cu.id)]=String(cu.anio);});
  if(bus) als=als.filter(a=>(a.display_nombre||'').toLowerCase().includes(bus)||(a.display_apellido||'').toLowerCase().includes(bus)||(a.display_ci||'').includes(bus)||(a.display_apellido||'').toLowerCase().concat(' ',(a.display_nombre||'').toLowerCase()).includes(bus));
  if(carrId==='SIN_ASIGNAR') als=als.filter(a=>!a.carrera_id);
  else if(carrId) als=als.filter(a=>String(a.carrera_id||'')===carrId);
  if(anio)   als=als.filter(a=>(cursoAnioMap[String(a.curso_id||'')]||String(a.curso_anio||''))===anio);
  if(cursoId)als=als.filter(a=>String(a.curso_id||'')===cursoId);
  const mostrandoSinAsignar=(carrId==='SIN_ASIGNAR');

  const kanban=W._kanban||{};
  const mes=new Date().getMonth()+1;
  const cuotasEsp=Math.max(0,mes-1);
  const avCol=['#166534','#1D9E75','#D85A30','#7F77DD','#BA7517','#c0392b'];

  // Filtrar por estado
  if(colFil==='aldia') als=als.filter(a=>{ const k=kanban[a.id]||{}; return k.tiene_matricula&&(k.cuotas_pagadas||0)>=cuotasEsp; });
  else if(colFil==='mora') als=als.filter(a=>{ const k=kanban[a.id]||{}; return k.tiene_matricula&&(k.cuotas_pagadas||0)<cuotasEsp; });
  else if(colFil==='sinmat') als=als.filter(a=>!(kanban[a.id]||{}).tiene_matricula);

  const tbody=document.getElementById('tablaPagosCuerpo');
  if(!tbody)return;
  if(!als.length){ tbody.innerHTML=`<tr><td colspan="9" style="text-align:center;padding:32px;color:#94a3b8">Sin alumnos</td></tr>`; return; }

  tbody.innerHTML=als.map((a,i)=>{
    const k=kanban[a.id]||{};
    const ini=((a.display_apellido||'').charAt(0)+(a.display_nombre||'').charAt(0)).toUpperCase();
    const col=avCol[(a.id||'').charCodeAt(4)%avCol.length]||'#166534';
    const pagadas=Number(k.cuotas_pagadas||0);
    const pct=Math.round((pagadas/12)*100);
    const barCol=pct>=80?'#22c55e':pct>=40?'#f59e0b':'#ef4444';
    const totalGs=Number(k.total_pagado||0);
    const tieneMat=k.tiene_matricula;
    const es1erAnio=Number(a.curso_anio)===1;
    // 1er año no paga matrícula — ignorar tiene_matricula para el estado
    const estado=(!tieneMat&&!es1erAnio)?'sinmat':(pagadas>=cuotasEsp?'aldia':'mora');
    const estadoBadge={
      aldia:'<span style="background:#dcfce7;color:#166534;border:1px solid #86efac;padding:3px 10px;border-radius:20px;font-size:11px;font-weight:700">✅ Al día</span>',
      mora: '<span style="background:#fee2e2;color:#b91c1c;border:1px solid #fca5a5;padding:3px 10px;border-radius:20px;font-size:11px;font-weight:700">⚠️ En mora</span>',
      sinmat:'<span style="background:#f1f5f9;color:#475569;border:1px solid #cbd5e1;padding:3px 10px;border-radius:20px;font-size:11px;font-weight:700">📋 Sin mat.</span>'
    }[estado];
    const rowBg=i%2===0?'#fff':'#fafafa';
    return `<tr id="fila-${a.id}" style="background:${rowBg};border-bottom:1px solid #f1f5f9;cursor:pointer;transition:background .1s"
        onclick="abrirDetallePago('${a.id}')"
        onmouseover="this.style.background='#f0fdf4'"
        onmouseout="if(W._pagoSel!=='${a.id}')this.style.background='${rowBg}'">
      <td style="padding:11px 10px;text-align:center;color:#94a3b8;font-size:12px;font-weight:600;width:36px;white-space:nowrap">${i+1}</td>
      <td style="padding:11px 16px">
        <div style="display:flex;align-items:center;gap:10px">
          <div style="width:34px;height:34px;border-radius:8px;background:linear-gradient(135deg,${col},${col}bb);color:#fff;display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:800;flex-shrink:0">${ini}</div>
          <div>
            <div style="font-weight:700;color:#1e293b;font-size:13px">${a.display_apellido||''}, ${a.display_nombre||''}</div>
            ${a.display_ci
              ?`<div style="font-size:11px;color:#94a3b8">C.I. ${a.display_ci}</div>`
              :`<div style="font-size:11px;color:#dc2626;font-weight:700">⚠ Sin cédula — Pendiente</div>`}
          </div>
        </div>
      </td>
      <td style="padding:11px 12px;color:#475569;font-size:12px">${a.carrera_nombre||'<span style="color:#94a3b8;font-style:italic">Sin asignar</span>'}${a.curso_anio?'<br><span style="font-size:11px;color:#94a3b8">'+a.curso_anio+'° año</span>':''}</td>
      <td style="padding:11px 12px;text-align:center">${a.curso_division&&a.curso_division!=='U'?`<span style="background:#ede9fe;color:#7c3aed;font-size:11px;padding:2px 8px;border-radius:4px;font-weight:700">Secc. ${a.curso_division}</span>`:(a.curso_division==='U'?`<span style="font-size:11px;color:#94a3b8">Única</span>`:`<span style="font-size:11px;color:#cbd5e1">—</span>`)}</td>
      <td style="padding:11px 12px;text-align:center">${tieneMat?'<span style="font-size:16px">✅</span>':'<span style="font-size:16px">❌</span>'}</td>
      <td style="padding:11px 12px">
        <div style="display:flex;align-items:center;gap:8px">
          <div style="flex:1;background:#e2e8f0;border-radius:4px;height:7px;overflow:hidden;min-width:60px">
            <div style="background:${barCol};height:100%;width:${pct}%;border-radius:4px"></div>
          </div>
          <span style="font-size:11px;font-weight:700;color:#475569;white-space:nowrap">${pagadas}/12</span>
        </div>
      </td>
      <td style="padding:11px 12px;text-align:right;font-weight:800;color:#166534;white-space:nowrap;font-size:12px">Gs. ${totalGs.toLocaleString()}</td>
      <td style="padding:11px 12px;text-align:center">
        ${mostrandoSinAsignar
          ?`<button onclick="event.stopPropagation();mMoverAlumno('${a.id}')" style="font-size:11px;padding:4px 10px;border:1px solid #7c3aed;border-radius:6px;background:#fff;color:#7c3aed;cursor:pointer;font-weight:600;white-space:nowrap">↕ Asignar</button>`
          :estadoBadge}
      </td>
    </tr>`;
  }).join('');
}

async function confirmarElimAlumno(alId){
  try{
    await api('DELETE','/api/alumnos/'+alId+'/completo');
    cm();
    toast('✓ Alumno eliminado permanentemente','ok',4000);
    cerrarDetallePago();
    cargarAlumnosPagos();
  }catch(e){
    toast('Error: '+e.message,'err');
  }
}

function toggleFilaPago(alId){ abrirDetallePago(alId); }

function filtrarKanban(estado){
  const s=document.getElementById('filtKanbanCol');
  if(s)s.value=estado;
  // Si hay datos cargados, re-renderizar; si no, no hacer nada
  if((W._pdata?.als||[]).length>0) renderTablaPagos();
}

async function abrirHistorialPago(alId){
  modal('<div id="panelHistorialPago" style="min-height:180px"><div style="text-align:center;padding:30px;color:#888">⏳ Cargando...</div></div>',true);
  await selAlumnoPago(alId);
}

async function refreshKanban(alId){
  // Refrescar solo con los filtros actuales para no cargar todos los alumnos
  const carrId=String((document.getElementById('filtPagoCarr')||{}).value||'');
  const cursoId=String((document.getElementById('filtPagoCurso')||{}).value||'');
  const kanbanQs=new URLSearchParams();
  if(carrId) kanbanQs.set('carrera_id',carrId);
  if(cursoId) kanbanQs.set('curso_id',cursoId);
  try{ W._kanban=await api('GET','/api/pagos/resumen-kanban?'+kanbanQs.toString()); }catch{}
  renderTablaPagos();
  if(alId) setTimeout(()=>abrirDetallePago(alId),120);
}

function volverListaPago(){ cm(); }

function renderAlumnosPago(){ renderTablaPagos(); }

function filtPagoCursos(){
  const carrId=String(v('filtPagoCarr')||''), anio=String(v('filtPagoAnio')||'');
  const sel=document.getElementById('filtPagoCurso');
  if(!sel)return;
  // "SIN_ASIGNAR" no tiene cursos
  if(carrId==='SIN_ASIGNAR'){sel.innerHTML='<option value="">—</option>';return;}
  let cursos=W._pagosCursos||[];
  if(carrId)cursos=cursos.filter(cu=>String(cu.carrera_id||'')===carrId);
  if(anio)cursos=cursos.filter(cu=>String(cu.anio||'')===anio);
  sel.value='';
  sel.innerHTML='<option value="">Todas las secciones</option>'+cursos.map(cu=>{
    const divLabel=cu.division==='U'?'Única':'Secc. '+cu.division;
    const label=anio&&carrId?divLabel
      :anio?`${cu.carrera_nombre} — ${divLabel}`
      :carrId?`${cu.anio}° — ${divLabel}`
      :`${cu.carrera_nombre} ${cu.anio}° — ${divLabel}`;
    return `<option value="${cu.id}">${label}</option>`;
  }).join('');
}

  const aranceles = await api('GET','/api/aranceles').catch(()=>[]);
  const examsCopago = [
    {value:'parcial_recuperatorio', label:'Parcial Recuperatorio', tipo:'parcial'},
    {value:'final_ord', label:'Final Ordinario', tipo:'final'},
    {value:'final_recuperatorio', label:'Final Recuperatorio', tipo:'final'},
    {value:'complementario', label:'Final Complementario', tipo:'final'},
    {value:'extraordinario', label:'Final Extraordinario ⚡', tipo:'extraordinario'},
  ];
  // Mostrar monto de arancel cuando corresponda
  function montoAr(tipo){
    const ar=aranceles.find(a=>a.tipo===tipo);
    return ar?` — Gs. ${Number(ar.monto).toLocaleString()}`:'';
  }
  modal(`<h4>🔓 Habilitar examen por Dirección</h4>
  <p style="font-size:12px;color:var(--t2);margin-bottom:10px">
    Solo el <strong>Parcial Ordinario es gratuito</strong>. Los demás exámenes requieren pago.<br>
    Seleccioná el examen a habilitar por excepción de Dirección.

  const conc_low=(o.concepto||'').toLowerCase();
  for(const [tipo,kws] of Object.entries(tipoMap)){
    if(kws.some(k=>conc_low.includes(k))){
      arancelEsp=aranceles.find(a=>a.tipo===tipo&&(!a.carrera_id||a.carrera_id===al?.carrera_id))||aranceles.find(a=>a.tipo===tipo);
      break;
    }
  }
  const montoEsp=arancelEsp?arancelEsp.monto:null;
  const diff=montoEsp&&o.monto<montoEsp?montoEsp-o.monto:0;
  let alertaHTML='';
  if(montoEsp&&o.monto!==montoEsp){
    if(o.monto<montoEsp){
      alertaHTML=`<div style="background:#fff3e0;border:1px solid #ffb74d;border-radius:6px;padding:8px 12px;margin-top:8px;font-size:12px;color:#e65100">
        ⚠ <strong>Monto menor a la cuota/arancel</strong><br>
        Arancel esperado: <strong>Gs. ${Number(montoEsp).toLocaleString()}</strong><br>
        Se registrará el pago de Gs. ${Number(o.monto).toLocaleString()} y quedará un saldo pendiente de <strong>Gs. ${Number(diff).toLocaleString()}</strong>.
      </div>`;
    } else {
      alertaHTML=`<div style="background:#e8f5e9;border-radius:6px;padding:6px 10px;margin-top:8px;font-size:12px;color:#2e7d32">
        ✓ Monto superior al arancel (Gs. ${Number(montoEsp).toLocaleString()})
      </div>`;
    }
  }
  confirm2(
    '💰 Confirmar registro de pago',
    `<div style="background:#f0f4f8;border-radius:8px;padding:10px 14px">
      <div><span style="font-size:11px;color:var(--t3)">Alumno</span><br><strong>${nom}</strong></div>
      <div style="margin-top:6px"><span style="font-size:11px;color:var(--t3)">Concepto</span><br><strong>${o.concepto}</strong></div>
      <div style="margin-top:6px"><span style="font-size:11px;color:var(--t3)">Monto</span><br><span style="font-size:20px;font-weight:900;color:#2e7d32">Gs. ${(o.monto||0).toLocaleString()}</span>${montoEsp?`<span style="font-size:11px;color:var(--t2);margin-left:8px">(Arancel: Gs. ${Number(montoEsp).toLocaleString()})</span>`:''}</div>
      <div style="margin-top:4px;font-size:12px">Medio: ${o.medio_pago}${o.comprobante?' · Comp: '+o.comprobante:''}</div>
    </div>
    ${alertaHTML}
    <p style="font-size:12px;color:var(--t2);margin-top:8px">Verificá que el monto y concepto sean correctos.</p>`,
    async function(){
      const pd=window._pagoData;
      try{
        const r=await api('POST','/api/pagos',pd);
        cm();
        const alId=pd.alumno_id||String(W._pagoSel||'');
        // Recargar vista de pagos
        const enDetalle=W._pagoSel&&document.getElementById('vistaDetallePago')?.style.display!=='none';
        if(enDetalle){
          refreshKanban(alId);
        } else if(alId&&document.getElementById('alPagoOverlay')){
          selAlumnoPago(alId);
        } else {
          go('pagos');
        }
        if(r.monto_pendiente>0){
          toast(`✓ Pago registrado — Saldo pendiente: Gs. ${Number(r.monto_pendiente).toLocaleString()}`,'info',5000);
        } else {
          toast('✓ Pago registrado','ok');
        }
      }
      catch(e){toast('Error: '+e.message,'err');}
    },
    function(){toast('Podés corregir los datos del pago','info');}

function mostrarPrevSinAsignar(data){
  const {filas,columnas}=data;
  if(!filas.length)return alert('No se encontraron alumnos con cédula válida en el archivo.');
  W._prevSinAsignarFilas=filas;
  const nuevos=filas.filter(f=>f.esNuevo).length;
  const existentes=filas.filter(f=>!f.esNuevo).length;
  const conCarrera=filas.filter(f=>!f.esNuevo&&f.existente?.carrera_nombre).length;

  const rows=filas.map((f,i)=>{
    // ── Columna 1: Alumno
    const nom=f.esNuevo
      ?`${f.apellido||''}, ${f.nombre||''}`
      :`${f.existente.apellido||f.apellido||''}, ${f.existente.nombre||f.nombre||''}`;
    const colAlumno=`<td style="padding:8px 10px;min-width:140px">
      <div style="font-size:12px;font-weight:700;color:#1e293b">${nom}</div>
      <div style="font-size:10px;color:#64748b">CI: ${f.ci}</div>
    </td>`;

    // ── Columna 2: Pagos en la planilla
    const pagosPlani=f.pagos.filter(p=>p.monto>0);
    const totalPlani=pagosPlani.reduce((s,p)=>s+p.monto,0);
    const colPlani=pagosPlani.length>0
      ?`<td style="padding:8px 10px;min-width:150px">
          <div style="font-size:12px;font-weight:700;color:#166534">${pagosPlani.length} pago${pagosPlani.length>1?'s':''} · Gs.${totalPlani.toLocaleString()}</div>
          <div style="font-size:10px;color:#64748b;margin-top:2px">${pagosPlani.map(p=>p.concepto).join(', ')}</div>
        </td>`
      :`<td style="padding:8px 10px;font-size:11px;color:#cbd5e1">Sin pagos</td>`;

    // ── Columna 3: Estado actual en el sistema
    let colSistema='';
    if(f.esNuevo){
      colSistema=`<td style="padding:8px 10px;min-width:160px">
        <span style="background:#dbeafe;color:#1e40af;font-size:10px;padding:2px 8px;border-radius:4px;font-weight:700">NUEVO</span>
        <div style="font-size:10px;color:#64748b;margin-top:3px">Se creará sin carrera asignada</div>
      </td>`;
    } else {
      const pa=f.existente?.pagosActuales||[];
      const cuotas=pa.filter(p=>/cuota/i.test(p.concepto));
      const matric=pa.some(p=>/matr/i.test(p.concepto));
      const totalGs=pa.reduce((s,p)=>s+(p.monto||0),0);
      const carNom=f.existente?.carrera_nombre;
      const cursoStr=carNom?`${carNom}${f.existente.curso_anio?' '+f.existente.curso_anio+'°':''}`:null;
      const pagoStr=[matric?'✓ Matrícula':'',cuotas.length>0?cuotas.length+' cuota'+(cuotas.length>1?'s':''):'Sin cuotas'].filter(Boolean).join(' · ');
      colSistema=`<td style="padding:8px 10px;min-width:160px">
        <div style="font-size:12px;font-weight:700;color:${cursoStr?'#7c3aed':'#94a3b8'}">${cursoStr||'Sin asignar'}</div>
        <div style="font-size:10px;color:#64748b;margin-top:2px">${pagoStr}${totalGs>0?' · Gs.'+totalGs.toLocaleString():''}</div>
      </td>`;
    }

    // ── Columna 4: Decisión de carrera
    let colDecision='';
    if(f.esNuevo){
      colDecision=`<td style="padding:8px 10px;font-size:10px;color:#94a3b8;text-align:center">—</td>`;
    } else if(f.existente?.carrera_nombre){
      const carNom=f.existente.carrera_nombre+(f.existente.curso_anio?' '+f.existente.curso_anio+'°':'');
      colDecision=`<td style="padding:8px 10px;min-width:170px">
        <select id="dec_${i}" style="width:100%;font-size:11px;padding:4px 7px;border:1px solid #e2e8f0;border-radius:6px;background:#fff;color:#1e293b">
          <option value="mantener" selected>📚 Mantener en ${carNom}</option>
          <option value="sin_asignar">📌 Pasar a sin asignar</option>
        </select>
      </td>`;
    } else {
      colDecision=`<td style="padding:8px 10px;font-size:10px;color:#94a3b8;text-align:center">Ya sin asignar</td>`;
    }

    const bg=f.esNuevo?(i%2===0?'#fff':'#f8fafc'):'#fffbf5';
    return `<tr style="background:${bg};border-bottom:1px solid #f1f5f9">${colAlumno}${colPlani}${colSistema}${colDecision}</tr>`;
  }).join('');

  const aviso=existentes>0?`<div style="background:#fff7ed;border:1px solid #fed7aa;border-radius:7px;padding:9px 14px;font-size:11px;color:#92400e;margin-bottom:10px;display:flex;align-items:flex-start;gap:8px">
    <span style="font-size:16px;flex-shrink:0">⚠️</span>
    <span><strong>${existentes} alumno${existentes>1?'s':''} ya registrado${existentes>1?'s':''}</strong> en el sistema. Solo se agregarán los pagos que aún no tengan cargados (sin duplicar).${conCarrera>0?' Para los <strong>'+conCarrera+' con carrera asignada</strong>, elegí si mantenerlos en su carrera o pasarlos a "sin asignar".':''}</span>
  </div>`:'';

  modal(`<div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:10px;flex-wrap:wrap;gap:6px">
    <h4 style="margin:0">📋 Verificación antes de importar — ${filas.length} alumnos</h4>
    <div style="display:flex;gap:6px;flex-wrap:wrap">
      ${nuevos>0?`<span style="background:#dbeafe;color:#1e40af;font-size:11px;padding:3px 10px;border-radius:5px;font-weight:600">🆕 ${nuevos} nuevos</span>`:''}
      ${existentes>0?`<span style="background:#fff7ed;color:#c2410c;font-size:11px;padding:3px 10px;border-radius:5px;font-weight:600">⚠ ${existentes} ya existen</span>`:''}
    </div>
  </div>
  ${aviso}
  <div style="overflow:auto;max-height:380px;border:1px solid #e2e8f0;border-radius:8px;margin-bottom:12px">
    <table style="border-collapse:collapse;width:100%">
      <thead style="background:#f1f5f9;position:sticky;top:0;z-index:2">
        <tr>
          <th style="padding:8px 10px;text-align:left;font-size:11px;color:#475569">Alumno</th>
          <th style="padding:8px 10px;text-align:left;font-size:11px;color:#475569">Pagos en planilla</th>
          <th style="padding:8px 10px;text-align:left;font-size:11px;color:#475569">Estado en sistema</th>
          <th style="padding:8px 10px;text-align:left;font-size:11px;color:#475569">Decisión carrera</th>
        </tr>
      </thead>
      <tbody>${rows}</tbody>
    </table>
  </div>
  <div style="display:flex;justify-content:space-between;align-items:center;gap:8px">
    <button class="bs" onclick="mImportarSinAsignar()">← Volver</button>
    <button class="bn" onclick="ejecutarImportSinAsignar()">✅ Confirmar e importar (${filas.length})</button>
  </div>`,true);
}

async function ejecutarImportSinAsignar(){
  const archivo=W._fileSinAsignar||document.getElementById('archSinAsignar')?.files[0];
  if(!archivo)return alert('No hay archivo seleccionado');
  const filas=W._prevSinAsignarFilas||[];
  // Recopilar decisiones de carrera para alumnos existentes con carrera
  const decisiones={};
  filas.forEach((f,i)=>{
    if(!f.esNuevo){
      const sel=document.getElementById('dec_'+i);
      if(sel) decisiones[f.ci]=sel.value;
    }
  });
  const fd=new FormData();
  fd.append('archivo',archivo);
  if(Object.keys(decisiones).length) fd.append('decisiones',JSON.stringify(decisiones));
  try{
    toast('Importando…','info',3000);
    const r=await api('POST','/api/pagos/importar-sin-asignar',fd,true);
    cm();
    W._fileSinAsignar=null; W._prevSinAsignarFilas=null;
    const sinAsignarCount=filas.filter((f,i)=>!f.esNuevo&&document.getElementById('dec_'+i)?.value==='sin_asignar').length;
    let msg=`✓ ${r.ok} pagos importados`;
    if(r.alumnos_creados) msg+=`\n👤 ${r.alumnos_creados} alumnos nuevos registrados`;
    if(sinAsignarCount) msg+=`\n📌 ${sinAsignarCount} alumno${sinAsignarCount>1?'s':''} pasado${sinAsignarCount>1?'s':''} a sin asignar`;
    if(r.errores?.length) msg+=`\n⚠ ${r.errores.length} errores: ${r.errores.slice(0,5).join('\n')}`;
    alert(msg);
    go('pagos');
  }catch(e){toast('Error: '+e.message,'err');}
}

  const fd=new FormData();

}

const CONCEPTOS_OPTS=['Matrícula','Cuota 1','Cuota 2','Cuota 3','Cuota 4','Cuota 5','Cuota 6','Cuota 7','Cuota 8','Cuota 9','Cuota 10','Cuota 11','Cuota 12'];

function mostrarRevisionPlanilla(data){
  W._prevData=data;
  document.getElementById('pvOverlay')?.remove();

  const nuevos=data.filas.filter(f=>!f.alumno_existente).length;
  const totalConMonto=data.filas.reduce((s,f)=>s+(f.montos.some(m=>m>0)?1:0),0);
  const conPagosOtraCarrera=data.filas.filter(f=>f.alumno_existente&&f.tiene_pagos&&f.carrera_anterior).length;
  const aReasignar=data.filas.filter(f=>f.alumno_existente&&!f.tiene_pagos&&f.carrera_anterior).length;

  const colOpts=CONCEPTOS_OPTS.map(o=>`<option value="${o}">${o}</option>`).join('');
  const colHeaders=data.conceptos.map((c,j)=>`
    <th style="min-width:115px;padding:4px 6px;background:#1565c0;color:#fff;position:sticky;top:0;z-index:2;font-weight:normal">
      <div style="font-size:10px;color:#90caf9;margin-bottom:2px">${data.columnas[j]||''}</div>
      <select id="pvh_${j}" style="width:100%;font-size:11px;background:#1976d2;color:#fff;border:1px solid #42a5f5;border-radius:3px;padding:2px 2px">
        ${colOpts}
      </select>
    </th>`).join('');

  // Nombre de la carrera destino del import (para el selector)
  const carrDestNombre=(()=>{const c=(W._carrs||[]).find(x=>x.id===data.carrera_id);return c?c.nombre:'Carrera importada';})();

  const rows=data.filas.map((f,i)=>{
    const tieneConflicto=f.alumno_existente&&f.carrera_anterior;
    let badge;
    if(f.alumno_existente){
      if(f.carrera_anterior){
        badge=`<span style="font-size:10px;color:#92400e;background:#fffbeb;border:1px solid #fde68a;border-radius:3px;padding:1px 5px;margin-right:4px">⚠️ ${f.carrera_anterior.nombre}</span>`;
      } else {
        badge='<span style="font-size:10px;color:#2e7d32;background:#e8f5e9;border-radius:3px;padding:1px 4px;margin-right:4px">✓</span>';
      }
    } else {
      badge='<span style="font-size:10px;color:#e65100;background:#fff3e0;border-radius:3px;padding:1px 4px;margin-right:4px">🆕</span>';
    }
    const cells=f.montos.map((m,j)=>`
      <td style="padding:2px 4px;border:1px solid #e0e0e0;background:#fff;text-align:right">
        <input id="pv_${i}_${j}" type="number" min="0" step="1" value="${m||''}"
          style="width:95px;text-align:right;font-size:12px;border:1px solid #ccc;border-radius:3px;padding:2px 4px;font-family:inherit"/>
      </td>`).join('');
    const rowBg=tieneConflicto?'#fffdf0':(i%2===0?'#fff':'#fafafa');
    // Celda de asignación: selector solo para alumnos con conflicto
    const defaultChoice=f.tiene_pagos?'mantener':'mover';
    const matchBadge=f.match_tipo==='ci_nombre'
      ?`<div style="font-size:9px;color:#166534;background:#dcfce7;border:1px solid #86efac;border-radius:3px;padding:1px 5px;margin-bottom:3px;display:inline-block;font-weight:700">🔢👤 Coincide por cédula y nombre</div>`
      :f.match_tipo==='ci'
      ?`<div style="font-size:9px;color:#1e40af;background:#dbeafe;border-radius:3px;padding:1px 5px;margin-bottom:3px;display:inline-block">🔢 Coincide por cédula</div>`
      :`<div style="font-size:9px;color:#6d28d9;background:#ede9fe;border-radius:3px;padding:1px 5px;margin-bottom:3px;display:inline-block">👤 Coincide por nombre completo</div>`;
    const nombreSistBadge=f.nombre_sistema?`<div style="font-size:9px;color:#475569;margin-bottom:2px">En sistema: <strong>${f.nombre_sistema}</strong></div>`:'';
    const asigCell=tieneConflicto
      ?`<td style="padding:4px 8px;border:1px solid #e0e0e0;background:#fffdf0;min-width:210px">
          ${matchBadge}
          ${nombreSistBadge}
          ${f.tiene_pagos?'<div style="font-size:9px;color:#92400e;margin-bottom:2px">⚠️ Tiene pagos previos</div>':''}
          <select id="pvchoice_${i}" style="width:100%;font-size:11px;border:1px solid #fbbf24;border-radius:4px;padding:3px 4px;background:#fff">
            <option value="mantener" ${defaultChoice==='mantener'?'selected':''}>↩ Mantener en ${f.carrera_anterior.nombre}</option>
            <option value="mover" ${defaultChoice==='mover'?'selected':''}>↗ Mover a ${carrDestNombre}</option>
          </select>
        </td>`
      :`<td style="padding:4px 8px;border:1px solid #e0e0e0;text-align:center;font-size:11px;color:#94a3b8">${f.alumno_existente?'Sin conflicto':'—'}</td>`;
    return `<tr style="background:${rowBg}">
      <td style="padding:5px 10px;border:1px solid #e0e0e0;position:sticky;left:0;background:${rowBg};z-index:1;min-width:200px;white-space:nowrap">
        ${badge}<strong style="font-size:12px">${f.nombreCompleto||(f.nombre+' '+f.apellido).trim()}</strong>
      </td>
      <td style="padding:5px 8px;border:1px solid #e0e0e0;font-size:11px;color:#777;font-family:monospace;white-space:nowrap">${f.ci}</td>
      ${asigCell}
      ${cells}
    </tr>`;
  }).join('');

  const el=document.createElement('div');
  el.id='pvOverlay';
  el.style.cssText='position:fixed;inset:0;background:#fff;z-index:9998;display:flex;flex-direction:column;overflow:hidden';
  el.innerHTML=`
    <div style="background:#1565c0;color:#fff;padding:10px 20px;display:flex;align-items:center;gap:16px;flex-shrink:0;box-shadow:0 2px 8px rgba(0,0,0,.3)">
      <div style="flex:1">
        <h3 style="margin:0;font-size:15px">📋 Revisión de Importación — Verificá antes de confirmar</h3>
        <p style="margin:3px 0 0;font-size:11px;opacity:.85">${data.filas.length} alumnos · <strong>${nuevos}</strong> nuevos a crear · ${totalConMonto} con pagos · Editá montos o conceptos si hay errores</p>
      </div>
      <button onclick="cerrarRevisionPlanilla()" style="background:rgba(255,255,255,.15);border:1px solid rgba(255,255,255,.4);color:#fff;padding:6px 14px;border-radius:4px;cursor:pointer;font-size:13px">✕ Cancelar</button>
    </div>
    ${(conPagosOtraCarrera+aReasignar)>0?`<div style="background:#fff8f0;padding:7px 20px;font-size:12px;color:#92400e;flex-shrink:0;border-bottom:1px solid #fde68a;display:flex;align-items:center;gap:8px">
      <span style="font-size:15px">⚠️</span>
      <span><strong>${conPagosOtraCarrera+aReasignar} alumno${(conPagosOtraCarrera+aReasignar)>1?'s':''} con conflicto de carrera</strong> — usá la columna <strong>Asignación</strong> para elegir si mantenerlos en su carrera actual o moverlos a la importada.</span>
    </div>`:''}
    <div style="background:#e3f2fd;padding:7px 20px;font-size:12px;color:#1565c0;flex-shrink:0;border-bottom:1px solid #bbdefb">
      <strong>⚠ Revisá el encabezado de cada columna:</strong> el selector muestra el concepto detectado. Si el mes está incorrecto, cambialo antes de confirmar. Los campos en <strong>0 o vacíos</strong> no se registran.
    </div>
    <div style="flex:1;overflow:auto;padding:12px 20px">
      <table style="border-collapse:collapse;font-size:13px">
        <thead>
          <tr>
            <th style="padding:8px 10px;text-align:left;background:#1565c0;color:#fff;position:sticky;top:0;left:0;z-index:3;min-width:200px">Alumno</th>
            <th style="padding:8px 10px;text-align:left;background:#1565c0;color:#fff;position:sticky;top:0;z-index:2;min-width:100px">C.I.</th>
            <th style="padding:8px 10px;text-align:left;background:#e65100;color:#fff;position:sticky;top:0;z-index:2;min-width:190px">Asignación</th>
            ${colHeaders}
          </tr>
        </thead>
        <tbody>${rows||'<tr><td colspan="20" style="text-align:center;padding:20px;color:#999">Sin filas válidas</td></tr>'}</tbody>
      </table>
    </div>
    <div id="pvFooter" style="background:#f5f5f5;border-top:2px solid #1565c0;padding:10px 20px;display:flex;justify-content:space-between;align-items:center;flex-shrink:0">
      <span style="font-size:12px;color:#555">Revisá todos los datos antes de confirmar. Esta acción creará alumnos y registrará pagos.</span>
      <div style="display:flex;gap:10px">
        <button onclick="cerrarRevisionPlanilla()" style="padding:8px 20px;border:1px solid #bbb;background:#fff;border-radius:4px;cursor:pointer;font-size:13px">Cancelar</button>
        <button id="pvConfBtn" onclick="confirmarImportacionPlanilla()" style="padding:8px 24px;background:#1b5e20;color:#fff;border:none;border-radius:4px;cursor:pointer;font-size:13px;font-weight:600">✓ Confirmar e Importar</button>
      </div>
    </div>`;
  document.body.appendChild(el);

  // Pre-seleccionar conceptos en los selects luego de insertar en DOM
  data.conceptos.forEach((c,j)=>{
    const sel=document.getElementById('pvh_'+j);
    if(!sel)return;
    // Añadir opción custom si no está en la lista
    if(!CONCEPTOS_OPTS.includes(c)){
      const opt=document.createElement('option');opt.value=c;opt.textContent=c;
      sel.appendChild(opt);
    }
    sel.value=c;
  });
}

function cerrarRevisionPlanilla(){
  document.getElementById('pvOverlay')?.remove();
  W._prevData=null;
}

async function confirmarImportacionPlanilla(){
  const data=W._prevData;
  if(!data){toast('Sin datos para importar','warn');return;}
  const btn=document.getElementById('pvConfBtn');
  if(btn){btn.disabled=true;btn.textContent='⏳ Importando...';}

  // Leer conceptos editados
  const conceptos=data.conceptos.map((c,j)=>{
    const sel=document.getElementById('pvh_'+j);
    return sel?sel.value:c;
  });
  // Leer montos editados y elección de asignación por fila
  const filas=data.filas.map((f,i)=>{
    const montos=f.montos.map((_,j)=>{
      const inp=document.getElementById('pv_'+i+'_'+j);
      return inp?(parseFloat(inp.value)||0):0;
    });
    // Si el alumno tiene conflicto de carrera, leer la elección del selector
    const choiceSel=document.getElementById('pvchoice_'+i);
    const reasignar=choiceSel?choiceSel.value==='mover':(!f.alumno_existente||!f.carrera_anterior);
    return {...f, montos, reasignar};
  });

  const payload={carrera_id:data.carrera_id,curso_id:data.curso_id,conceptos,filas};
  try{
    const r=await api('POST','/api/pagos/importar-planilla-confirmada',payload);
    cerrarRevisionPlanilla();
    let credHtml='';
    if(r.credenciales?.length){
      credHtml=`<div style="margin-top:10px;background:#e8f5e9;border:1px solid #a5d6a7;border-radius:8px;padding:10px 12px">
        <p style="font-weight:700;font-size:12px;color:#2e7d32;margin-bottom:6px">🔑 Credenciales creadas (contraseña = N° de cédula):</p>
        <div style="max-height:200px;overflow-y:auto;font-size:11px">
          <table style="width:100%;border-collapse:collapse">
            <tr style="background:#c8e6c9;font-weight:700"><td style="padding:3px 6px">Alumno</td><td style="padding:3px 6px">Usuario</td><td style="padding:3px 6px">Contraseña</td></tr>
            ${r.credenciales.map(c=>`<tr><td style="padding:3px 6px">${c.nombre}</td><td style="padding:3px 6px;font-family:monospace">${c.usuario}</td><td style="padding:3px 6px;font-family:monospace">${c.password}</td></tr>`).join('')}
          </table>
        </div>
      </div>`;
    }
    modal(`<h4>✓ Importación completada</h4>
      <div class="ir ok">
        ✓ <strong>${r.ok}</strong> pagos registrados
        ${r.alumnos_creados>0?`<br>👤 <strong>${r.alumnos_creados}</strong> alumnos creados con acceso`:''}
        ${r.alumnos_actualizados>0?`<br>🔄 ${r.alumnos_actualizados} alumnos actualizados`:''}
        ${r.errores?.length?`<br><span style="color:var(--red)">⚠ ${r.errores.length} errores: ${r.errores.slice(0,2).join(', ')}</span>`:''}
      </div>${credHtml}
      <div class="mf"><button class="bs" onclick="cm()">Cerrar</button><button class="bn" onclick="cm();go('pagos')">Ver pagos</button></div>`);
    go('pagos');
  }catch(e){
    if(btn){btn.disabled=false;btn.textContent='✓ Confirmar e Importar';}
    toast('Error al importar: '+e.message,'err');
  }
}
function procesarConflictoPago(){
  const c=W._conflictosPago[W._conflictoIdx];
  if(!c){alert(`✓ Importación completa. ${W._conflictosOk} pagos procesados.`);go('pagos');return;}
  modal(`<h4>⚠ Conflicto de pago detectado</h4>
  <p style="margin-bottom:12px;font-size:13px">Se encontró una coincidencia para:</p>
  <div style="background:#fff8e1;border:1px solid #ffe082;border-radius:8px;padding:12px;margin-bottom:14px">
    <p style="font-weight:700">${c.nombre}</p>
    <p style="font-size:13px;color:var(--t2)">CI: ${c.ci} · Carrera: ${c.carrera}</p>
    <p style="font-size:13px;color:var(--t2)">Concepto: ${c.concepto} · Monto: Gs. ${Number(c.monto).toLocaleString()} · Fecha: ${c.fecha}</p>
  </div>
  <p style="font-size:13px">¿Desea reemplazar los datos actuales de este pago?</p>
  <div class="mf">
    <button class="bs" onclick="saltarConflicto()">Omitir</button>
    <button class="bn" onclick="confirmarReemplazo('${c.pago_id}','${c.concepto}',${c.monto},'${c.fecha}')">Reemplazar</button>
  </div>`);
}
async function confirmarReemplazo(pagoId,concepto,monto,fecha){
  try{
    await api('PUT','/api/pagos/'+pagoId+'/reemplazar',{concepto,monto,fecha_pago:fecha,medio_pago:'Transferencia'});
    W._conflictosOk++;
  }catch(e){console.error(e);}
  cm();
  W._conflictoIdx++;
  procesarConflictoPago();
}
function saltarConflicto(){cm();W._conflictoIdx++;procesarConflictoPago();}

function mArancel(a){

  modal(`<h4>${e?'Editar':'Nuevo'} arancel</h4><div class="fg">
    <div class="f"><label>Concepto <span style="color:var(--red)">*</span></label><input id="arCon" value="${e?a.concepto:''}" placeholder="Ej: Examen Final Ordinario"/></div>

        <option value="cuota" ${e&&a.tipo==='cuota'?'selected':''}>Cuota</option>
        <option value="parcial" ${e&&a.tipo==='parcial'?'selected':''}>Examen Parcial</option>
        <option value="final" ${e&&a.tipo==='final'?'selected':''}>Examen Final</option>
        <option value="extraordinario" ${e&&a.tipo==='extraordinario'?'selected':''}>Extraordinario</option>
        <option value="certificado" ${e&&a.tipo==='certificado'?'selected':''}>Certificado</option>
        <option value="otro" ${e&&a.tipo==='otro'?'selected':''}>Otro</option>
      </select></div>
      <div class="f"><label>Monto (Gs.) <span style="color:var(--red)">*</span></label><input id="arMon" type="number" value="${e?a.monto:0}"/></div>
    </div>
    <div class="f"><label>Carrera (dejar vacío para todas)</label><select id="arCarr">
      <option value="">Todas las carreras</option>
      ${carrs.map(c=>`<option value="${c.id}" ${e&&a.carrera_id===c.id?'selected':''}>${c.nombre}</option>`).join('')}
    </select></div>
    <div class="f"><label>Año de cursado (dejar vacío para todos)</label><select id="arAnio">
      <option value="">Todos los años</option>
      <option value="1" ${e&&a.anio===1?'selected':''}>1° año</option>
      <option value="2" ${e&&a.anio===2?'selected':''}>2° año</option>
      <option value="3" ${e&&a.anio===3?'selected':''}>3° año</option>
    </select></div>
    <div class="f"><label>Descripción</label><input id="arDesc" value="${e?a.descripcion||'':''}" placeholder="Opcional"/></div>

async function svArancel(id){
  const anioVal=v('arAnio');
  const o={concepto:v('arCon'),tipo:v('arTip'),monto:parseFloat(v('arMon'))||0,carrera_id:v('arCarr')||null,anio:anioVal?parseInt(anioVal):null,descripcion:v('arDesc')||null,activo:1};
  if(!o.concepto)return alert('El concepto es obligatorio');
  if(!o.monto||o.monto<=0)return alert('Ingresá un monto válido mayor a 0');
  try{
    id ? await api('PUT','/api/aranceles/'+id,o) : await api('POST','/api/aranceles',o);
    cm();
    toast(`✓ Arancel ${id?'actualizado':'creado'} correctamente`,'ok',3000);
    go('aranceles');
  }catch(e){toast('Error al guardar: '+e.message,'err');}
}
async function delArancel(id){
  if(!confirm('¿Eliminar este arancel?'))return;
  await api('DELETE','/api/aranceles/'+id);go('aranceles');
}

async function cargarHonorarios(){
  const docId=v('filtHonDoc'), mes=v('filtHonMes'), anio=v('filtHonAnio');
  if(!mes||!anio){toast('Seleccioná mes y año','warn');return;}
  const el=document.getElementById('panelHon');
  if(!el)return;
  el.innerHTML=skeletonTable(5,6);
  try{
    let url=`/api/honorarios/resumen?mes=${mes}&anio=${anio}`;
    if(docId)url+=`&docente_id=${docId}`;
    else{
      // Vista general: todos los docentes
      const hons=await api('GET',`/api/honorarios?mes=${mes}&anio=${anio}`);
      renderHonorariosGeneral(el,hons,mes,anio);

    W._honResumen=r;
    renderHonorariosDocente(el,r);

async function cargarMisHon(){
  const mes=v('mhMes'), anio=v('mhAnio');
  const el=document.getElementById('panelMisHon');
  if(!el)return;
  const docenteId=me.rol==='director'?v('mhDocente'):me.docenteId;
  if(!docenteId){
    el.innerHTML='<div class="es">Seleccioná un docente para ver sus honorarios</div>';
    return;
  }
  el.innerHTML=skeletonTable(6,8);
  try{
    const r=await api('GET',`/api/honorarios/resumen?mes=${mes}&anio=${anio}&docente_id=${docenteId}`);
    W._honResumen=r;
    const diasN={0:'Domingo',1:'Lunes',2:'Martes',3:'Miércoles',4:'Jueves',5:'Viernes',6:'Sábado'};
    // Construir mapa honorario por fecha
    const honMap={};
    (r.honorarios||[]).forEach(h=>{
      const k=h.fecha+(h.asignacion_id||'');
      if(!honMap[h.fecha])honMap[h.fecha]=[];
      honMap[h.fecha].push(h);
    });
    // Mapa de reemplazos del mes
    const repMap={};
    (r.reemplazos||[]).forEach(rep=>{
      if(!repMap[rep.fecha])repMap[rep.fecha]=[];
      repMap[rep.fecha].push(rep);
    });
    // Solo mostrar fechas en que el docente TENÍA que dar clases
    const miDocId=r.docente?.id||me.docenteId;
    const asigs=r.asignaciones||[];
    const diasNum={Lunes:1,Martes:2,'Miércoles':3,Jueves:4,Viernes:5};
    // Generar todas las fechas del mes que corresponden a días de clase del docente
    const desde=new Date(r.desde+'T12:00:00');
    const hasta=new Date(r.hasta+'T12:00:00');
    const fechasClase=[];
    const cur=new Date(desde);
    while(cur<=hasta){
      const numDia=cur.getDay();
      const fechaStr=cur.toISOString().split('T')[0];
      // Ver si hay alguna asignación del docente en ese día
      const asigsDia=asigs.filter(a=>{
        const dNum=diasNum[a.dia||a.dia_semana]||0;
        return dNum===numDia;
      });
      if(asigsDia.length>0) fechasClase.push({fecha:fechaStr,dia:diasN[numDia],asigs:asigsDia});
      cur.setDate(cur.getDate()+1);
    }
    const totalClases=fechasClase.reduce((s,f)=>s+f.asigs.length,0);
    const clasesDadas=(r.honorarios||[]).filter(h=>h.tipo==='clase').length;
    const reemplazosRealizados=(r.honorarios||[]).filter(h=>h.tipo==='reemplazo').length;
    const totalGanado=r.totalGanado||0;
    // Materias únicas para filtro
    const materiasUnicas=[...new Set(asigs.map(a=>a.materia_nombre).filter(Boolean))].sort();
    W._honFechasClase=fechasClase; W._honMaps={honMap,repMap}; W._honR=r; W._honDocId=miDocId;

    // Resumen por materia
    const resMateria={};
    fechasClase.forEach(fc=>fc.asigs.forEach(asig=>{
      const k=asig.materia_nombre||'—';
      if(!resMateria[k])resMateria[k]={clases:0,dictadas:0,monto:0,turno:asig.turno};
      resMateria[k].clases++;
      const hons=honMap[fc.fecha]||[];
      const h=hons.find(x=>x.asignacion_id===asig.id);

function filtRepAsigs(){
  const carr=v('repFiltCarr'),anio=v('repFiltAnio'),turno=v('repFiltTurno');
  let asigs=W._misAsigsRep||[];
  if(carr) asigs=asigs.filter(a=>a.carrera_nombre===carr);
  if(anio) asigs=asigs.filter(a=>String(a.curso_anio)===anio);
  if(turno) asigs=asigs.filter(a=>String(a.turno||1)===turno);
  const sel=document.getElementById('repAsig');
  if(!sel)return;
  sel.innerHTML='<option value="">— Seleccionar —</option>'+asigs.map(a=>`<option value="${a.id}" data-dia="${a.dia||''}" data-turno="${a.turno||1}">${a.materia_nombre} — ${a.carrera_nombre} ${a.curso_anio}° Secc.${a.curso_division||''} (${a.dia||'Sin día'} T${a.turno||1})</option>`).join('');
}
function calcFechasHabilitadas(){
  const opt=document.getElementById('repAsig')?.selectedOptions[0];
  const dia=opt?.dataset?.dia||'';
  const fecInput=document.getElementById('repFec');
  const msg=document.getElementById('repFecMsg');
  if(!dia||!fecInput)return;
  const diasNum={Lunes:1,Martes:2,'Miércoles':3,Jueves:4,Viernes:5};
  const numDia=diasNum[dia]||0;
  const hoy=new Date();
  let fecha=new Date(hoy);
  for(let i=0;i<14;i++){if(fecha.getDay()===numDia)break;fecha.setDate(fecha.getDate()+1);}
  fecInput.value=fecha.toISOString().split('T')[0];
  fecInput.min=hoy.toISOString().split('T')[0];
  const diffH=(fecha-hoy)/3600000;
  if(msg){
    msg.textContent=diffH<=24?`✓ Habilitado — clase el ${dia} (dentro de 24 hs)`:`Clase los ${dia}. Fecha sugerida: ${fecha.toISOString().split('T')[0]}`;
    msg.style.color=diffH<=24?'#2e7d32':'#e65100';
  }
}
function validarFechaReemplazo(){
  const opt=document.getElementById('repAsig')?.selectedOptions[0];
  const dia=opt?.dataset?.dia||'';
  if(!dia)return;
  const diasNum={Lunes:1,Martes:2,'Miércoles':3,Jueves:4,Viernes:5};
  const fecInput=document.getElementById('repFec');
  const msg=document.getElementById('repFecMsg');
  if(!fecInput?.value)return;
  const fechaSel=new Date(fecInput.value+'T12:00:00');
  const hoy=new Date(); hoy.setHours(0,0,0,0);
  // Bloquear fechas pasadas
  if(fechaSel<hoy){
    fecInput.value='';
    if(msg){msg.textContent='⚠ No podés pedir reemplazo de un día que ya pasó';msg.style.color='#c62828';}
    return;
  }
  if(dia&&fechaSel.getDay()!==diasNum[dia]){
    if(msg){msg.textContent=`⚠ ${fechaSel.toLocaleDateString('es',{weekday:'long'})} no es día de clase (${dia})`;msg.style.color='#c62828';}
  } else {
    if(msg){msg.textContent=`✓ Fecha válida — ${dia}`;msg.style.color='#2e7d32';}
  }
}
async function svReemplazo(){
  const asigId=v('repAsig'),repDocId=v('repDoc'),fecha=v('repFec'),motivo=v('repMot');
  if(!asigId||!repDocId||!fecha)return alert('Completar todos los campos obligatorios');
  // Bloquear fecha pasada
  const hoy=new Date(); hoy.setHours(0,0,0,0);
  const fechaSel=new Date(fecha+'T12:00:00');
  if(fechaSel<hoy)return alert('⛔ No podés registrar un reemplazo en una fecha pasada.');
  const opt=document.getElementById('repAsig')?.selectedOptions[0];
  const dia=opt?.dataset?.dia||'';
  if(dia){
    const diasNum={Lunes:1,Martes:2,'Miércoles':3,Jueves:4,Viernes:5};
    const fechaSel=new Date(fecha+'T12:00:00');
    if(fechaSel.getDay()!==diasNum[dia])
      return alert(`⚠ La fecha seleccionada no corresponde al día de clase (${dia}).`);
  }
  try{
    const asig=(W._repsData?.asigs||[]).find(a=>a.id===asigId);
    if(asig){
      const c=await api('GET',`/api/asignaciones/conflicto?docente_id=${repDocId}&dia=${encodeURIComponent(asig.dia||'')}&turno=${asig.turno||1}&exclude_id=`).catch(()=>({tiene_conflicto:false}));
      if(c?.tiene_conflicto&&!confirm(`⚠ El reemplazante ya tiene "${c.materia}" ese turno. ¿Confirmar igual? El Director decidirá.`))return;
    }
    await api('POST','/api/reemplazos',{asignacion_id:asigId,docente_reemplazante_id:repDocId,fecha,motivo});
    toast('✓ Reemplazo registrado — pendiente de aprobación del Director','ok',5000);
    cm();go('reemplazos');
  }catch(e){toast('Error: '+e.message,'err');}
}
async function aprobarReemplazo(id,accion){
  const msg=accion==='aprobar'?'¿Aprobar este reemplazo? Se acreditarán Gs. 80.000 al docente reemplazante.':'¿Rechazar este reemplazo?';
  if(!confirm(msg))return;
  try{
    await api('PUT','/api/reemplazos/'+id+'/aprobar',{accion});
    toast(accion==='aprobar'?'✓ Reemplazo aprobado y honorario acreditado':'Reemplazo rechazado',accion==='aprobar'?'ok':'warn');
    go('reemplazos');
  }catch(e){toast('Error: '+e.message,'err');}
}
