<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1"/>
<title>Formulario — ITS Santísima Trinidad</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:'Inter',-apple-system,'Segoe UI',sans-serif;background:#f0f2f7;min-height:100vh;color:#1a1f2e;-webkit-font-smoothing:antialiased}
.wrap{max-width:580px;margin:0 auto;padding:20px 14px 48px}

/* header */
.header{background:linear-gradient(150deg,#1a6b3a 0%,#166534 50%,#14532d 100%);color:#fff;border-radius:20px;padding:26px 22px 22px;margin-bottom:16px;position:relative;overflow:hidden;box-shadow:0 8px 28px rgba(22,101,52,.30)}
.header::before{content:'';position:absolute;top:-50px;right:-50px;width:180px;height:180px;border-radius:50%;background:rgba(255,255,255,.07);pointer-events:none}
.header::after{content:'';position:absolute;bottom:-40px;left:-20px;width:130px;height:130px;border-radius:50%;background:rgba(255,255,255,.05);pointer-events:none}
.header-inner{position:relative;z-index:1;display:flex;align-items:center;gap:14px}
.header-logo{width:52px;height:52px;background:rgba(255,255,255,.18);border-radius:14px;display:flex;align-items:center;justify-content:center;font-size:26px;flex-shrink:0;border:1.5px solid rgba(255,255,255,.25)}
.header-text h1{font-size:16px;font-weight:800;letter-spacing:-.2px;margin-bottom:2px}
.header-text p{font-size:12px;opacity:.8;font-weight:500}
.form-title-card{background:#fff;border-radius:16px;padding:20px;box-shadow:0 1px 6px rgba(0,0,0,.07);margin-bottom:12px;border:1px solid #e5e7ef}
.form-title-card h2{font-size:18px;font-weight:800;color:#1a1f2e;letter-spacing:-.02em;margin-bottom:6px}
.form-title-card p{font-size:13px;color:#6b7280;line-height:1.6}

/* progress bar */
.progress-bar{height:3px;background:#e5e7ef;border-radius:3px;margin-bottom:16px;overflow:hidden}
.progress-fill{height:100%;background:linear-gradient(90deg,#1f8246,#166534);border-radius:3px;transition:width .4s ease}

/* pregunta card */
.pregunta-card{background:#fff;border-radius:16px;padding:20px;box-shadow:0 1px 6px rgba(0,0,0,.07);margin-bottom:10px;border:1px solid #e5e7ef;transition:box-shadow .15s,border-color .15s}
.pregunta-card.focused{border-color:#166534;box-shadow:0 0 0 3px rgba(22,101,52,.08)}
.pregunta-num{font-size:10px;font-weight:800;color:#9ca3af;letter-spacing:.1em;text-transform:uppercase;margin-bottom:6px}
label.pregunta-label{font-size:14px;font-weight:700;color:#1a1f2e;margin-bottom:12px;display:block;line-height:1.5}
.req{color:#dc2626;margin-left:2px}

/* text input */
textarea.resp-input,input[type=text].resp-input{width:100%;padding:11px 14px;border:1.5px solid #e5e7ef;border-radius:10px;font-size:14px;outline:none;transition:border .18s,box-shadow .18s;background:#fafafa;color:#1a1f2e;font-family:inherit;resize:vertical;min-height:60px}
textarea.resp-input:focus,input[type=text].resp-input:focus{border-color:#166534;background:#fff;box-shadow:0 0 0 3px rgba(22,101,52,.1)}

/* opciones */
.opciones{display:flex;flex-direction:column;gap:7px}
.opcion-item{display:flex;align-items:center;gap:10px;padding:11px 14px;border:1.5px solid #e5e7ef;border-radius:10px;cursor:pointer;transition:border .15s,background .15s,transform .1s;user-select:none}
.opcion-item:hover{border-color:#bbf7d0;background:#f0fdf4}
.opcion-item:active{transform:scale(.99)}
.opcion-item.sel{border-color:#166534;background:#f0fdf4}
.opcion-radio{width:18px;height:18px;border-radius:50%;border:2px solid #d1d5db;display:flex;align-items:center;justify-content:center;flex-shrink:0;transition:border .15s,background .15s}
.opcion-item.sel .opcion-radio{border-color:#166534;background:#166534}
.opcion-item.sel .opcion-radio::after{content:'';width:6px;height:6px;border-radius:50%;background:#fff}
.opcion-item span{font-size:14px;color:#374151}
.opcion-item.sel span{color:#166534;font-weight:600}

/* submit */
.submit-card{background:#fff;border-radius:16px;padding:18px;box-shadow:0 1px 6px rgba(0,0,0,.07);margin-top:4px;border:1px solid #e5e7ef}
.btn-enviar{width:100%;padding:14px;border:none;border-radius:12px;font-size:15px;font-weight:800;cursor:pointer;background:linear-gradient(110deg,#1f8246 0%,#166534 100%);color:#fff;box-shadow:0 4px 14px rgba(22,101,52,.30);transition:all .15s;display:flex;align-items:center;justify-content:center;gap:8px;font-family:inherit}
.btn-enviar:hover:not(:disabled){transform:translateY(-1px);box-shadow:0 6px 20px rgba(22,101,52,.35)}
.btn-enviar:active:not(:disabled){transform:scale(.99)}
.btn-enviar:disabled{opacity:.6;cursor:not-allowed;transform:none}

.alert-err{background:#fee2e2;color:#991b1b;border:1.5px solid #fecaca;border-radius:10px;padding:11px 14px;font-size:13px;margin-bottom:12px;line-height:1.5}
.loading{display:flex;align-items:center;justify-content:center;gap:10px;padding:40px;color:#9ca3af;font-size:14px}
.spinner{width:22px;height:22px;border:2.5px solid #e5e7ef;border-top-color:#166534;border-radius:50%;animation:spin .7s linear infinite;flex-shrink:0}
@keyframes spin{to{transform:rotate(360deg)}}

/* success */
.success-screen{text-align:center;padding:32px 16px}
.success-icon{font-size:64px;margin-bottom:14px;animation:pop .4s ease}
@keyframes pop{0%{transform:scale(.5)}80%{transform:scale(1.1)}100%{transform:scale(1)}}
.success-title{font-size:22px;font-weight:900;color:#166534;margin-bottom:8px;letter-spacing:-.02em}
.success-sub{font-size:14px;color:#6b7280;line-height:1.75}

/* inactivo */
.form-inactivo{text-align:center;padding:28px 16px}
.form-inactivo-icon{font-size:52px;margin-bottom:14px}
.form-inactivo-title{font-size:18px;font-weight:800;color:#1a1f2e;margin-bottom:6px}
.form-inactivo-sub{font-size:13px;color:#6b7280;line-height:1.6}
</style>
</head>
<body>
<div class="wrap" id="app">
  <div class="loading"><div class="spinner"></div> Cargando...</div>
</div>

<script>
const FORM_ID = location.pathname.split('/').filter(Boolean).pop();
let formData = null;
const respuestas = {};
let totalPregs = 0;

async function init() {
  try {
    const res = await fetch('/pub/formularios/'+FORM_ID);
    const data = await res.json();
    if (!res.ok) {
      document.getElementById('app').innerHTML = `<div class="form-title-card"><div class="alert-err">❌ ${data.error||'No se pudo cargar el formulario.'}</div></div>`;
      return;
    }
    formData = data;
    totalPregs = (formData.preguntas||[]).length;
    renderForm();
  } catch(e) {
    document.getElementById('app').innerHTML = `<div class="form-title-card"><div class="alert-err">❌ Error al cargar. Revisá tu conexión.</div><button onclick="init()" style="margin-top:12px;width:100%;padding:12px;border:none;border-radius:10px;background:#166534;color:#fff;font-size:14px;font-weight:700;cursor:pointer;font-family:inherit">Reintentar</button></div>`;
  }
}

function actualizarProgreso() {
  const completadas = Object.keys(respuestas).filter(k => String(respuestas[k]||'').trim()).length;
  const pct = totalPregs ? Math.round((completadas/totalPregs)*100) : 0;
  const el = document.getElementById('prog-fill');
  if (el) el.style.width = pct+'%';
}

function renderForm() {
  if (!formData.activo) {
    document.getElementById('app').innerHTML = `
      ${headerHTML()}
      <div class="form-title-card">
        <div class="form-inactivo">
          <div class="form-inactivo-icon">🔒</div>
          <div class="form-inactivo-title">Formulario cerrado</div>
          <div class="form-inactivo-sub">Este formulario no está recibiendo respuestas en este momento.</div>
        </div>
      </div>`;
    return;
  }
  document.getElementById('app').innerHTML = `
    ${headerHTML()}
    <div class="progress-bar"><div class="progress-fill" id="prog-fill" style="width:0%"></div></div>
    <div class="form-title-card">
      <h2>${formData.titulo}</h2>
      ${formData.descripcion?`<p>${formData.descripcion}</p>`:''}
    </div>
    <div id="preguntas-wrap"></div>
    <div class="submit-card">
      <div id="err-form"></div>
      <button class="btn-enviar" id="btn-enviar" onclick="enviar()">
        <svg width="16" height="16" fill="none" stroke="currentColor" stroke-width="2.5" viewBox="0 0 24 24"><path d="M22 2L11 13"/><path d="M22 2L15 22 11 13 2 9l20-7z"/></svg>
        Enviar respuestas
      </button>
    </div>`;

  const wrap = document.getElementById('preguntas-wrap');
  wrap.innerHTML = (formData.preguntas||[]).map((p, idx) => {
    if (p.tipo === 'texto') {
      return `<div class="pregunta-card" id="card-${p.id}">
        <div class="pregunta-num">Pregunta ${idx+1} de ${totalPregs}</div>
        <label class="pregunta-label">${p.texto_pregunta}${p.requerida?'<span class="req">*</span>':''}</label>
        <textarea class="resp-input" placeholder="Tu respuesta..." rows="2"
          onfocus="this.closest('.pregunta-card').classList.add('focused')"
          onblur="this.closest('.pregunta-card').classList.remove('focused')"
          oninput="respuestas['${p.id}']=this.value;actualizarProgreso()"></textarea>
      </div>`;
    }
    const opts = (p.opciones||[]).map((o, i) => `
      <div class="opcion-item" id="opt-${p.id}-${i}" onclick="seleccionarOpcion('${p.id}',${i},'${o.replace(/'/g,"\\'").replace(/\\/g,'\\\\')}')">
        <div class="opcion-radio"></div>
        <span>${o}</span>
      </div>`).join('');
    return `<div class="pregunta-card" id="card-${p.id}">
      <div class="pregunta-num">Pregunta ${idx+1} de ${totalPregs}</div>
      <label class="pregunta-label">${p.texto_pregunta}${p.requerida?'<span class="req">*</span>':''}</label>
      <div class="opciones">${opts}</div>
    </div>`;
  }).join('');
}

function headerHTML() {
  return `<div class="header">
    <div class="header-inner">
      <div class="header-logo">📝</div>
      <div class="header-text">
        <h1>ITS Santísima Trinidad</h1>
        <p>Instituto Técnico Superior</p>
      </div>
    </div>
  </div>`;
}

function seleccionarOpcion(pid, idx, valor) {
  respuestas[pid] = valor;
  (formData.preguntas.find(p=>p.id===pid).opciones||[]).forEach((_,i) => {
    const el = document.getElementById('opt-'+pid+'-'+i);
    if (el) el.classList.toggle('sel', i===idx);
  });
  actualizarProgreso();
}

async function enviar() {
  const err = document.getElementById('err-form');
  const faltantes = (formData.preguntas||[]).filter(p => p.requerida && !String(respuestas[p.id]||'').trim());
  if (faltantes.length) {
    err.innerHTML = '<div class="alert-err">⚠️ Completá todas las preguntas obligatorias marcadas con *.</div>';
    faltantes[0] && document.getElementById('card-'+faltantes[0].id)?.scrollIntoView({behavior:'smooth',block:'center'});
    return;
  }
  err.innerHTML = '';
  const btn = document.getElementById('btn-enviar');
  btn.disabled = true;
  btn.innerHTML = '<div class="spinner" style="border-top-color:#fff;width:18px;height:18px"></div> Enviando...';
  try {
    const res = await fetch('/pub/formularios/'+FORM_ID+'/responder', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ respuestas })
    });
    const data = await res.json();
    if (!res.ok) {
      btn.disabled = false;
      btn.innerHTML = '<svg width="16" height="16" fill="none" stroke="currentColor" stroke-width="2.5" viewBox="0 0 24 24"><path d="M22 2L11 13"/><path d="M22 2L15 22 11 13 2 9l20-7z"/></svg> Enviar respuestas';
      err.innerHTML = `<div class="alert-err">❌ ${data.error}</div>`;
      return;
    }
    renderExito();
  } catch(e) {
    btn.disabled = false;
    btn.innerHTML = '<svg width="16" height="16" fill="none" stroke="currentColor" stroke-width="2.5" viewBox="0 0 24 24"><path d="M22 2L11 13"/><path d="M22 2L15 22 11 13 2 9l20-7z"/></svg> Enviar respuestas';
    err.innerHTML = '<div class="alert-err">❌ Error de conexión. Verificá tu internet e intentá de nuevo.</div>';
  }
}

function renderExito() {
  document.getElementById('app').innerHTML = `
    ${headerHTML()}
    <div class="form-title-card">
      <div class="success-screen">
        <div class="success-icon">✅</div>
        <div class="success-title">¡Respuesta enviada!</div>
        <div class="success-sub">Gracias por completar el formulario.<br>Tus respuestas fueron registradas correctamente.</div>
      </div>
    </div>`;
}

init();
</script>
</body>
</html>
