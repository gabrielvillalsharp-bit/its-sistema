<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1"/>
<title>Registro de Alumno — ITS</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:'Segoe UI',system-ui,sans-serif;background:#f0f4f8;min-height:100vh;color:#1a202c}
.wrap{max-width:500px;margin:0 auto;padding:16px 14px 32px}

/* Header */
.header{background:linear-gradient(160deg,#1f8246 0%,#166534 60%,#14532d 100%);color:#fff;border-radius:18px;padding:22px 20px 18px;margin-bottom:14px;text-align:center;box-shadow:0 6px 24px rgba(22,101,52,.35)}
.header-logo{width:56px;height:56px;background:rgba(255,255,255,.2);border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:28px;margin:0 auto 10px}
.header h1{font-size:18px;font-weight:800;letter-spacing:-.3px}
.header-carrera{font-size:14px;opacity:.9;margin-top:4px;font-weight:600}
.header-sub{font-size:11px;opacity:.75;margin-top:6px;background:rgba(255,255,255,.18);display:inline-block;padding:3px 12px;border-radius:20px}

/* Steps */
.step-indicator{display:flex;gap:6px;margin-bottom:16px;justify-content:center;align-items:center;padding:0 20px}
.step{flex:1;height:5px;border-radius:3px;background:#e2e8f0;transition:background .3s}
.step.active{background:#166534}
.step.done{background:#22c55e}

/* Cards */
.card{background:#fff;border-radius:16px;padding:20px;box-shadow:0 2px 12px rgba(0,0,0,.07);margin-bottom:12px}
.card h2{font-size:15px;font-weight:800;margin-bottom:14px;color:#1a202c;display:flex;align-items:center;gap:8px}

/* Inputs */
input,select{width:100%;padding:12px 14px;border:2px solid #e2e8f0;border-radius:12px;font-size:15px;outline:none;transition:border .2s;background:#fafafa;color:#1a202c}
input:focus,select:focus{border-color:#166534;background:#fff;box-shadow:0 0 0 3px rgba(22,101,52,.12)}
label{font-size:12px;font-weight:700;color:#374151;margin-bottom:5px;display:block;text-transform:uppercase;letter-spacing:.04em}
.field{margin-bottom:14px}

/* Buttons */
.btn{width:100%;padding:14px;border:none;border-radius:12px;font-size:15px;font-weight:700;cursor:pointer;transition:all .15s;display:flex;align-items:center;justify-content:center;gap:8px}
.btn:active{transform:scale(.98)}
.btn-primary{background:linear-gradient(160deg,#1f8246,#166534);color:#fff;box-shadow:0 4px 14px rgba(22,101,52,.35)}
.btn-primary:hover{box-shadow:0 6px 20px rgba(22,101,52,.45)}
.btn-secondary{background:#f1f5f9;color:#374151;margin-top:8px;font-weight:600}
.btn-secondary:hover{background:#e2e8f0}

/* Hint banner */
.hint{background:linear-gradient(135deg,#fef9c3,#fef08a);border:1.5px solid #fde047;border-radius:12px;padding:12px 14px;margin-bottom:14px;font-size:13px;color:#713f12;display:flex;align-items:flex-start;gap:10px}
.hint-icon{font-size:20px;flex-shrink:0;margin-top:-1px}

/* Curso cards */
.curso-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:4px}
.curso-card{border:2.5px solid #e2e8f0;border-radius:16px;padding:18px 12px 14px;cursor:pointer;text-align:center;transition:all .18s;background:#fff;position:relative}
.curso-card:hover,.curso-card:active{border-color:#166534;background:#f0fff4;transform:translateY(-2px);box-shadow:0 6px 18px rgba(22,101,52,.18)}
.curso-card .anio{font-size:42px;font-weight:900;color:#166534;line-height:1}
.curso-card .label{font-size:12px;color:#6b7280;margin-top:2px;font-weight:600}
.curso-card .seccion{font-size:11px;font-weight:700;background:#dcfce7;color:#166534;border-radius:6px;padding:3px 10px;display:inline-block;margin-top:8px}
.curso-card .cnt{font-size:11px;color:#9ca3af;margin-top:6px}
.curso-card-tap{position:absolute;bottom:8px;right:10px;font-size:18px;opacity:.4}

/* Alumno items */
.alumno-item{padding:14px 16px;border:2px solid #e2e8f0;border-radius:14px;cursor:pointer;transition:all .15s;margin-bottom:8px;display:flex;justify-content:space-between;align-items:center;gap:10px;background:#fff;position:relative}
.alumno-item:hover,.alumno-item:active{border-color:#166534;background:#f0fff4;transform:translateX(2px)}
.alumno-item.incompleto{border-color:#fde047;background:#fefce8}
.alumno-nombre{font-weight:800;font-size:15px;color:#1a202c}
.alumno-detalle{font-size:12px;color:#718096;margin-top:3px}
.alumno-cta{font-size:11px;color:#d97706;margin-top:4px;font-weight:700;display:flex;align-items:center;gap:4px}
.alumno-right{display:flex;flex-direction:column;align-items:flex-end;gap:6px;flex-shrink:0}
.tag{font-size:11px;padding:3px 10px;border-radius:20px;font-weight:700;white-space:nowrap}
.tag-ok{background:#dcfce7;color:#166534}
.tag-warn{background:#fef3c7;color:#92400e}
.chevron{font-size:22px;color:#166534;font-weight:700;line-height:1}

/* Alerts */
.alert{padding:12px 14px;border-radius:10px;font-size:13px;margin-bottom:12px}
.alert-err{background:#fee2e2;color:#991b1b;border:1.5px solid #fecaca}
.alert-ok{background:#dcfce7;color:#166534;border:1.5px solid #bbf7d0}

/* Empty state */
.empty{text-align:center;color:#a0aec0;font-size:13px;padding:28px 0;display:flex;flex-direction:column;align-items:center;gap:6px}
.empty-icon{font-size:32px;opacity:.4}

/* Loading */
.loading{display:flex;align-items:center;justify-content:center;gap:12px;padding:28px;color:#718096;font-size:14px}
.spinner{width:22px;height:22px;border:2.5px solid #e2e8f0;border-top-color:#2563EB;border-radius:50%;animation:spin .7s linear infinite;flex-shrink:0}
@keyframes spin{to{transform:rotate(360deg)}}

/* Back btn */
.back-btn{background:none;border:none;color:#6b7280;font-size:13px;cursor:pointer;padding:4px 0;margin-bottom:14px;display:flex;align-items:center;gap:5px;font-weight:600}
.back-btn:hover{color:#374151}

/* No encontrado — oculto hasta que hay búsqueda sin resultados */
.no-encontrado{display:none;margin-top:16px;border-top:2px dashed #fde68a;padding-top:16px;text-align:center;background:#fffbeb;border-radius:12px;padding:16px}
.no-encontrado p{font-size:13px;color:#78350f;margin-bottom:12px;font-weight:600}
/* Instrucciones pasos */
.steps-guide{display:flex;flex-direction:column;gap:10px;margin-bottom:16px}
.step-guide{display:flex;align-items:flex-start;gap:12px;padding:12px 14px;border-radius:12px;background:#f0fff4;border:1.5px solid #bbf7d0}
.step-guide.active-step{background:#fff;border:2px solid #166534;box-shadow:0 0 0 4px rgba(22,101,52,.1)}
.step-num{width:28px;height:28px;border-radius:50%;background:#166534;color:#fff;font-size:13px;font-weight:900;display:flex;align-items:center;justify-content:center;flex-shrink:0}
.step-guide.inactive .step-num{background:#e2e8f0;color:#94a3b8}
.step-guide.inactive{background:#f8fafc;border-color:#e2e8f0;opacity:.7}
.step-txt strong{display:block;font-size:13px;font-weight:800;color:#166534}
.step-guide.inactive .step-txt strong{color:#94a3b8}
.step-txt span{font-size:11px;color:#6b7280}
/* Flecha animada */
@keyframes bounce-down{0%,100%{transform:translateY(0)}50%{transform:translateY(5px)}}
.arrow-down{text-align:center;font-size:22px;animation:bounce-down .8s infinite;color:#166534;margin:-4px 0 8px}

/* Success screen */
.success-screen{text-align:center;padding:32px 16px}
.success-icon{font-size:72px;margin-bottom:14px;animation:pop .4s ease}
@keyframes pop{0%{transform:scale(.5)}80%{transform:scale(1.12)}100%{transform:scale(1)}}
.success-title{font-size:22px;font-weight:900;color:#166534;margin-bottom:10px}
.success-sub{font-size:14px;color:#4a5568;line-height:1.7}

/* Grid 2-col form */
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
@media(max-width:380px){.grid2{grid-template-columns:1fr}}
</style>
</head>
<body>
<div class="wrap" id="app">
  <div class="loading"><div class="spinner"></div> Cargando...</div>
</div>
<script>
const params = new URLSearchParams(location.search);
const carreraId = params.get('c');
let carrera = null;
let cursos = [];
let cursoSeleccionado = null;
let alumnoSeleccionado = null;
let _searchTimer = null;
let _resultados = [];

async function apiFetch(method, url, body) {
  const res = await fetch(url, {
    method,
    headers: { 'Content-Type': 'application/json' },
    body: body ? JSON.stringify(body) : undefined
  });
  const data = await res.json();
  if (!res.ok) {
    const err = new Error(data.error || 'Error de servidor');
    err.duplicate = !!data.duplicate;
    throw err;
  }
  return data;
}

async function init() {
  const app = document.getElementById('app');
  if (!carreraId) {
    app.innerHTML = `<div class="card"><div class="alert alert-err">❌ URL inválida. Escaneá el QR correcto de tu carrera.</div></div>`;
    return;
  }
  try {
    [carrera, cursos] = await Promise.all([
      apiFetch('GET', '/pub/carrera/' + carreraId),
      apiFetch('GET', '/pub/carrera/' + carreraId + '/cursos'),
    ]);
    renderStep0();
  } catch(e) {
    app.innerHTML = `<div class="card"><div class="alert alert-err">❌ ${e.message}</div></div>`;
  }
}

function renderHeader(sub) {
  return `<div class="header">
    <div class="header-logo">🎓</div>
    <h1>ITS Santísima Trinidad</h1>
    <div class="header-carrera">${carrera.nombre}</div>
    ${sub ? `<div class="header-sub">📍 ${sub}</div>` : ''}
  </div>`;
}

function renderSteps(current, total) {
  return `<div class="step-indicator">${Array.from({length:total},(_,i)=>`<div class="step ${i<current?'done':i===current?'active':''}"></div>`).join('')}</div>`;
}

function labelCurso(c) {
  const div = c.division === 'U' ? '' : ` Sección ${c.division}`;
  return `${c.anio}° año${div}`;
}

// PASO 0: Seleccionar año/sección
function renderStep0() {
  const app = document.getElementById('app');
  if (cursos.length === 0) { cursoSeleccionado = null; renderStep1(); return; }
  if (cursos.length === 1) { cursoSeleccionado = cursos[0]; renderStep1(); return; }
  app.innerHTML = renderHeader() + renderSteps(0, 3) + `
  <div class="card">
    <h2>📚 ¿A qué año y sección pertenecés?</h2>
    <div class="hint"><span class="hint-icon">👇</span><span>Tocá el cuadro que corresponde a tu año y sección</span></div>
    <div class="curso-grid">
      ${cursos.map(c => `
        <div class="curso-card" onclick="seleccionarCurso('${c.id}')">
          <div class="anio">${c.anio}</div>
          <div class="label">${c.division !== 'U' ? 'Sección ' + c.division : 'Año'}</div>
          ${c.turno ? `<div class="seccion">${c.turno}</div>` : ''}
          <div class="curso-card-tap">👆</div>
        </div>
      `).join('')}
    </div>
  </div>`;
}

function seleccionarCurso(id) {
  cursoSeleccionado = cursos.find(c => c.id === id) || null;
  renderStep1();
}

// PASO 1: Buscar nombre en toda la BD
function renderStep1() {
  const subLabel = cursoSeleccionado ? labelCurso(cursoSeleccionado) : '';
  const stepNum = cursos.length > 1 ? 1 : 0;
  const totalSteps = cursos.length > 1 ? 3 : 2;
  document.getElementById('app').innerHTML = renderHeader(subLabel) + renderSteps(stepNum, totalSteps) + `
  <div class="card">
    ${cursos.length > 1 ? `<button class="back-btn" onclick="renderStep0()">← Cambiar año/sección</button>` : ''}
    <h2>🔍 Buscá tu nombre</h2>
    <div class="hint" style="margin-bottom:14px">
      <span class="hint-icon">💡</span>
      <span>Escribí tu <strong>apellido</strong> primero para encontrarte más rápido. Si no aparecés, intentá con el nombre completo.</span>
    </div>
    <div class="field" style="margin-bottom:8px">
      <label>👉 Apellido o nombre</label>
      <input id="busqueda" type="text" placeholder="Ej: García   o   Juan García"
        autocapitalize="words" autocomplete="off" spellcheck="false"
        oninput="debounceBuscar()" style="border:2.5px solid #166534;box-shadow:0 0 0 4px rgba(22,101,52,.12);font-size:17px;padding:14px;"/>
    </div>
    <div id="busq-hint" style="font-size:12px;color:#6b7280;margin-bottom:12px;min-height:18px"></div>
    <div id="lista-resultados">
      <div class="empty"><span class="empty-icon">🔍</span><span>Escribí tu apellido para buscar</span></div>
    </div>
  </div>`;
  setTimeout(() => document.getElementById('busqueda')?.focus(), 100);
}

function debounceBuscar() {
  clearTimeout(_searchTimer);
  _searchTimer = setTimeout(buscarAlumno, 400);
}

async function buscarAlumno() {
  const q = document.getElementById('busqueda')?.value.trim() || '';
  const lista = document.getElementById('lista-resultados');
  const hint  = document.getElementById('busq-hint');
  if (!lista) return;
  if (q.length < 2) {
    lista.innerHTML = '<div class="empty"><span class="empty-icon">🔍</span><span>Escribí tu apellido para buscar</span></div>';
    if (hint) hint.textContent = '';
    return;
  }
  lista.innerHTML = '<div class="loading"><div class="spinner"></div> Buscando <strong>"' + q + '"</strong>...</div>';
  if (hint) hint.textContent = '';
  try {
    const cursoId = cursoSeleccionado?.id || '';
    const resultados = await apiFetch('GET', `/pub/buscar-alumno?q=${encodeURIComponent(q)}&carrera_id=${carreraId}&curso_id=${cursoId}`);
    _resultados = resultados;
    if (hint) {
      if (resultados.length === 0) hint.textContent = '';
      else hint.textContent = `${resultados.length} resultado${resultados.length>1?'s':''} encontrado${resultados.length>1?'s':''}`;
    }
    renderResultados(resultados, q);
  } catch(e) {
    lista.innerHTML = `<div class="alert alert-err">❌ Error al buscar: ${e.message}</div>`;
  }
}

function renderResultados(resultados, q) {
  const lista = document.getElementById('lista-resultados');
  if (!lista) return;

  if (!resultados.length) {
    lista.innerHTML = `
      <div style="border:2px dashed #fbbf24;border-radius:14px;padding:20px;text-align:center;background:#fffbeb;margin-top:8px">
        <div style="font-size:32px;margin-bottom:10px">🔎</div>
        <div style="font-weight:800;font-size:15px;color:#92400e;margin-bottom:8px">"${q}" no está en el sistema</div>
        <div style="font-size:13px;color:#78350f;margin-bottom:6px">Antes de pedir registro, probá estas búsquedas:</div>
        <div style="font-size:12px;color:#78350f;background:#fef9c3;border-radius:8px;padding:10px;margin-bottom:14px;text-align:left">
          ✏️ Solo el <strong>apellido</strong> (sin el nombre)<br/>
          ✏️ El apellido <strong>sin tilde</strong>: "Rodriguez" en vez de "Rodríguez"<br/>
          ✏️ Primeras 4 letras del apellido: "Garc" para "García"
        </div>
        <button class="btn btn-primary" style="max-width:280px;margin:0 auto" onclick="renderFormNuevo()">📝 No aparezco — pedir registro</button>
      </div>`;
    return;
  }

  // Agrupar por tipo
  const perfectos     = resultados.filter(r => r.match_tipo === 'perfecto');
  const sinCurso      = resultados.filter(r => r.match_tipo === 'misma_carrera_sin_curso');
  const otroCurso     = resultados.filter(r => r.match_tipo === 'misma_carrera_otro_curso');
  const otraCarrera   = resultados.filter(r => r.match_tipo === 'otra_carrera');
  const sinAsignar    = resultados.filter(r => r.match_tipo === 'sin_asignar');

  let html = '';

  // ── Coincidencias perfectas (misma carrera + mismo curso)
  if (perfectos.length) {
    html += `<div style="font-size:11px;font-weight:800;color:#166534;text-transform:uppercase;letter-spacing:.04em;margin-bottom:6px">✅ Encontrado en tu curso</div>`;
    html += perfectos.map((a, i) => itemAlumno(a, i, 'perfecto')).join('');
  }

  // ── Misma carrera pero sin curso asignado
  if (sinCurso.length) {
    html += `<div style="font-size:11px;font-weight:800;color:#2563eb;text-transform:uppercase;letter-spacing:.04em;margin:10px 0 6px">📋 En tu carrera — sin sección asignada aún</div>`;
    html += sinCurso.map((a, i) => itemAlumno(a, perfectos.length + i, 'sin_curso')).join('');
  }

  // ── Misma carrera pero otro año/curso
  if (otroCurso.length) {
    html += `<div style="font-size:11px;font-weight:800;color:#d97706;text-transform:uppercase;letter-spacing:.04em;margin:10px 0 6px">⚠️ En tu carrera — año diferente al seleccionado</div>`;
    html += otroCurso.map((a, i) => itemAlumno(a, perfectos.length + sinCurso.length + i, 'otro_curso')).join('');
  }

  // ── Sin asignar (ninguna carrera)
  if (sinAsignar.length) {
    html += `<div style="font-size:11px;font-weight:800;color:#7c3aed;text-transform:uppercase;letter-spacing:.04em;margin:10px 0 6px">📂 Registrado sin carrera asignada</div>`;
    html += sinAsignar.map((a, i) => itemAlumno(a, perfectos.length + sinCurso.length + otroCurso.length + i, 'sin_asignar')).join('');
  }

  // ── Otra carrera — NO se puede confirmar, solo avisar
  if (otraCarrera.length) {
    html += `<div style="font-size:11px;font-weight:800;color:#dc2626;text-transform:uppercase;letter-spacing:.04em;margin:10px 0 6px">🚨 Registrado en otra carrera</div>`;
    html += otraCarrera.map(a => `
      <div style="border:2px solid #fecaca;border-radius:14px;padding:14px 16px;margin-bottom:8px;background:#fef2f2">
        <div style="font-weight:800;font-size:14px;color:#991b1b">${a.apellido}, ${a.nombre}</div>
        <div style="font-size:12px;color:#7f1d1d;margin-top:4px">📚 Registrado en: <strong>${a.carrera_nombre}</strong>${a.curso_anio ? ' · ' + a.curso_anio + '° año' : ''}</div>
        <div style="font-size:12px;color:#7f1d1d;margin-top:2px">CI: ${a.ci || '—'}</div>
        <div style="margin-top:10px;padding:10px;background:#fef2f2;border-radius:8px;border:1px solid #fecaca">
          <div style="font-size:12px;color:#991b1b;font-weight:700">⚠️ Aparecés en <strong>${a.carrera_nombre}</strong>, no en ${carrera.nombre}.</div>
          <div style="font-size:11px;color:#7f1d1d;margin-top:4px">Si querés cambiar de carrera, hablá directamente con el director del ITS. No podés hacer el cambio desde aquí.</div>
        </div>
      </div>`).join('');
  }

  // Si la única coincidencia es otra carrera (no puede hacer nada), agregar opción de solicitar
  const puedeSolicitar = !perfectos.length && !sinCurso.length && !otroCurso.length && !sinAsignar.length;
  if (puedeSolicitar && otraCarrera.length) {
    html += `
      <div style="border:2px dashed #e5e7eb;border-radius:12px;padding:16px;text-align:center;margin-top:12px;background:#f9fafb">
        <div style="font-size:13px;color:#374151;margin-bottom:10px">¿Sos alumno nuevo de <strong>${carrera.nombre}</strong>?</div>
        <button class="btn btn-primary" style="max-width:260px;margin:0 auto" onclick="renderFormNuevo()">📝 Colocar mi nombre en la lista</button>
      </div>`;
  }

  lista.innerHTML = html;
}

function itemAlumno(a, idx, tipo) {
  const tieneCI = !!a.ci;
  const tieneTel = !!a.telefono;
  const incompleto = !tieneCI || !tieneTel;

  let borderColor = '#e2e8f0', bgColor = '#fff', tagHtml = '', nota = '';
  if (tipo === 'perfecto') {
    borderColor = '#86efac'; bgColor = '#f0fff4';
    tagHtml = `<span class="tag tag-ok">✅ Tu curso</span>`;
  } else if (tipo === 'sin_curso') {
    borderColor = '#93c5fd'; bgColor = '#eff6ff';
    tagHtml = `<span class="tag" style="background:#dbeafe;color:#1d4ed8">📋 Sin sección</span>`;
    nota = `<div style="font-size:11px;color:#1d4ed8;margin-top:4px">Al confirmar te asignaremos a ${cursoSeleccionado ? labelCurso(cursoSeleccionado) : 'tu curso'}</div>`;
  } else if (tipo === 'otro_curso') {
    borderColor = '#fcd34d'; bgColor = '#fffbeb';
    tagHtml = `<span class="tag tag-warn">⚠️ Año ${a.curso_anio || '?'}°</span>`;
    nota = `<div style="font-size:11px;color:#92400e;margin-top:4px">Estás en ${a.curso_anio}° año — verificá con el director si es correcto</div>`;
  } else if (tipo === 'sin_asignar') {
    borderColor = '#c4b5fd'; bgColor = '#faf5ff';
    tagHtml = `<span class="tag" style="background:#ede9fe;color:#7c3aed">📂 Sin carrera</span>`;
    nota = `<div style="font-size:11px;color:#7c3aed;margin-top:4px">Al confirmar te asignaremos a ${carrera.nombre}${cursoSeleccionado ? ' · ' + labelCurso(cursoSeleccionado) : ''}</div>`;
  }

  return `
    <div class="alumno-item ${incompleto ? 'incompleto' : ''}" style="border-color:${borderColor};background:${bgColor}"
      onclick="seleccionarAlumno(${idx})">
      <div style="flex:1;min-width:0">
        <div class="alumno-nombre">${a.apellido}, ${a.nombre}</div>
        <div class="alumno-detalle">
          ${tieneCI ? 'CI: ' + a.ci : '<span style="color:#d97706">⚠ Sin cédula</span>'}
          ${tieneTel ? ' · 📞 ' + a.telefono : ' · <span style="color:#d97706">Sin teléfono</span>'}
        </div>
        ${nota}
        ${incompleto ? '<div class="alumno-cta">✏️ Completá tus datos →</div>' : ''}
      </div>
      <div class="alumno-right">
        ${tagHtml}
        <span class="chevron">›</span>
      </div>
    </div>`;
}

function seleccionarAlumno(idx) {
  alumnoSeleccionado = _resultados[idx];
  renderFormCompletar(alumnoSeleccionado);
}

// PASO 2A: Completar datos de alumno existente
function renderFormCompletar(a) {
  const sinSeccion = !a.curso_id && cursoSeleccionado;
  const esOtraCarrera = a.carrera_id && a.carrera_id !== carreraId;
  const subLabel = cursoSeleccionado ? labelCurso(cursoSeleccionado) : '';
  const totalSteps = cursos.length > 1 ? 3 : 2;
  const app = document.getElementById('app');

  let avisoCarrera = '';
  if (esOtraCarrera) {
    avisoCarrera = `<div class="hint" style="background:#fef2f2;border-color:#fecaca">
      <span class="hint-icon">🚨</span>
      <div style="color:#991b1b"><strong>Estás en ${a.carrera_nombre}</strong><br/>
      <span style="font-size:12px">Al guardar, tus datos se actualizarán pero tu carrera actual no cambia. Contactá al director para cambiar de carrera.</span></div>
    </div>`;
  } else if (a.curso_anio && cursoSeleccionado && a.curso_anio != cursoSeleccionado.anio) {
    avisoCarrera = `<div class="hint">
      <span class="hint-icon">⚠️</span>
      <div style="color:#713f12"><strong>Estás registrado en ${a.curso_anio}° año</strong><br/>
      <span style="font-size:12px">Si querés cambiar de año, contactá al director. Podés actualizar tus datos de contacto.</span></div>
    </div>`;
  } else if (sinSeccion) {
    avisoCarrera = `<div class="hint" style="background:#eff6ff;border-color:#93c5fd">
      <span class="hint-icon">📌</span>
      <span style="color:#1e40af">Se te asignará a <strong>${subLabel}</strong> al guardar.</span>
    </div>`;
  }

  app.innerHTML = renderHeader(subLabel) + renderSteps(totalSteps-1, totalSteps) + `
  <div class="card">
    <button class="back-btn" onclick="renderStep1()">← Volver a la búsqueda</button>
    <h2>✏️ Completá tus datos</h2>
    <p style="font-size:13px;color:#718096;margin-bottom:14px">Corregí o agregá cualquier dato. Solo vos podés ver esta información.</p>
    ${avisoCarrera}
    <div id="err-completar"></div>
    <div class="grid2">
      <div class="field"><label>Nombre <span style="color:#dc2626">*</span></label>
        <input id="inp-nombre" value="${(a.nombre||'').replace(/"/g,'&quot;')}" placeholder="Tu nombre"/></div>
      <div class="field"><label>Apellido <span style="color:#dc2626">*</span></label>
        <input id="inp-apellido" value="${(a.apellido||'').replace(/"/g,'&quot;')}" placeholder="Tu apellido"/></div>
    </div>
    <div class="field"><label>Cédula de identidad <span style="color:#dc2626">*</span></label>
      <input id="inp-ci" type="tel" value="${(a.ci||'').replace(/"/g,'&quot;')}" placeholder="Solo números, sin puntos" inputmode="numeric"/>
      ${a.ci ? '<p style="font-size:11px;color:#6b7280;margin-top:4px">Podés corregirla si hay un error</p>' : ''}
    </div>
    <div class="field"><label>Teléfono <span style="color:#dc2626">*</span></label>
      <input id="inp-tel" type="tel" value="${(a.telefono||'').replace(/"/g,'&quot;')}" placeholder="Ej: 0981 123456" inputmode="tel"/>
    </div>
    <button class="btn btn-primary" onclick="guardarDatos()">💾 Guardar mis datos</button>
    <button class="btn btn-secondary" onclick="renderStep1()">← Volver</button>
  </div>`;
}

async function guardarDatos() {
  const nombre   = document.getElementById('inp-nombre')?.value.trim() || '';
  const apellido = document.getElementById('inp-apellido')?.value.trim() || '';
  const ci       = document.getElementById('inp-ci')?.value.replace(/[^0-9]/g,'') || '';
  const tel      = document.getElementById('inp-tel')?.value.trim() || '';
  const err      = document.getElementById('err-completar');
  if (!nombre || !apellido) { err.innerHTML = '<div class="alert alert-err">Nombre y apellido son obligatorios</div>'; return; }
  if (!ci) { err.innerHTML = '<div class="alert alert-err">Por favor ingresá tu número de cédula</div>'; return; }
  err.innerHTML = '<div class="loading"><div class="spinner"></div> Guardando...</div>';
  try {
    await apiFetch('POST', '/pub/alumno/completar', {
      alumno_id: alumnoSeleccionado.id,
      carrera_id: carreraId,
      nombre, apellido, ci,
      telefono: tel || undefined,
      curso_id: cursoSeleccionado?.id || undefined
    });
    renderExito('completar');
  } catch(e) {
    err.innerHTML = `<div class="alert alert-err">❌ ${e.message}</div>`;
  }
}

// PASO 2B: Solicitar incorporación (alumno no encontrado)
function renderFormNuevo() {
  const subLabel = cursoSeleccionado ? labelCurso(cursoSeleccionado) : '';
  const totalSteps = cursos.length > 1 ? 3 : 2;
  document.getElementById('app').innerHTML = renderHeader(subLabel) + renderSteps(totalSteps-1, totalSteps) + `
  <div class="card">
    <button class="back-btn" onclick="renderStep1()">← Volver a buscar mi nombre</button>
    <h2>📝 Colocar mi nombre en la lista</h2>
    <div class="hint" style="background:#fef9c3;border-color:#fde047;margin-bottom:16px">
      <span class="hint-icon">⚠️</span>
      <div style="color:#713f12">
        <strong>¿Ya intentaste buscar tu nombre?</strong><br/>
        <span style="font-size:12px">Si no apareció después de escribirlo, completá este formulario. El director revisará tu solicitud y te agregará al sistema.</span>
      </div>
    </div>
    <div id="err-nuevo"></div>
    <div class="field"><label>Nombre <span style="color:#dc2626">*</span></label><input id="inp-nombre" placeholder="Tu nombre" autocomplete="given-name"/></div>
    <div class="field"><label>Apellido <span style="color:#dc2626">*</span></label><input id="inp-apellido" placeholder="Tu apellido" autocomplete="family-name"/></div>
    <div class="field"><label>Cédula de identidad <span style="color:#dc2626">*</span></label><input id="inp-ci2" type="tel" placeholder="Solo números, sin puntos" inputmode="numeric"/></div>
    <div class="field"><label>Teléfono <span style="color:#dc2626">*</span></label><input id="inp-tel2" type="tel" placeholder="Ej: 0981 123456" inputmode="tel"/></div>
    <button class="btn btn-primary" onclick="enviarSolicitud()">📤 Enviar solicitud al director</button>
    <button class="btn btn-secondary" onclick="renderStep1()">← Volver a buscar</button>
  </div>`;
}

async function enviarSolicitud() {
  const nombre   = document.getElementById('inp-nombre').value.trim();
  const apellido = document.getElementById('inp-apellido').value.trim();
  const ci       = document.getElementById('inp-ci2').value.replace(/[^0-9]/g,'');
  const telefono = document.getElementById('inp-tel2').value.trim();
  const err      = document.getElementById('err-nuevo');
  if (!nombre || !apellido) { err.innerHTML = '<div class="alert alert-err">Completá nombre y apellido</div>'; return; }
  if (!ci)       { err.innerHTML = '<div class="alert alert-err">Ingresá tu número de cédula</div>'; return; }
  if (!telefono) { err.innerHTML = '<div class="alert alert-err">Ingresá tu número de teléfono</div>'; return; }
  err.innerHTML = '<div class="loading"><div class="spinner"></div> Enviando solicitud...</div>';
  try {
    await apiFetch('POST', '/pub/solicitud-registro', {
      nombre, apellido, ci, telefono,
      carrera_id: carreraId,
      curso_id: cursoSeleccionado?.id || null
    });
    renderExito('nuevo');
  } catch(e) {
    if (e.duplicate) {
      err.innerHTML = `<div class="alert" style="background:#fef9c3;border:1.5px solid #fbbf24;color:#92400e;border-radius:12px;padding:16px">
        <div style="font-weight:800;font-size:15px;margin-bottom:8px">⚠️ Ya estás registrado/a en el sistema</div>
        <div style="font-size:13px;margin-bottom:10px">${e.message}</div>
        <div style="font-size:12px;color:#78350f;margin-bottom:12px">Buscá tu nombre en la lista y completá tus datos desde ahí.</div>
        <button class="btn" style="background:#fef3c7;color:#92400e;border:1.5px solid #fbbf24;width:auto;padding:10px 20px" onclick="renderStep1()">← Volver a buscar mi nombre</button>
      </div>`;
    } else {
      err.innerHTML = `<div class="alert alert-err">❌ ${e.message}</div>`;
    }
  }
}

function renderExito(tipo) {
  document.getElementById('app').innerHTML = renderHeader() + `
  <div class="card">
    <div class="success-screen">
      <div class="success-icon">${tipo==='nuevo'?'📬':'✅'}</div>
      <div class="success-title">${tipo==='nuevo'?'¡Solicitud enviada!':'¡Datos guardados!'}</div>
      <div class="success-sub">${tipo==='nuevo'
        ? 'Tu solicitud fue enviada al director del ITS.<br/>Te avisarán cuando sea procesada.'
        : '¡Tus datos fueron registrados correctamente!<br/>Muchas gracias 😊'
      }</div>
      <button class="btn btn-secondary" style="margin-top:28px;width:auto;padding:12px 32px" onclick="init()">← Volver al inicio</button>
    </div>
  </div>`;
}

init();
</script>
</body>
</html>
