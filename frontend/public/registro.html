<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1"/>
<title>Registro de Alumno — ITS</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@latest/tabler-icons.min.css"/>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:'Segoe UI',system-ui,sans-serif;background:#f0f4f8;min-height:100vh;color:#1a202c}
.wrap{max-width:500px;margin:0 auto;padding:16px 14px 32px}

/* Header */
.header{background:linear-gradient(160deg,#1f8246 0%,#166534 60%,#14532d 100%);color:#fff;border-radius:18px;padding:22px 20px 18px;margin-bottom:14px;text-align:center;box-shadow:0 6px 24px rgba(22,101,52,.35)}
.header-logo{width:56px;height:56px;background:rgba(255,255,255,.2);border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:28px;margin:0 auto 10px}
.header h1{font-size:18px;font-weight:800;letter-spacing:-.3px}
.header-carrera{font-size:14px;opacity:.9;margin-top:4px;font-weight:600}
.header-sub{font-size:11px;opacity:.75;margin-top:6px;background:rgba(255,255,255,.18);display:inline-block;padding:3px 12px;border-radius:20px}

/* Steps */
.step-indicator{display:flex;gap:6px;margin-bottom:16px;justify-content:center;align-items:center;padding:0 20px}
.step{flex:1;height:5px;border-radius:3px;background:#e2e8f0;transition:background .3s}
.step.active{background:#166534}
.step.done{background:#22c55e}

/* Cards */
.card{background:#fff;border-radius:16px;padding:20px;box-shadow:0 2px 12px rgba(0,0,0,.07);margin-bottom:12px}
.card h2{font-size:15px;font-weight:800;margin-bottom:14px;color:#1a202c;display:flex;align-items:center;gap:8px}

/* Inputs */
input,select{width:100%;padding:12px 14px;border:2px solid #e2e8f0;border-radius:12px;font-size:15px;outline:none;transition:border .2s;background:#fafafa;color:#1a202c}
input:focus,select:focus{border-color:#166534;background:#fff;box-shadow:0 0 0 3px rgba(22,101,52,.12)}
label{font-size:12px;font-weight:700;color:#374151;margin-bottom:5px;display:block;text-transform:uppercase;letter-spacing:.04em}
.field{margin-bottom:14px}

/* Buttons */
.btn{width:100%;padding:14px;border:none;border-radius:12px;font-size:15px;font-weight:700;cursor:pointer;transition:all .15s;display:flex;align-items:center;justify-content:center;gap:8px}
.btn:active{transform:scale(.98)}
.btn-primary{background:linear-gradient(160deg,#1f8246,#166534);color:#fff;box-shadow:0 4px 14px rgba(22,101,52,.35)}
.btn-primary:hover{box-shadow:0 6px 20px rgba(22,101,52,.45)}
.btn-secondary{background:#f1f5f9;color:#374151;margin-top:8px;font-weight:600}
.btn-secondary:hover{background:#e2e8f0}

/* Hint banner */
.hint{background:linear-gradient(135deg,#fef9c3,#fef08a);border:1.5px solid #fde047;border-radius:12px;padding:12px 14px;margin-bottom:14px;font-size:13px;color:#713f12;display:flex;align-items:flex-start;gap:10px}
.hint-icon{font-size:20px;flex-shrink:0;margin-top:-1px}

/* Curso cards */
.curso-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:4px}
.curso-card{border:2.5px solid #e2e8f0;border-radius:16px;padding:18px 12px 14px;cursor:pointer;text-align:center;transition:all .18s;background:#fff;position:relative}
.curso-card:hover,.curso-card:active{border-color:#166534;background:#f0fff4;transform:translateY(-2px);box-shadow:0 6px 18px rgba(22,101,52,.18)}
.curso-card .anio{font-size:42px;font-weight:900;color:#166534;line-height:1}
.curso-card .label{font-size:12px;color:#6b7280;margin-top:2px;font-weight:600}
.curso-card .seccion{font-size:11px;font-weight:700;background:#dcfce7;color:#166534;border-radius:6px;padding:3px 10px;display:inline-block;margin-top:8px}
.curso-card .cnt{font-size:11px;color:#9ca3af;margin-top:6px}
.curso-card-tap{position:absolute;bottom:8px;right:10px;font-size:18px;opacity:.4}

/* Alumno items */
.alumno-item{padding:14px 16px;border:2px solid #e2e8f0;border-radius:14px;cursor:pointer;transition:all .15s;margin-bottom:8px;display:flex;justify-content:space-between;align-items:center;gap:10px;background:#fff;position:relative}
.alumno-item:hover,.alumno-item:active{border-color:#166534;background:#f0fff4;transform:translateX(2px)}
.alumno-item.incompleto{border-color:#fde047;background:#fefce8}
.alumno-nombre{font-weight:800;font-size:15px;color:#1a202c}
.alumno-detalle{font-size:12px;color:#718096;margin-top:3px}
.alumno-cta{font-size:11px;color:#d97706;margin-top:4px;font-weight:700;display:flex;align-items:center;gap:4px}
.alumno-right{display:flex;flex-direction:column;align-items:flex-end;gap:6px;flex-shrink:0}
.tag{font-size:11px;padding:3px 10px;border-radius:20px;font-weight:700;white-space:nowrap}
.tag-ok{background:#dcfce7;color:#166534}
.tag-warn{background:#fef3c7;color:#92400e}
.chevron{font-size:22px;color:#166534;font-weight:700;line-height:1}

/* Alerts */
.alert{padding:12px 14px;border-radius:10px;font-size:13px;margin-bottom:12px}
.alert-err{background:#fee2e2;color:#991b1b;border:1.5px solid #fecaca}
.alert-ok{background:#dcfce7;color:#166534;border:1.5px solid #bbf7d0}

/* Empty state */
.empty{text-align:center;color:#a0aec0;font-size:13px;padding:28px 0;display:flex;flex-direction:column;align-items:center;gap:6px}
.empty-icon{font-size:32px;opacity:.4}

/* Loading */
.loading{display:flex;align-items:center;justify-content:center;gap:12px;padding:28px;color:#718096;font-size:14px}
.spinner{width:22px;height:22px;border:2.5px solid #e2e8f0;border-top-color:#2563EB;border-radius:50%;animation:spin .7s linear infinite;flex-shrink:0}
@keyframes spin{to{transform:rotate(360deg)}}

/* Back btn */
.back-btn{background:none;border:none;color:#6b7280;font-size:13px;cursor:pointer;padding:4px 0;margin-bottom:14px;display:flex;align-items:center;gap:5px;font-weight:600}
.back-btn:hover{color:#374151}

/* No encontrado — oculto hasta que hay búsqueda sin resultados */
.no-encontrado{display:none;margin-top:16px;border-top:2px dashed #fde68a;padding-top:16px;text-align:center;background:#fffbeb;border-radius:12px;padding:16px}
.no-encontrado p{font-size:13px;color:#78350f;margin-bottom:12px;font-weight:600}
/* Instrucciones pasos */
.steps-guide{display:flex;flex-direction:column;gap:10px;margin-bottom:16px}
.step-guide{display:flex;align-items:flex-start;gap:12px;padding:12px 14px;border-radius:12px;background:#f0fff4;border:1.5px solid #bbf7d0}
.step-guide.active-step{background:#fff;border:2px solid #166534;box-shadow:0 0 0 4px rgba(22,101,52,.1)}
.step-num{width:28px;height:28px;border-radius:50%;background:#166534;color:#fff;font-size:13px;font-weight:900;display:flex;align-items:center;justify-content:center;flex-shrink:0}
.step-guide.inactive .step-num{background:#e2e8f0;color:#94a3b8}
.step-guide.inactive{background:#f8fafc;border-color:#e2e8f0;opacity:.7}
.step-txt strong{display:block;font-size:13px;font-weight:800;color:#166534}
.step-guide.inactive .step-txt strong{color:#94a3b8}
.step-txt span{font-size:11px;color:#6b7280}
/* Flecha animada */
@keyframes bounce-down{0%,100%{transform:translateY(0)}50%{transform:translateY(5px)}}
.arrow-down{text-align:center;font-size:22px;animation:bounce-down .8s infinite;color:#166534;margin:-4px 0 8px}

/* Success screen */
.success-screen{text-align:center;padding:32px 16px}
.success-icon{font-size:72px;margin-bottom:14px;animation:pop .4s ease}
@keyframes pop{0%{transform:scale(.5)}80%{transform:scale(1.12)}100%{transform:scale(1)}}
.success-title{font-size:22px;font-weight:900;color:#166534;margin-bottom:10px}
.success-sub{font-size:14px;color:#4a5568;line-height:1.7}

/* Grid 2-col form */
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
@media(max-width:380px){.grid2{grid-template-columns:1fr}}

/* ── Bienvenida premium ── */
@keyframes bv-up{from{transform:translateY(12px);opacity:0}to{transform:translateY(0);opacity:1}}
@keyframes bv-pop{from{transform:scale(0);opacity:0}to{transform:scale(1);opacity:1}}
@keyframes bv-pulse{0%,100%{transform:scale(1)}50%{transform:scale(1.08)}}

.bv-hero{background:linear-gradient(160deg,#1f8246 0%,#166534 60%,#14532d 100%);padding:32px 20px 48px;text-align:center;position:relative;margin:-16px -14px 0;animation:bv-up .4s ease both}
.bv-curve{position:absolute;bottom:-1px;left:0;right:0;height:36px;background:#f0f4f8;border-radius:30px 30px 0 0}
.bv-inst{font-size:17px;font-weight:800;color:#fff;letter-spacing:-.2px;animation:bv-up .45s .1s ease both}
.bv-inst-sub{font-size:11px;color:rgba(255,255,255,.6);letter-spacing:.1em;text-transform:uppercase;margin-top:4px;animation:bv-up .45s .18s ease both}
.bv-logo{width:72px;height:72px;border-radius:50%;background:#fff;border:4px solid rgba(255,255,255,.25);display:flex;align-items:center;justify-content:center;font-size:32px;margin:16px auto -36px;position:relative;z-index:2;animation:bv-pop .7s .1s cubic-bezier(.34,1.56,.64,1) both;overflow:hidden}
.bv-logo-img{width:100%;height:100%;object-fit:contain;border-radius:50%}

.bv-body{padding:44px 0 8px;display:flex;flex-direction:column;align-items:center;gap:10px}
.bv-heading{font-size:18px;font-weight:900;color:#111;text-align:center;animation:bv-up .45s .35s ease both}
.bv-sub{font-size:13px;color:#6b7280;text-align:center;margin-bottom:4px;animation:bv-up .45s .42s ease both}

.bv-btn{width:100%;background:#fff;border:2px solid #166534;border-radius:16px;padding:15px 16px;display:flex;align-items:center;gap:14px;text-align:left;cursor:pointer;transition:background .15s,transform .12s;box-shadow:none}
.bv-btn:hover{background:#f0fdf4;transform:translateY(-2px)}
.bv-btn:active{transform:scale(.98)}
.bv-btn-a{animation:bv-up .5s .5s ease both}
.bv-btn-b{animation:bv-up .5s .62s ease both}

.bv-ico-wrap{width:44px;height:44px;border-radius:12px;background:#e8f5ee;display:flex;align-items:center;justify-content:center;flex-shrink:0}
.bv-ico-wrap-a{animation:bv-pulse 2.4s 1s ease-in-out infinite}
.bv-ico{font-size:22px;color:#166534}

.bv-btn-h{font-size:14px;font-weight:800;color:#111;margin:0 0 3px}
.bv-btn-p{font-size:12px;color:#6b7280;margin:0}
.bv-arr{font-size:18px;color:#166534;margin-left:auto;flex-shrink:0}

.bv-footer{font-size:11px;color:#9ca3af;text-align:center;margin-top:4px;animation:bv-up .45s .75s ease both}
</style>
</head>
<body>
<div class="wrap" id="app">
  <div class="loading"><div class="spinner"></div> Cargando...</div>
</div>
<script>
const params = new URLSearchParams(location.search);
const carreraId = params.get('c'); // QR de una carrera puntual: deja esa carrera elegida en el registro de alumno nuevo

async function apiFetch(method, url, body) {
  const res = await fetch(url, {
    method,
    headers: { 'Content-Type': 'application/json' },
    body: body ? JSON.stringify(body) : undefined
  });
  let data = {};
  try { data = await res.json(); } catch {}
  if (!res.ok) {
    const err = new Error(data.error || 'Error de servidor');
    err.duplicate = !!data.duplicate;
    err.status = res.status;
    throw err;
  }
  return data;
}

let _carreras = [];
let _instData = null;

async function init() {
  try { [_carreras, _instData] = await Promise.all([
    apiFetch('GET', '/pub/carreras'),
    apiFetch('GET', '/pub/institucion')
  ]); } catch { try { _carreras = await apiFetch('GET', '/pub/carreras'); } catch {} }
  // Los links viejos con ?modo=alumno ("ya soy alumno") van directo a esa opción
  if (params.get('modo') === 'alumno') renderYaSoyAlumno();
  else renderBienvenida();
}

// ── PANTALLA INICIAL: dos opciones ─────────────────────────────────────────────
function renderBienvenida() {
  const app = document.getElementById('app');
  const instNombre = _instData?.nombre || 'ITS Santísima Trinidad';
  const logoHtml = _instData?.logo_base64
    ? `<img src="${_instData.logo_base64}" class="bv-logo-img" alt="Logo">`
    : `<span style="font-size:32px">🎓</span>`;
  app.innerHTML = `
    <div class="bv-hero">
      <div class="bv-inst">${instNombre}</div>
      <div class="bv-inst-sub">Sistema Académico Digital</div>
      <div class="bv-logo">${logoHtml}</div>
      <div class="bv-curve"></div>
    </div>
    <div class="bv-body">
      <div class="bv-heading">¡Bienvenido/a al ITS!</div>
      <div class="bv-sub">Elegí cómo querés continuar</div>
      <button class="bv-btn bv-btn-a" onclick="renderFormNuevoAlumno()">
        <div class="bv-ico-wrap bv-ico-wrap-a"><i class="ti ti-user-plus bv-ico" aria-hidden="true"></i></div>
        <div class="bv-btn-txt">
          <div class="bv-btn-h">Quiero registrarme</div>
          <div class="bv-btn-p">Soy alumno/a nuevo/a</div>
        </div>
        <i class="ti ti-chevron-right bv-arr" aria-hidden="true"></i>
      </button>
      <button class="bv-btn bv-btn-b" onclick="renderYaSoyAlumno()">
        <div class="bv-ico-wrap"><i class="ti ti-id-badge-2 bv-ico" aria-hidden="true"></i></div>
        <div class="bv-btn-txt">
          <div class="bv-btn-h">Ya soy alumno/a registrado/a</div>
          <div class="bv-btn-p">Quiero recibir mis datos de acceso otra vez</div>
        </div>
        <i class="ti ti-chevron-right bv-arr" aria-hidden="true"></i>
      </button>
      <p class="bv-footer">Si tenés dudas, acercate a la Secretaría del ITS</p>
    </div>`;
}

// ── YA SOY ALUMNO/A: nombre + apellido + cédula → se reenvían usuario y contraseña por WhatsApp ──────────────
function renderYaSoyAlumno() {
  document.getElementById('app').innerHTML = `
    <div class="header">
      <div class="header-logo">🔑</div>
      <h1>Ya soy alumno/a</h1>
      <div class="header-carrera">Recibí tus datos de acceso otra vez</div>
    </div>
    <div class="card" style="margin-top:8px">
      <button class="back-btn" onclick="renderBienvenida()">← Volver</button>
      <div class="hint"><span class="hint-icon">💡</span><span>Escribí tus datos como figuran en el ITS. Si coinciden, te enviamos tu <strong>usuario y contraseña por WhatsApp</strong>.</span></div>
      <div class="field">
        <label>Nombre/s <span style="color:#dc2626">*</span></label>
        <input id="ya-nombre" type="text" placeholder="Ej: María Alejandra" autocapitalize="words" autocomplete="given-name"/>
      </div>
      <div class="field">
        <label>Apellido/s <span style="color:#dc2626">*</span></label>
        <input id="ya-apellido" type="text" placeholder="Ej: González Romero" autocapitalize="words" autocomplete="family-name"/>
      </div>
      <div class="field">
        <label>Cédula de identidad <span style="color:#dc2626">*</span></label>
        <input id="ya-ci" type="tel" inputmode="numeric" placeholder="Solo números, sin puntos"/>
      </div>
      <div class="field" id="ya-tel-wrap" style="display:none">
        <label>Tu número de WhatsApp <span style="color:#dc2626">*</span></label>
        <input id="ya-tel" type="tel" inputmode="numeric" placeholder="Ej: 0981123456"/>
      </div>
      <div id="ya-msg"></div>
      <button class="btn btn-primary" id="ya-btn" onclick="enviarYaSoyAlumno()" style="margin-top:6px">📲 Enviarme mis datos</button>
    </div>`;
}

async function enviarYaSoyAlumno() {
  const val = id => document.getElementById(id)?.value.trim() || '';
  const nombre = val('ya-nombre'), apellido = val('ya-apellido'), ci = val('ya-ci').replace(/\D/g, ''), tel = val('ya-tel');
  const msg = document.getElementById('ya-msg'), btn = document.getElementById('ya-btn');
  const wrapTel = document.getElementById('ya-tel-wrap');
  const pidiendoTel = wrapTel.style.display !== 'none';
  const error = t => { msg.innerHTML = `<div class="alert alert-err">⚠️ ${t}</div>`; };
  if (!nombre)   return error('Ingresá tu nombre.');
  if (!apellido) return error('Ingresá tu apellido.');
  if (ci.length < 5) return error('Ingresá tu número de cédula.');
  if (pidiendoTel && tel.replace(/\D/g, '').length < 7) return error('Ingresá un número de WhatsApp válido.');
  msg.innerHTML = '<div class="loading"><div class="spinner"></div> Buscando tus datos…</div>';
  btn.disabled = true;
  try {
    const r = await apiFetch('POST', '/pub/alumno/reenviar-credenciales', { nombre, apellido, ci, telefono: pidiendoTel ? tel : undefined });
    btn.disabled = false;
    if (r.necesita_telefono) {
      // Te encontramos pero la ficha no tiene teléfono: se pide el WhatsApp y se vuelve a enviar
      wrapTel.style.display = '';
      msg.innerHTML = `<div class="alert alert-ok">✅ Te encontramos${r.nombre ? ', <strong>' + r.nombre + '</strong>' : ''}. No tenemos tu número de WhatsApp: escribilo y te mandamos tus datos ahí.</div>`;
      btn.textContent = '📲 Enviar a este número';
      document.getElementById('ya-tel')?.focus();
      return;
    }
    renderResultadoYa(r);
  } catch (e) {
    btn.disabled = false;
    error(e.message);
  }
}

function renderResultadoYa(r) {
  const nombre = r.nombre ? ', ' + r.nombre : '';
  let icono = '📲', titulo = '¡Listo' + nombre + '!', cuerpo = '';
  if (r.estado === 'enviado') {
    cuerpo = `Te enviamos tu <strong>usuario y contraseña por WhatsApp</strong> al número que termina en <strong>${r.termina}</strong>.${r.sinConfirmar ? '<br/><br/>Puede demorar unos minutos en llegar.' : ''}<br/><br/><span style="font-size:12px;color:#6b7280">Si ese número ya no es tuyo, avisá en la Secretaría del ITS.</span>`;
  } else if (r.estado === 'acceso_solicitado') {
    icono = '📝'; titulo = '¡Pedido registrado' + nombre + '!';
    cuerpo = 'Encontramos tu ficha, pero todavía no tenés usuario para el sistema.<br/>Dejamos tu pedido y la Dirección te habilitará el acceso. Te avisarán por WhatsApp.';
  } else if (r.estado === 'sin_carrera') {
    icono = 'ℹ️'; titulo = 'Casi' + nombre;
    cuerpo = 'Encontramos tu ficha, pero todavía no tiene una carrera asignada.<br/>Acercate a la Secretaría del ITS para completarla y habilitar tu acceso.';
  } else {
    cuerpo = 'Listo.';
  }
  document.getElementById('app').innerHTML = `
    <div class="header">
      <div class="header-logo">🎓</div>
      <h1>ITS Santísima Trinidad</h1>
    </div>
    <div class="card">
      <div class="success-screen">
        <div class="success-icon">${icono}</div>
        <div class="success-title">${titulo}</div>
        <div class="success-sub">${cuerpo}</div>
        <button class="btn btn-secondary" style="margin-top:28px;width:auto;padding:12px 32px" onclick="renderBienvenida()">← Volver al inicio</button>
      </div>
    </div>`;
}

// ── FORMULARIO NUEVO ALUMNO ────────────────────────────────────────────────────
function renderFormNuevoAlumno() {
  const app = document.getElementById('app');
  app.innerHTML = `
    <div class="header">
      <div class="header-logo">🎒</div>
      <h1>Registro de nuevo alumno</h1>
      <div class="header-carrera">Completá tus datos para acceder al sistema</div>
    </div>
    <div class="card" style="margin-top:8px">
      <button class="back-btn" onclick="renderBienvenida()">← Volver</button>
      <div class="hint"><span class="hint-icon">💡</span><span>Tus credenciales de acceso te llegarán por <strong>WhatsApp</strong> al número que ingreses.</span></div>
      <div class="field">
        <label>Nombre/s <span style="color:#dc2626">*</span></label>
        <input id="nv-nombre" type="text" placeholder="Ej: María Alejandra" autocapitalize="words"/>
      </div>
      <div class="field">
        <label>Apellido/s <span style="color:#dc2626">*</span></label>
        <input id="nv-apellido" type="text" placeholder="Ej: González Romero" autocapitalize="words"/>
      </div>
      <div class="grid2">
        <div class="field">
          <label>Cédula de identidad <span style="color:#dc2626">*</span></label>
          <input id="nv-ci" type="tel" inputmode="numeric" placeholder="Ej: 4512345"/>
        </div>
        <div class="field">
          <label>WhatsApp <span style="color:#dc2626">*</span></label>
          <input id="nv-tel" type="tel" inputmode="numeric" placeholder="Ej: 0981123456"/>
        </div>
      </div>
      <div class="field">
        <label>Carrera <span style="color:#dc2626">*</span></label>
        <select id="nv-carrera" onchange="cargarAniosNuevo()">
          <option value="">-- Seleccioná tu carrera --</option>
          ${_carreras.map(c=>`<option value="${c.id}">${c.nombre}</option>`).join('')}
        </select>
      </div>
      <div class="field">
        <label>Año que cursás <span style="color:#dc2626">*</span></label>
        <select id="nv-anio" onchange="cargarSeccionesNuevo()">
          <option value="">-- Primero seleccioná la carrera --</option>
        </select>
      </div>
      <div class="field" id="nv-seccion-wrap" style="display:none">
        <label>Sección <span style="color:#dc2626">*</span></label>
        <select id="nv-seccion">
          <option value="">-- Seleccioná la sección --</option>
        </select>
      </div>
      <div id="nv-error" class="alert alert-err" style="display:none"></div>
      <button class="btn btn-primary" id="nv-btn" onclick="enviarRegistroNuevo()" style="margin-top:6px">
        ✅ Registrarme y recibir acceso
      </button>
    </div>`;
  if (carreraId) {
    const sel = document.getElementById('nv-carrera');
    if (sel) { sel.value = carreraId; cargarAniosNuevo(); }
  }
}

let _cursosNuevo = [];

async function cargarAniosNuevo() {
  const carreraId2 = document.getElementById('nv-carrera')?.value;
  const selAnio = document.getElementById('nv-anio');
  const secWrap = document.getElementById('nv-seccion-wrap');
  if (!carreraId2 || !selAnio) return;
  selAnio.innerHTML = '<option value="">Cargando...</option>';
  if (secWrap) secWrap.style.display = 'none';
  _cursosNuevo = [];
  try {
    _cursosNuevo = await apiFetch('GET', '/pub/carrera/' + carreraId2 + '/cursos');
    const anios = [...new Set(_cursosNuevo.map(c => c.anio))].sort();
    selAnio.innerHTML = '<option value="">-- Seleccioná el año --</option>' +
      anios.map(a => `<option value="${a}">${a}° año</option>`).join('');
  } catch { selAnio.innerHTML = '<option value="">Error al cargar años</option>'; }
}

function cargarSeccionesNuevo() {
  const anio = document.getElementById('nv-anio')?.value;
  const secWrap = document.getElementById('nv-seccion-wrap');
  const selSec = document.getElementById('nv-seccion');
  if (!anio || !secWrap || !selSec) return;
  const secciones = _cursosNuevo.filter(c => String(c.anio) === String(anio) && c.division && c.division !== 'U');
  if (secciones.length > 1) {
    selSec.innerHTML = '<option value="">-- Seleccioná la sección --</option>' +
      secciones.map(s => `<option value="${s.division}">Sección ${s.division}</option>`).join('');
    secWrap.style.display = '';
  } else {
    secWrap.style.display = 'none';
    selSec.innerHTML = '';
  }
}

async function enviarRegistroNuevo() {
  const nombre   = document.getElementById('nv-nombre')?.value.trim();
  const apellido = document.getElementById('nv-apellido')?.value.trim();
  const ci       = document.getElementById('nv-ci')?.value.replace(/\D/g,'');
  const tel      = document.getElementById('nv-tel')?.value.replace(/\D/g,'');
  const carreraId2 = document.getElementById('nv-carrera')?.value;
  const anio     = document.getElementById('nv-anio')?.value;
  const secWrap  = document.getElementById('nv-seccion-wrap');
  const division = secWrap?.style.display !== 'none' ? (document.getElementById('nv-seccion')?.value || '') : '';
  const errEl    = document.getElementById('nv-error');
  const btn      = document.getElementById('nv-btn');
  const mostrarError = msg => { errEl.textContent = '⚠️ ' + msg; errEl.style.display = ''; errEl.scrollIntoView({behavior:'smooth',block:'nearest'}); };
  if (!nombre)     return mostrarError('Ingresá tu nombre.');
  if (!apellido)   return mostrarError('Ingresá tu apellido.');
  if (ci.length < 5) return mostrarError('Ingresá tu número de cédula.');
  if (tel.length < 7) return mostrarError('Ingresá un número de WhatsApp válido.');
  if (!carreraId2) return mostrarError('Seleccioná tu carrera.');
  if (!anio)       return mostrarError('Seleccioná el año que cursás.');
  if (secWrap?.style.display !== 'none' && !division) return mostrarError('Seleccioná tu sección (A o B).');
  errEl.style.display = 'none';
  btn.disabled = true;
  btn.textContent = '⏳ Registrando...';
  try {
    const data = await apiFetch('POST', '/pub/registro-directo', { nombre, apellido, ci, telefono: tel, carrera_id: carreraId2, anio, division: division || undefined });
    renderExitoNuevo(data.nombre, data.email);
  } catch(e) {
    btn.disabled = false;
    btn.textContent = '✅ Registrarme y recibir acceso';
    mostrarError(e.message);
    if (e.duplicate) {
      // Ya está en el sistema: se lo lleva a la otra opción en vez de dejarlo sin salida
      const b = document.createElement('button');
      b.className = 'btn btn-secondary'; b.style.marginTop = '10px';
      b.textContent = 'Ya soy alumno/a: recibir mis datos →';
      b.onclick = renderYaSoyAlumno;
      errEl.appendChild(b);
    }
  }
}

function renderExitoNuevo(nombre, email) {
  document.getElementById('app').innerHTML = `
    <div class="header">
      <div class="header-logo">🎓</div>
      <h1>ITS Santísima Trinidad</h1>
    </div>
    <div class="card">
      <div class="success-screen">
        <div class="success-icon">🎉</div>
        <div class="success-title">¡Registro exitoso, ${nombre}!</div>
        <div class="success-sub">
          Tu cuenta fue creada correctamente.<br/><br/>
          📲 <strong>Revisá tu WhatsApp</strong> — te enviamos tu usuario y contraseña para ingresar al sistema.<br/><br/>
          Tu usuario es: <strong style="color:#166534">${email}</strong><br/>
          Tu contraseña inicial es tu <strong>número de cédula</strong>.
        </div>
      </div>
    </div>`;
}


init();
</script>
