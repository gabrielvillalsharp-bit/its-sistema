<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1"/>
<title>ITS Santísima Trinidad — Carreras</title>
<style>
:root{
  --brand:#0f6e56;
  --brand-dk:#0a3d2f;
  --brand-lt:#1d9e75;
  --paper:#f2f8f5;
  --panel:#ffffff;
  --line:#dce8e2;
  --ink:#0f231b;
  --ink-soft:#4c655a;
  --ink-dim:#7c948a;
  --gold:#a8762f;
  --gold-bg:#fbf3e7;
  --gold-line:#e9d3ac;
  --serif: Georgia, "Iowan Old Style", "Palatino Linotype", Palatino, serif;
  --sans: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
  --mono: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace;
}
*{box-sizing:border-box}
html{scroll-behavior:smooth}
body{margin:0;background:var(--paper);color:var(--ink);font-family:var(--sans);-webkit-font-smoothing:antialiased;overflow-x:hidden}
::selection{background:var(--brand);color:#fff}
button{font-family:var(--sans)}
.wrap{max-width:640px;margin:0 auto;padding:0 18px 40px;min-height:100vh}

.screen{display:none}
.screen.active{display:block;animation:enter .4s cubic-bezier(.2,.8,.2,1) both}
@keyframes enter{from{opacity:0;transform:translateX(14px)}to{opacity:1;transform:none}}
@media (prefers-reduced-motion:reduce){.screen.active{animation:none}}

.hero{
  margin:0 -18px;padding:38px 22px 30px;background:linear-gradient(150deg,var(--brand-dk),var(--brand) 75%);
  color:#fff;border-radius:0 0 26px 26px;
}
.hero .eyebrow{font-family:var(--mono);font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:#bfe9d8;font-weight:600;margin-bottom:12px}
.hero h1{font-family:var(--serif);font-size:clamp(28px,8vw,38px);line-height:1.1;margin:0 0 12px;text-wrap:balance}
.hero h1 em{font-style:italic;color:#ffd98a}
.hero p{font-size:14px;line-height:1.6;color:#d7ede4;max-width:46ch;margin:0}

.grid-label{
  text-align:center;font-family:var(--mono);font-size:10.5px;letter-spacing:.14em;text-transform:uppercase;
  color:var(--ink-dim);margin:30px 0 14px;
}
.windows{display:grid;grid-template-columns:repeat(2,1fr);gap:11px}
.win{
  background:var(--panel);border:1.5px solid var(--line);border-radius:14px;padding:18px 14px;
  cursor:pointer;text-align:left;color:var(--ink-soft);transition:transform .15s,border-color .2s,box-shadow .2s;
  -webkit-tap-highlight-color:transparent;box-shadow:0 1px 2px rgba(15,35,27,.04);
}
.win .cod{font-family:var(--mono);font-size:9.5px;letter-spacing:.06em;color:var(--brand);font-weight:700;display:block;margin-bottom:7px}
.win .nom{font-family:var(--serif);font-size:15.5px;color:var(--ink);display:block;line-height:1.25}
.win:active{transform:scale(.96)}
.win:hover{border-color:var(--brand-lt);box-shadow:0 6px 18px rgba(15,110,86,.12)}
@media (min-width:560px){.windows{grid-template-columns:repeat(3,1fr)}}

.foot-note{text-align:center;margin-top:30px;font-family:var(--mono);font-size:10px;color:var(--ink-dim)}

.topbar{
  display:flex;align-items:center;justify-content:space-between;padding:16px 0;
  position:sticky;top:0;z-index:5;background:linear-gradient(180deg,var(--paper) 75%,transparent);margin:0 -18px;padding-left:18px;padding-right:18px;
}
.back-btn{
  background:none;border:1px solid var(--line);color:var(--ink-soft);font-size:12.5px;
  padding:7px 13px;border-radius:100px;cursor:pointer;display:flex;align-items:center;gap:6px;
}
.back-btn:hover{border-color:var(--brand);color:var(--brand)}
.progress{font-family:var(--mono);font-size:10px;color:var(--ink-dim)}

.steps-dots{display:flex;gap:6px;justify-content:center;margin:2px 0 18px}
.steps-dots span{width:7px;height:7px;border-radius:50%;background:var(--line)}
.steps-dots span.on{background:var(--brand);width:20px;border-radius:5px;transition:all .25s}

.kicker{font-family:var(--mono);font-size:10.5px;letter-spacing:.1em;text-transform:uppercase;color:var(--brand);font-weight:700;margin-bottom:8px}
.subpage-title{font-family:var(--serif);font-size:clamp(22px,7vw,28px);margin:0 0 6px;color:var(--brand-dk);text-wrap:balance}
h2.carrera-name{font-family:var(--serif);font-size:clamp(26px,8vw,34px);margin:0 0 4px;color:var(--brand-dk);text-wrap:balance}

.sec-label{
  font-family:var(--mono);font-size:10.5px;letter-spacing:.1em;text-transform:uppercase;
  color:var(--gold);font-weight:700;margin:22px 0 11px;display:flex;align-items:center;gap:8px;
}
.sec-label:first-of-type{margin-top:6px}
.sec-label::after{content:"";flex:1;height:1px;background:var(--line)}

.perfil-box,.objetivo{font-size:14.5px;line-height:1.7;color:var(--ink)}
.perfil-box{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:18px 18px;box-shadow:0 1px 3px rgba(15,35,27,.05)}

.salida{display:grid;gap:8px}
.salida li{
  list-style:none;background:var(--panel);border:1px solid var(--line);border-radius:10px;
  padding:11px 13px;font-size:13.5px;color:var(--ink-soft);display:flex;gap:9px;align-items:flex-start;
  box-shadow:0 1px 2px rgba(15,35,27,.03);
}
.salida li::before{content:"→";color:var(--brand);font-weight:700;flex-shrink:0}

.stats{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.stat{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:12px 13px}
.stat.full{grid-column:1/-1}
.stat .l{font-size:9.5px;color:var(--ink-dim);font-weight:600;text-transform:uppercase;letter-spacing:.05em;margin-bottom:4px}
.stat .v{font-size:13.5px;font-weight:700;color:var(--ink)}

.reqs{display:grid;gap:7px}
.reqs li{list-style:none;font-size:13.5px;color:var(--ink-soft);display:flex;gap:8px}
.reqs li::before{content:"✓";color:var(--brand)}

.precio-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.precio{border:1px solid var(--gold-line);background:var(--gold-bg);border-radius:12px;padding:16px 14px;text-align:center}
.precio.matricula{border-color:#bfe4d2;background:#eefaf3}
.precio .l{font-family:var(--mono);font-size:9.5px;letter-spacing:.06em;text-transform:uppercase;color:var(--ink-dim);margin-bottom:6px}
.precio .v{font-size:19px;font-weight:800;color:var(--gold);font-variant-numeric:tabular-nums}
.precio.matricula .v{color:var(--brand);font-size:17px}

.hook{background:var(--gold-bg);border:1px solid var(--gold-line);border-radius:12px;padding:15px 16px;font-size:13.5px;line-height:1.6;color:#4a3510}
.hook b{color:var(--gold)}

.nav-fixed{display:flex;gap:8px;margin-top:26px}
.btn-main{
  flex:1;background:var(--brand);color:#fff;font-weight:800;font-size:14px;padding:14px 18px;
  border-radius:100px;text-decoration:none;text-align:center;box-shadow:0 10px 26px rgba(15,110,86,.28);
  border:none;cursor:pointer;
}
.btn-ghost{
  background:var(--panel);border:1.5px solid var(--line);color:var(--ink-soft);font-weight:700;font-size:14px;
  padding:14px 18px;border-radius:100px;cursor:pointer;white-space:nowrap;
}
.btn-ghost:hover{border-color:var(--brand);color:var(--brand)}

.confirm-box{
  text-align:center;padding:50px 20px;background:var(--panel);border:1px solid var(--line);border-radius:18px;
  box-shadow:0 4px 20px rgba(15,35,27,.06);
}
.confirm-box .ico{font-size:46px;margin-bottom:14px}
.confirm-box h2{font-family:var(--serif);color:var(--brand-dk);font-size:24px;margin:0 0 10px}
.confirm-box p{font-size:14px;color:var(--ink-soft);line-height:1.6;max-width:38ch;margin:0 auto 22px}
</style>
</head>
<body>
<div class="wrap">

  <section class="screen active" id="screen-home">
    <div class="hero">
      <div class="eyebrow">Instituto Técnico Superior · Santísima Trinidad</div>
      <h1>Tu carrera empieza<br><em>cuando cae el sol.</em></h1>
      <p>9 carreras técnicas, turno nocturno, para quien ya trabaja de día. Tocá una carrera para conocerla.</p>
    </div>
    <div class="grid-label">— elegí tu carrera —</div>
    <div class="windows" id="windows"></div>
    <div class="foot-note">its-sistema-production.up.railway.app/inscripcion</div>
  </section>

  <section class="screen" id="screen-carrera"></section>

  <section class="screen" id="screen-confirm"></section>

</div>

<script>
const CARRERAS = [
  { cod:'AGR', nombre:'Agropecuaria', dias:'Martes, Miércoles y Jueves', cuota:'300.000',
    perfil:'Un profesional capaz de gestionar cultivos, producción animal, suelos y agroindustria con criterio de rentabilidad y sostenibilidad: el perfil técnico que necesita el campo paraguayo para modernizarse.',
    objetivo:'Formar técnicos capaces de gestionar cultivos, producción animal, suelos y agroindustria con criterio de rentabilidad y sostenibilidad.',
    salida:['Establecimientos agropecuarios y agroindustrias de la zona','Cooperativas y empresas de insumos agrícolas','Emprendimiento propio: huerta, cría, apicultura','Asesoría técnica a productores del interior'],
    hook:'Paraguay exporta lo que el campo produce: es de los títulos técnicos con salida real en el interior, y habilita a armar un emprendimiento propio sin depender de un empleador.' },
  { cod:'CON', nombre:'Contabilidad', dias:'Lunes, Miércoles y Viernes', cuota:'300.000',
    perfil:'Un técnico en registro y análisis contable, liquidación de impuestos, gestión de sueldos y estados financieros para empresas, comercios y emprendimientos de cualquier rubro.',
    objetivo:'Formar técnicos capaces de llevar la contabilidad completa de una empresa o emprendimiento, con criterio impositivo y financiero actualizado.',
    salida:['Estudios contables y de auditoría','Departamentos de administración de empresas','Cooperativas y comercios de la zona','Emprendimiento propio: asesoría contable a PyMEs'],
    hook:'No existe una empresa sin contabilidad: es el título con salida laboral más inmediata, y desde 2° año ya se puede empezar a hacer changas contables por cuenta propia.' },
  { cod:'COS', nombre:'Cosmiatría', dias:'Martes, Miércoles y Jueves', cuota:'300.000',
    perfil:'Un especialista en tratamientos faciales y corporales, cuidado de la piel y estética integral, con base científica en dermatología aplicada.',
    objetivo:'Formar técnicos capaces de evaluar y aplicar tratamientos estéticos faciales y corporales con criterio dermatológico y seguridad clínica.',
    salida:['Centros de estética y spas','Clínicas dermatológicas','Gabinete propio','Salones de belleza de la zona'],
    hook:'La industria de la belleza no para de crecer en Paraguay: al egresar se puede montar un gabinete propio y facturar desde el primer cliente.' },
  { cod:'CRM', nombre:'Criminalística', dias:'Martes, Miércoles y Jueves', cuota:'300.000',
    perfil:'Un técnico en investigación de escena del crimen, recolección y cadena de custodia de evidencias, y apoyo pericial a la justicia y las fuerzas de seguridad.',
    objetivo:'Formar técnicos capaces de intervenir en la escena del crimen preservando evidencia con validez pericial, en apoyo a la justicia y la seguridad pública.',
    salida:['Policía Nacional','Ministerio Público y Poder Judicial','Estudios jurídicos y peritajes privados','Empresas de seguridad'],
    hook:'Perfil poco común y muy buscado: la Policía Nacional, el Ministerio Público y los estudios jurídicos necesitan técnicos formados en esto, y en el interior casi no hay oferta.' },
  { cod:'ELC', nombre:'Electricidad', dias:'Martes, Miércoles y Jueves', cuota:'300.000',
    perfil:'Un técnico en instalaciones eléctricas domiciliarias e industriales, mantenimiento de motores y tableros, con nociones de energías renovables.',
    objetivo:'Formar técnicos capaces de instalar y mantener sistemas eléctricos domiciliarios e industriales de forma segura y normada.',
    salida:['Instalaciones domiciliarias e industriales','Empresas constructoras','Mantenimiento industrial','Trabajo independiente / contratista'],
    hook:'Es uno de los oficios técnicos mejor pagos por trabajo independiente: un electricista matriculado nunca se queda sin changas, ni en épocas de crisis.' },
  { cod:'ENF', nombre:'Enfermería', dias:'Lunes, Miércoles y Viernes', cuota:'300.000',
    perfil:'Un técnico en cuidados básicos y asistencia al paciente: control de signos vitales, administración de medicamentos y apoyo en procedimientos clínicos.',
    objetivo:'Formar técnicos capaces de asistir al paciente y al equipo de salud con criterio clínico, ético y humano.',
    salida:['Hospitales y sanatorios','Clínicas privadas','Centros de salud del interior','Atención domiciliaria'],
    hook:'Hay faltante real de personal técnico en enfermería en Paraguay: sanatorios, clínicas y hospitales de la zona están buscando activamente este perfil.' },
  { cod:'FAR', nombre:'Farmacia', dias:'Lunes, Miércoles y Viernes', cuota:'300.000',
    perfil:'Un técnico en dispensación de medicamentos, atención al público en farmacias, control de stock y buenas prácticas de almacenamiento.',
    objetivo:'Formar técnicos capaces de dispensar medicamentos y asesorar al público con responsabilidad sanitaria.',
    salida:['Farmacias privadas y de cadena','Droguerías y distribuidoras','Farmacia propia','Depósitos de medicamentos'],
    hook:'Hay cientos de farmacias solo en la zona y todas necesitan un técnico habilitado: salida laboral rápida, con la puerta abierta a tener una farmacia propia.' },
  { cod:'IQ', nombre:'Instrumentación Quirúrgica', dias:'Lunes, Miércoles y Viernes', cuota:'300.000',
    perfil:'Un técnico especializado en el instrumental y los procedimientos dentro del quirófano, asistiendo directamente al cirujano durante la intervención.',
    objetivo:'Formar técnicos capaces de preparar, gestionar y asistir con el instrumental quirúrgico durante una intervención, bajo estrictos protocolos de asepsia.',
    salida:['Quirófanos de hospitales y sanatorios','Clínicas privadas con cirugía','Centros quirúrgicos ambulatorios','Empresas de insumos médicos'],
    hook:'Especialización de alta exigencia y buena remuneración: se trabaja codo a codo con cirujanos, en un rol clave que muy pocos institutos del país ofrecen.' },
  { cod:'RAD', nombre:'Radiología', dias:'Lunes, Miércoles y Viernes', cuota:'300.000',
    perfil:'Un técnico en operación de equipos de diagnóstico por imágenes (rayos X, tomografía, ecografía), con manejo de protocolos de bioseguridad radiológica.',
    objetivo:'Formar técnicos capaces de operar equipos de diagnóstico por imágenes con criterio de bioseguridad radiológica y calidad de imagen.',
    salida:['Centros de diagnóstico por imágenes','Hospitales y sanatorios','Clínicas privadas','Consultorios radiológicos'],
    hook:'Carrera de salud con excelente remuneración relativa y alta demanda en clínicas y centros de diagnóstico — se trabaja con la tecnología más moderna del sector.' },
];
const REQ_COMUNES = ['Certificado de nacimiento', 'Fotocopia de cédula de identidad', 'Fotocopia de certificado de estudios'];
const INSCRIPCION_URL = '/inscripcion';

const winRail = document.getElementById('windows');
const screenHome = document.getElementById('screen-home');
const screenCarrera = document.getElementById('screen-carrera');
const screenConfirm = document.getElementById('screen-confirm');

CARRERAS.forEach((c, i) => {
  const btn = document.createElement('button');
  btn.className = 'win';
  btn.innerHTML = `<span class="cod">${c.cod}</span><span class="nom">${c.nombre}</span>`;
  btn.onclick = () => goToCarrera(i, 1);
  winRail.appendChild(btn);
});

function dots(step){
  return `<div class="steps-dots">${[1,2,3].map(n=>`<span class="${n===step?'on':''}"></span>`).join('')}</div>`;
}
function topbar(c, step){
  return `<div class="topbar">
    <button class="back-btn" onclick="goHome()">← Todas las carreras</button>
    <div class="progress">${c.cod} · ${step}/3</div>
  </div>`;
}

function renderStep1(c){
  return `
    ${topbar(c,1)}
    <div class="kicker">Técnico Superior · 2 años · Nocturno</div>
    <h2 class="carrera-name">${c.nombre}</h2>
    ${dots(1)}
    <div class="sec-label">Descripción de la carrera</div>
    <div class="perfil-box">${c.perfil}</div>
    <div class="nav-fixed">
      <button class="btn-main" onclick="stepSub(1)">Objetivo y salida laboral →</button>
    </div>
  `;
}
function renderStep2(c){
  return `
    ${topbar(c,2)}
    <div class="kicker">${c.nombre}</div>
    <div class="subpage-title">Objetivo y salida laboral</div>
    ${dots(2)}
    <div class="sec-label">Objetivo de la carrera</div>
    <div class="objetivo">${c.objetivo}</div>
    <div class="sec-label">Salida laboral</div>
    <ul class="salida">${c.salida.map(s => `<li>${s}</li>`).join('')}</ul>
    <div class="nav-fixed">
      <button class="btn-ghost" onclick="stepSub(-1)">← Atrás</button>
      <button class="btn-main" onclick="stepSub(1)">Horarios y valores →</button>
    </div>
  `;
}
function renderStep3(c){
  return `
    ${topbar(c,3)}
    <div class="kicker">${c.nombre}</div>
    <div class="subpage-title">Horarios, requisitos y valores</div>
    ${dots(3)}
    <div class="sec-label">Horarios y duración</div>
    <div class="stats">
      <div class="stat"><div class="l">Duración</div><div class="v">2 años</div></div>
      <div class="stat"><div class="l">Turno</div><div class="v">19:00 / 20:40 hs</div></div>
      <div class="stat full"><div class="l">Días de cursada</div><div class="v">${c.dias}</div></div>
    </div>
    <div class="sec-label">Requisitos — documentos</div>
    <ul class="reqs">${REQ_COMUNES.map(r => `<li>${r}</li>`).join('')}</ul>
    <div class="sec-label">Valores</div>
    <div class="precio-grid">
      <div class="precio matricula"><div class="l">Matrícula</div><div class="v">GRATIS</div></div>
      <div class="precio"><div class="l">Cuota mensual</div><div class="v">Gs. ${c.cuota}</div></div>
    </div>
    <div class="sec-label">¿Por qué elegirla?</div>
    <div class="hook">💡 ${c.hook}</div>
    <div class="nav-fixed">
      <button class="btn-ghost" onclick="stepSub(-1)">← Atrás</button>
      <button class="btn-main" onclick="irAInscripcion('${c.nombre.replace(/'/g,"\\'")}')">📝 Inscribirme</button>
    </div>
  `;
}
const STEPS = [renderStep1, renderStep2, renderStep3];

let currentIndex = 0;
let currentStep = 1;

function renderCarreraPage(){
  screenCarrera.innerHTML = STEPS[currentStep - 1](CARRERAS[currentIndex]);
}
function goToCarrera(i, step){
  currentIndex = i; currentStep = step || 1;
  renderCarreraPage();
  showScreen(screenCarrera);
  history.pushState({page:'carrera', i, step:currentStep}, '', '#' + CARRERAS[i].cod.toLowerCase() + '/' + currentStep);
}
function stepSub(delta){
  currentStep = Math.min(3, Math.max(1, currentStep + delta));
  renderCarreraPage();
  window.scrollTo({top:0});
  history.pushState({page:'carrera', i:currentIndex, step:currentStep}, '', '#' + CARRERAS[currentIndex].cod.toLowerCase() + '/' + currentStep);
}
function goHome(){
  showScreen(screenHome);
  history.pushState({page:'home'}, '', '#');
}
function showScreen(target){
  [screenHome, screenCarrera, screenConfirm].forEach(s => s.classList.remove('active'));
  void target.offsetWidth;
  target.classList.add('active');
  window.scrollTo({top:0});
}

function irAInscripcion(nombreCarrera){
  screenConfirm.innerHTML = `
    <div class="topbar"><button class="back-btn" onclick="goHome()">← Todas las carreras</button></div>
    <div class="confirm-box">
      <div class="ico">🚀</div>
      <h2>Abriendo el formulario…</h2>
      <p>Te estamos llevando al formulario oficial de inscripción para <b>${nombreCarrera}</b>. Completalo con tus datos y Dirección te contacta por WhatsApp para confirmar tu cupo.</p>
      <a class="btn-main" style="display:inline-block;text-decoration:none" href="${INSCRIPCION_URL}" target="_blank" rel="noopener">Abrir formulario ahora</a>
    </div>
  `;
  showScreen(screenConfirm);
  history.pushState({page:'confirm'}, '', '#inscripcion');
  setTimeout(() => window.open(INSCRIPCION_URL, '_blank'), 900);
}

window.addEventListener('popstate', (e) => {
  const st = e.state;
  if (!st || st.page === 'home') { showScreen(screenHome); return; }
  if (st.page === 'carrera') { currentIndex = st.i; currentStep = st.step; renderCarreraPage(); showScreen(screenCarrera); return; }
  if (st.page === 'confirm') { showScreen(screenConfirm); return; }
});

(function initFromHash(){
  const parts = location.hash.replace('#','').split('/');
  const idx = CARRERAS.findIndex(c => c.cod === parts[0].toUpperCase());
  if (idx >= 0) { goToCarrera(idx, parseInt(parts[1],10) || 1); }
})();
</script>
</body>
</html>
